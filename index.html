/* ============================================================
   🎯 任務系統 CSS (新增)
   ============================================================ */
.task-progress-bar {
    background: linear-gradient(90deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
    border: 1px solid rgba(212,175,55,0.3);
}
.task-progress-bar .bar-fill {
    background: linear-gradient(90deg, #D4AF37, #FFD700);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.task-progress-bar .bar-fill.complete {
    background: linear-gradient(90deg, #00FF00, #00CC88);
}
.task-item {
    transition: all 0.2s ease;
}
.task-item:active {
    transform: scale(0.98);
}
.task-item .task-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.task-item .task-icon.core {
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.3);
}
.task-item .task-icon.daily {
    background: rgba(0,255,0,0.08);
    border: 1px solid rgba(0,255,0,0.2);
}
.task-item .task-progress-mini {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
}
.task-item .task-progress-mini .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
}

/* ============================================================
   🌍 區域探索進度 CSS (地圖左上角)
   ============================================================ */
#region-progress-container {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1000;
    padding: 8px 12px;
    min-width: 140px;
    max-width: 200px;
    pointer-events: none;
    transition: all 0.3s ease;
    text-shadow: 0 1px 8px rgba(0,0,0,0.9), 0 0 16px rgba(0,0,0,0.8);
}
#region-progress-container .title {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 4px;
}
#region-progress-container .region-item {
    margin-bottom: 4px;
}
#region-progress-container .region-item:last-child {
    margin-bottom: 0;
}
#region-progress-container .region-row {
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: rgba(255, 255, 255, 0.7);
}
#region-progress-container .region-row .label {
    display: flex;
    align-items: center;
    gap: 4px;
}
#region-progress-container .region-row .count {
    font-weight: 600;
}
#region-progress-container .region-row .count.done {
    color: #00FF00;
}
#region-progress-container .region-bar {
    height: 3px;
    background: rgba(255, 255, 255, 0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 2px;
}
#region-progress-container .region-bar .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.6s ease;
}
#region-progress-container .region-bar .fill.done {
    background: linear-gradient(90deg, #00FF00, #00CC88);
}
#region-progress-container .region-bar .fill.partial {
    background: linear-gradient(90deg, #D4AF37, #FFD700);
}
#region-progress-container .hint {
    font-size: 7px;
    color: rgba(255, 255, 255, 0.2);
    text-align: center;
    margin-top: 4px;
    letter-spacing: 0.5px;
}

/* ============================================================
   ⭐ 個人標記升級 CSS (地圖標記)
   ============================================================ */
@keyframes markerPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
    50% { box-shadow: 0 0 24px rgba(212, 175, 55, 0.7), 0 0 48px rgba(212, 175, 55, 0.3); }
}
@keyframes markerFloat {
    0%, 100% { transform: rotate(-45deg) translateY(0); }
    50% { transform: rotate(-45deg) translateY(-4px); }
}
.marker-level-2 {
    animation: markerPulse 2s ease-in-out infinite;
}
.marker-level-3 {
    animation: markerFloat 3s ease-in-out infinite;
}

/* ============================================================
   貢獻徽章 CSS (店鋪詳情)
   ============================================================ */
.contribution-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 600;
}
.contribution-badge.level-1 {
    background: rgba(212, 175, 55, 0.12);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #D4AF37;
}
.contribution-badge.level-2 {
    background: rgba(212, 175, 55, 0.2);
    border: 1px solid rgba(212, 175, 55, 0.5);
    color: #D4AF37;
    box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
}
.contribution-badge.level-3 {
    background: linear-gradient(135deg, rgba(212, 175, 55, 0.25), rgba(255, 215, 0, 0.15));
    border: 1px solid #D4AF37;
    color: #FFD700;
    box-shadow: 0 0 30px rgba(212, 175, 55, 0.25);
}
.contribution-badge .progress-text {
    font-size: 9px;
    color: rgba(255, 255, 255, 0.4);
    font-weight: 400;
}

/* ============================================================
   任務完成動畫
   ============================================================ */
@keyframes taskComplete {
    0% { transform: scale(1); }
    30% { transform: scale(1.05); background: rgba(0, 255, 0, 0.1); }
    100% { transform: scale(1); }
}
.task-item.completing {
    animation: taskComplete 0.5s ease;
}
@keyframes scorePop {
    0% { transform: scale(0.5); opacity: 0; }
    60% { transform: scale(1.3); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
}
.score-pop {
    animation: scorePop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ============================================================
   懸賞任務 CSS (前台)
   ============================================================ */
.bounty-card {
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 12px;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.02);
    transition: all 0.2s ease;

.bounty-card:active {

}
.bounty-card .bounty-status-open {

.bounty-card .bounty-status-in-progress {
    color: #FFB800;
}
.bounty-card .bounty-status-completed {
    color: #D4AF37;
}
.bounty-card .bounty-reward {
    font-size: 14px;
    font-weight: 700;
    color: #D4AF37;
}
</style>

// 獲取今日任務進度
function getTaskProgress() {
    var today = todayKey();
    if (!STATE.taskProgress) STATE.taskProgress = {};
    if (!STATE.taskProgress[today]) {
        STATE.taskProgress[today] = {
            submit_store: 0,
            verify_store: 0,
            supplement: 0,
            checkin: 0,
            machine_checkin: 0,
            share: 0,
            total_points: 0,
            goal_reached: false,
            goal_rewarded: false
        };
    }
    return STATE.taskProgress[today];
}

// 計算今日總得分
function calculateDailyScore(progress) {
    if (!progress) progress = getTaskProgress();
    var total = 0;
    for (var key in TASK_TYPES) {
        var done = progress[key] || 0;
        total += done * TASK_TYPES[key].points;
    }
    return total;
}

// 檢查是否達標 (50分)
function isDailyGoalReached(progress) {
    if (!progress) progress = getTaskProgress();
    return calculateDailyScore(progress) >= 50;
}

// 記錄任務完成
async function recordTaskCompletion(taskKey) {
    var progress = getTaskProgress();
    var task = TASK_TYPES[taskKey];
    if (!task) return false;
    
    // 檢查是否已達上限
    var current = progress[taskKey] || 0;
    if (current >= task.limit) {
        toast('⚠️ 今日 ' + task.label + ' 已達上限 (' + task.limit + ' 次)', 'pink');
        return false;
    }
    
    // 更新進度
    progress[taskKey] = current + 1;
    progress.total_points = calculateDailyScore(progress);
    
    // 檢查是否達標
    var wasReached = progress.goal_reached || false;
    var isReached = progress.total_points >= 50;
    
    if (isReached && !wasReached) {
        progress.goal_reached = true;
        progress.goal_rewarded = true;
        // 額外獎勵 +20 分 (不計入進度)
        await addPoints(20, '🎯 每日任務達標獎勵！');
        toast('🎉 恭喜達成今日目標！獲得 +20 獎勵積分！', 'gold');
    }
    
    save();
    
    // 同步到雲端
    if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
        try {
            await syncTaskProgress(progress);
        } catch (e) {

    kl: { label: '九龍區', icon: '🏙️', districts: ['旺角', '尖沙咀', '觀塘', '深水埗', '紅磡', '藍田', '油麻地', '九龍城', '土瓜灣', '黃大仙', '牛頭角', '九龍灣', '秀茂坪', '油塘', '樂富', '啟德', '黃埔', '慈雲山', '大角咀', '荔枝角'] },
    nt: { label: '新界區', icon: '🌳', districts: ['屯門', '荃灣', '元朗', '葵芳', '將軍澳', '大埔', '葵興', '天水圍', '沙田', '大圍', '馬鞍山', '上水', '粉嶺', '青衣', '東涌', '昂坪', '坑口', '調景嶺', '日出康城', '西貢'] }
};

// 計算區域探索進度
function calculateRegionProgress(regionKey) {
    var region = REGION_KEYS[regionKey];
    if (!region) return { total: 0, verified: 0, percentage: 0, isComplete: false };
    
    var districts = region.districts;
    var totalStores = STORES.filter(function(s) {
        return districts.indexOf(s.region) !== -1;
    });
    var verifiedStores = totalStores.filter(function(s) {
        return s.status === 'verified' || s.verified === 'verified';
    });
    
    return {
        total: totalStores.length,
        verified: verifiedStores.length,
        percentage: totalStores.length > 0 ? Math.round((verifiedStores.length / totalStores.length) * 100) : 0,
        isComplete: totalStores.length > 0 && verifiedStores.length >= totalStores.length
    };
}

// 渲染區域探索進度 HTML
function renderRegionProgress() {
    var html = '<div id="region-progress-container">' +
        '<div class="title">🌍 區域探索進度</div>';
    
    for (var key in REGION_KEYS) {
        var region = REGION_KEYS[key];
        var progress = calculateRegionProgress(key);
        var isComplete = progress.isComplete && progress.total > 0;
        var fillClass = isComplete ? 'done' : (progress.percentage > 0 ? 'partial' : '');
        var countClass = isComplete ? 'done' : '';
        
        html += '<div class="region-item">' +
            '<div class="region-row">' +
                '<span class="label">' + region.icon + ' ' + region.label + '</span>' +
                '<span class="count ' + countClass + '">' + progress.verified + '/' + progress.total + '</span>' +
            '</div>' +
            '<div class="region-bar">' +
                '<div class="fill ' + fillClass + '" style="width:' + progress.percentage + '%;"></div>' +
            '</div>' +
        '</div>';
    }
    
    html += '<div class="hint">💡 協助認證店鋪，推進區域進度！</div>';
    html += '</div>';
    
    return html;
}

// 更新區域探索進度 (在地圖上)
function updateRegionProgress() {
    var container = document.getElementById('region-progress-container');
    if (!container) {
        var wrapper = document.getElementById('map-wrapper');
        if (wrapper) {
            var newContainer = document.createElement('div');
            newContainer.id = 'region-progress-container';
            newContainer.innerHTML = renderRegionProgress();
            wrapper.appendChild(newContainer);
        }
        return;
    }
    container.innerHTML = renderRegionProgress();
}

// 獲取用戶對特定店鋪的貢獻值
function getUserContribution(storeId) {
    var store = STORES.find(function(s) { return s.id === storeId; });
    if (!store) return 0;
    
    var device = STATE.user.device;
    var count = 0;
    
    // 提交店鋪 +1
    if (store.submitted_by === device) count += 1;
    
    // 認證店鋪 +1
    if (store._userVerified) count += 1;
    
    // 補充資料 +1
    if (store._userSupplemented) count += 1;
    
    // 機台共享 +1
    if (store.machines && store.machines.some(function(m) { return m.submitted_by === device; })) {
        count += 1;
    }
    
    return count;
}

// 獲取標記等級資訊
function getMarkerLevelInfo(storeId) {
    var contribution = getUserContribution(storeId);
    var levels = [
        { level: 0, label: '普通標記', icon: '●', color: '#666', requirement: '無貢獻' },
        { level: 1, label: '⭐ 一星標記', icon: '⭐', color: '#D4AF37', requirement: '貢獻值 1-2' },
        { level: 2, label: '✨ 光暈標記', icon: '✨', color: '#D4AF37', requirement: '貢獻值 3-4' },
        { level: 3, label: '👑 皇冠標記', icon: '👑', color: '#FFD700', requirement: '貢獻值 5+' }
    ];
    
    var currentLevel = levels[0];
    for (var i = levels.length - 1; i >= 0; i--) {
        if (contribution >= i) {
            currentLevel = levels[i];
            break;
        }
    }
    
    return {
        level: currentLevel.level,
        label: currentLevel.label,
        icon: currentLevel.icon,
        color: currentLevel.color,
        contribution: contribution,
        nextLevel: levels[currentLevel.level + 1] || null
    };
}

// 創建個人化店鋪標記
function createPersonalizedMarker(store) {
    var levelInfo = getMarkerLevelInfo(store.id);
    var isVerified = store.status === 'verified' || store.verified === 'verified';
    
    var baseColor = isVerified ? '#00CC66' : '#FFB800';
    var borderColor = isVerified ? '#00FF88' : '#FFD700';
    
    var glowStyle = '';
    var iconDisplay = '●';
    var levelClass = '';
    
    if (levelInfo.level === 1) {

function isSupabaseReady() {
  if (!supabaseClientInstance) { return false; }
  if (typeof supabaseClientInstance.auth === 'undefined') { return false; }
  if (typeof supabaseClientInstance.auth.signInWithOAuth !== 'function') { return false; }
  return true;
}

function getSupabaseHeaders(extra) {
  return Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  }, extra || {});
}

async function sbFetch(path, opts) {
  if (opts === void 0) opts = {};
  if (!CLOUD_ON) return null;
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    }, opts.headers || {})
  }));
  if (!res.ok) throw new Error("Supabase " + res.status);
  return res.status === 204 ? null : res.json();
}

async function cloudInsert(table, row) {
  if (!CLOUD_ON) return;
  try {
    let processedRow = { ...row };
    if (table === 'claw_stores' && processedRow.id) {
      processedRow.id = String(processedRow.id);
    }
    if (table === 'user_achievements' && processedRow.user_id) {
      if (typeof processedRow.user_id === 'string' && !processedRow.user_id.includes('-')) {
        processedRow.user_id = null;
      }
    }
    await sbFetch(table, {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify([processedRow])
    });
  } catch (e) { 
    console.log("[v0] cloudInsert 失敗:", e.message); 
  }
}

async function uploadImage(file, folder) {
  if (folder === void 0) folder = 'stores';
  if (!CLOUD_ON) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e) { return resolve(e.target.result); };
      reader.readAsDataURL(file);
    });
  }
  var BUCKET = 'claw-stores-images';
  var fileName = folder + "/" + Date.now() + "_" + uid() + ".jpg";
  var path = "storage/v1/object/" + BUCKET + "/" + fileName;
  var uploadRes = await fetch(SUPABASE_URL + "/" + path, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      'Content-Type': file.type || 'image/jpeg'
    },
    body: file
  });
  if (!uploadRes.ok) {
    var errText = await uploadRes.text();
    console.error('上傳失敗:', errText);
    throw new Error("上傳失敗: " + errText);
  }
  return SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + fileName;
}

// ----- 積分同步 (P1) -----
async function addPoints(n, why) {
  STATE.points = Math.max(0, STATE.points + n);
  save();
  renderPoints();
  
  var xpAmount = 0;
  if (why && why.includes('提交店鋪')) {
    xpAmount = 15;
    setTimeout(function() { return updateAchievementStat('submit_store'); }, 100);
    setTimeout(function() { return updateStreak(); }, 200);
  } else if (why && why.includes('認證')) {
    xpAmount = 15;
    setTimeout(function() { return updateAchievementStat('verify_store'); }, 100);
  } else if (why && (why.includes('認證通過') || why.includes('追加'))) {
    xpAmount = 35;
  } else if (why && why.includes('補充')) {
    xpAmount = 5;
    setTimeout(function() { return updateAchievementStat('supplement'); }, 100);
  } else if (why && why.includes('打卡')) {
    xpAmount = 5;
    setTimeout(function() { return updateCheckinStreak(); }, 100);
  } else if (why && why.includes('解鎖成就')) {
    xpAmount = 0;
  } else if (why && why.includes('每日任務達標獎勵')) {
    xpAmount = 10;
  } else {
    xpAmount = 2;
  }
  
  if (xpAmount > 0) {
    addXP(xpAmount, why);
  }
  
  // 雲端同步積分
  if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${STATE.user.user_id}`, {
        method: 'PATCH',
        headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({
          total_points: STATE.points,
          total_xp: STATE.total_xp || 0,
          last_active_at: new Date().toISOString()
        })
      });
      console.log('✅ 積分已同步到雲端');
    } catch (e) {
      console.warn('⚠️ 積分雲端同步失敗:', e.message);
    }
  }
  
  toast((n >= 0 ? "+" : "") + n + " 積分 · " + why, n >= 0 ? "green" : "pink");
}

  // 本地檢查 (fallback)
  if (!STATE._submitDate) {
    STATE._submitDate = today;
    STATE._submitCount = 0;
    save();
  }
  
  if (STATE._submitDate !== today) {
    STATE._submitDate = today;
    STATE._submitCount = 0;
    save();

  if (STATE._submitCount >= 3) {
    toast('⚠️ 每日僅能提交 3 間店鋪，明日再來！', 'pink');

async function processPendingPosts() {
  if (!CLOUD_ON || !STATE._pendingPosts || STATE._pendingPosts.length === 0) return;
  
  const pending = STATE._pendingPosts.slice();
  let syncedCount = 0;
  
  for (const post of pending) {
    const success = await syncLivePost(post);
    if (success) {
      syncedCount++;
      STATE._pendingPosts = STATE._pendingPosts.filter(p => p.id !== post.id);
    }
  }
  
  if (syncedCount > 0) {
    save();
    console.log(`✅ 已同步 ${syncedCount} 篇待同步貼文`);
  }
}

function updateAchievementStat(statType, increment) {
  if (increment === void 0) increment = 1;
  var state = getAchievementState();

    save();

function getAchievementProgress(key) {
  var state = getAchievementState();
  var def = ACHIEVEMENT_DEFS[key];
  if (!def) return { current: 0, required: 0, percentage: 0, isUnlocked: false };
  var stats = state.stats;
  var unlocked = state.unlocked || [];
  var current = 0, required = def.condition.count;
  
  switch (def.condition.type) {
    case 'submit_store': current = stats.submit_store || 0; break;
    case 'verify_store': current = stats.verify_store || 0; break;
    case 'store_complete': current = stats.store_complete || 0; break;
    case 'region_hk_island': current = stats.region_hk_island || 0; break;
    case 'region_kowloon': current = stats.region_kowloon || 0; break;
    case 'region_nt': current = stats.region_nt || 0; break;
    case 'region_all': current = unlocked.includes('hk_island') && unlocked.includes('kowloon') && unlocked.includes('nt') ? 1 : 0; break;
    case 'supplement': current = stats.supplement || 0; break;
    case 'perfect_file': current = stats.perfect_file || 0; break;
    case 'streak': current = stats.streak_days || 0; break;
    case 'weekly_perfect': current = stats.weekly_perfect || 0; break;
    case 'monthly_perfect': current = stats.monthly_perfect || 0; break;
    case 'cold_region_verify': current = stats.cold_region_verify || 0; break;
    default: break;
  }
  
  var isUnlocked = unlocked.includes(key);
  var percentage = Math.min(100, Math.round((current / required) * 100));
  return { current: current, required: required, percentage: percentage, isUnlocked: isUnlocked };
}

function showAchievementUnlock(def) {
  var root = document.getElementById('toast-root');
  if (!root) return;
  var el = document.createElement('div');
  el.className = 'animate-pop pointer-events-auto rounded-2xl border border-gold bg-black/90 px-5 py-3 text-center glow-gold max-w-sm';
  el.innerHTML = '<div class="text-2xl">' + def.icon + '</div><div class="text-xs text-white/50 mt-0.5">🏆 成就解鎖！</div><div class="text-sm font-bold text-gold">' + def.name + '</div><div class="text-[10px] text-white/40">' + def.description + '</div>' + (def.reward.points > 0 ? '<div class="text-[10px] text-neongreen mt-1">+' + def.reward.points + ' 積分</div>' : '') + (def.reward.title ? '<div class="text-[10px] text-neonpink">獲得稱號：' + def.reward.title + '</div>' : '');
  root.appendChild(el);
  setTimeout(function() { return el.remove(); }, 4000);
}

function checkAchievements() {
  var state = getAchievementState();
  var unlocked = state.unlocked || [];
  var newUnlocks = [];
  
  Object.keys(ACHIEVEMENT_DEFS).forEach(function(key) {
    if (unlocked.includes(key)) return;
    var def = ACHIEVEMENT_DEFS[key];
    var stats = state.stats;
    var isUnlocked = false;
    
    switch (def.condition.type) {
      case 'submit_store': if (stats.submit_store >= def.condition.count) isUnlocked = true; break;
      case 'verify_store': if (stats.verify_store >= def.condition.count) isUnlocked = true; break;
      case 'store_complete': if (stats.store_complete >= def.condition.count) isUnlocked = true; break;
      case 'region_hk_island': if (stats.region_hk_island >= def.condition.count) isUnlocked = true; break;
      case 'region_kowloon': if (stats.region_kowloon >= def.condition.count) isUnlocked = true; break;
      case 'region_nt': if (stats.region_nt >= def.condition.count) isUnlocked = true; break;
      case 'region_all': if (unlocked.includes('hk_island') && unlocked.includes('kowloon') && unlocked.includes('nt')) isUnlocked = true; break;
      case 'supplement': if (stats.supplement >= def.condition.count) isUnlocked = true; break;
      case 'perfect_file': if (stats.perfect_file >= def.condition.count) isUnlocked = true; break;
      case 'streak': if (stats.streak_days >= def.condition.count) isUnlocked = true; break;
      case 'weekly_perfect': if (stats.weekly_perfect >= def.condition.count) isUnlocked = true; break;
      case 'monthly_perfect': if (stats.monthly_perfect >= def.condition.count) isUnlocked = true; break;
      case 'cold_region_verify': if (stats.cold_region_verify >= def.condition.count) isUnlocked = true; break;
      default: break;
    }
    
    if (isUnlocked) {
      unlocked.push(key);
      newUnlocks.push(key);
      if (def.reward.points > 0) {
        addPoints(def.reward.points, '解鎖成就：' + def.name);
      }
      if (def.reward.title) {
        if (!STATE.titles) STATE.titles = [];
        if (!STATE.titles.includes(def.reward.title)) STATE.titles.push(def.reward.title);
      }
      showAchievementUnlock(def);
      
      if (CLOUD_ON) {
        var userId = STATE.user.user_id || STATE.user.device;
        cloudInsert('user_achievements', {
          user_id: userId,
          achievement_key: key,
          achievement_name: def.name,
          unlocked_at: new Date().toISOString()
        });
      }
    }
  });
  
  STATE.achievements.unlocked = unlocked;
  save();
}

function updateStreak() {
  var state = getAchievementState();
  var today = todayKey();
  var yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  var yesterdayKey = yesterday.toISOString().slice(0, 10);
  
  if (state.stats.last_active_date === today) return;
  if (state.stats.last_active_date === yesterdayKey) state.stats.streak_days += 1;
  else if (state.stats.last_active_date !== today) state.stats.streak_days = 1;
  state.stats.last_active_date = today;
  
  var dayOfWeek = new Date().getDay();
  var weekDay = dayOfWeek === 0 ? 7 : dayOfWeek;
  if (!state.stats.weekly_days.includes(weekDay)) {
    state.stats.weekly_days.push(weekDay);
    if (state.stats.weekly_days.length === 7) {
      updateAchievementStat('weekly_perfect', 1);
      state.stats.weekly_days = [];
    }
  }
  
  var dayOfMonth = new Date().getDate();
  if (!state.stats.monthly_days.includes(dayOfMonth)) {
    state.stats.monthly_days.push(dayOfMonth);
    if (state.stats.monthly_days.length === 30 || state.stats.monthly_days.length === 31) {
      updateAchievementStat('monthly_perfect', 1);
      state.stats.monthly_days = [];
    }
  }
  
  save();
  checkAchievements();
}

function updateCheckinStreak() {
  var progress = getWeeklyCheckinProgress();
  if (!STATE.achievements) STATE.achievements = {};
  if (!STATE.achievements.stats) STATE.achievements.stats = {};
  STATE.achievements.stats.checkin_streak = progress.count;

}

function getUserLevel() {
  var xp = STATE.total_xp || 0;
  var levels = [
    { level: 1, title: '新手爪友', xp: 0 },
    { level: 2, title: '見習爪客', xp: 50 },
    { level: 3, title: '探索爪客', xp: 150 },
    { level: 4, title: '情報爪客', xp: 300 },
    { level: 5, title: '資深爪客', xp: 500 },
    { level: 6, title: '偵查爪客', xp: 800 },
    { level: 7, title: '獵人爪客', xp: 1200 },
    { level: 8, title: '金牌爪客', xp: 1800 },
    { level: 9, title: '傳說爪客', xp: 2500 },
    { level: 10, title: '爪皇', xp: 3500 }
  ];
  var currentLevel = levels[0], nextLevel = levels[1];
  for (var i = levels.length - 1; i >= 0; i--) {
    if (xp >= levels[i].xp) {
      currentLevel = levels[i];
      nextLevel = levels[i + 1] || null;
      break;
    }
  }
  return {
    level: currentLevel.level,
    title: currentLevel.title,
    xp: xp,
    xpForCurrent: currentLevel.xp,
    xpForNext: nextLevel ? nextLevel.xp : xp,
    nextTitle: nextLevel ? nextLevel.title : null,
    percentage: nextLevel ? Math.min(100, Math.round(((xp - currentLevel.xp) / (nextLevel.xp - currentLevel.xp)) * 100)) : 100
  };
}

const CheckinManager = {
  getTodayKey() {
    return new Date().toISOString().slice(0, 10);
  },
  getReminderKey() {
    return 'claw_reminder_' + this.getTodayKey();
  },
  hasShownToday() {
    return localStorage.getItem(this.getReminderKey()) === 'true';
  },
  markShownToday() {
    localStorage.setItem(this.getReminderKey(), 'true');
  },
  
  async isCheckedInToday() {
    const today = this.getTodayKey();
    const deviceId = STATE.user.device;
    
    if (!CLOUD_ON) {
      const progress = getWeeklyCheckinProgress();
      return progress.isTodaySigned;
    }
    
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/user_checkins?select=id&device_id=eq.${deviceId}&checkin_date=eq.${today}&limit=1`,
        { headers: getSupabaseHeaders() }
      );
      if (!response.ok) return false;
      const data = await response.json();
      return data.length > 0;
    } catch (e) {
      console.warn('⚠️ 檢查簽到失敗，使用本地:', e.message);
      const progress = getWeeklyCheckinProgress();
      return progress.isTodaySigned;
    }
  },
  
  async doCheckin() {
    const today = this.getTodayKey();
    const deviceId = STATE.user.device;
    const userId = STATE.user.user_id || null;
    
    const alreadyChecked = await this.isCheckedInToday();
    if (alreadyChecked) {
      toast('今日已簽到，明天再來吧！', 'gold');
      return false;
    }
    
    const progress = getWeeklyCheckinProgress();
    const daysSigned = progress.count + 1;
    let bonus = 5;
    let bonusMsg = '基礎簽到 +5 分';
    if (daysSigned === 3) {
      bonus += 5;
      bonusMsg = '連續 3 天！額外 +5 分 🎉';
    } else if (daysSigned === 5) {
      bonus += 5;
      bonusMsg = '連續 5 天！額外 +5 分 🎉🎉';
    } else if (daysSigned === 7) {
      bonus += 15;
      bonusMsg = '🎊 本週全勤！額外 +15 分 🎊';
    }
    
    if (CLOUD_ON) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/user_checkins`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
          body: JSON.stringify([{
            device_id: deviceId,
            user_id: userId,
            checkin_date: today,
            created_at: new Date().toISOString()
          }])
        });
        if (!response.ok) {
          if (response.status === 409) {
            toast('今日已簽到', 'gold');
            return false;
          }
          throw new Error(`HTTP ${response.status}`);
        }
        console.log('✅ 簽到已同步到雲端');
      } catch (e) {
        console.warn('⚠️ 雲端同步失敗，儲存到本地:', e.message);
        this._saveLocal(today);
      }
    } else {
      this._saveLocal(today);
    }
    
    this._updateLocalState(today);
    await addPoints(bonus, `簽到 (第 ${daysSigned} 天)`);
    updateAchievementStat('checkin', 1);
    updateStreak();
    this.markShownToday();
    
    // 記錄任務進度 (打卡)
    await recordTaskCompletion('checkin');
    
    toast(`✅ 簽到成功！獲得 ${bonus} 分（${bonusMsg}）`, 'green');
    showView('task');
    return true;
  },
  
  _saveLocal(today) {
    const weekStart = getWeekStartDate(new Date());
    const weekKey = weekStart.toISOString().slice(0, 10);
    if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
    if (!STATE.weeklyCheckin[weekKey]) {
      STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
    }
    const dayOfWeek = new Date().getDay();
    const todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
    if (!STATE.weeklyCheckin[weekKey].days.includes(todayNum)) {
      STATE.weeklyCheckin[weekKey].days.push(todayNum);
    }
    save();
  },
  
  _updateLocalState(today) {
    const weekStart = getWeekStartDate(new Date());
    const weekKey = weekStart.toISOString().slice(0, 10);
    const dayOfWeek = new Date().getDay();
    const todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
    if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
    if (!STATE.weeklyCheckin[weekKey]) {
      STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
    }
    if (!STATE.weeklyCheckin[weekKey].days.includes(todayNum)) {
      STATE.weeklyCheckin[weekKey].days.push(todayNum);
    }
    save();
  },
  
  async checkAndShowReminder() {
    if (this.hasShownToday()) {
      console.log('📅 今日已顯示過簽到提醒，跳過');
      return;
    }
    
    const checkedIn = await this.isCheckedInToday();
    if (checkedIn) {
      this.markShownToday();
      console.log('📅 今日已簽到，標記為已顯示');
      return;
    }
    
    console.log('📅 今日尚未簽到，顯示提醒');
    setTimeout(() => {
      showCheckinReminder();
      this.markShownToday();
    }, 2000);
  },
  
  async syncFromCloud() {
    const deviceId = STATE.user.device;
    const today = new Date();
    const weekStart = getWeekStartDate(today);
    const weekStartStr = weekStart.toISOString().slice(0, 10);
    const todayStr = today.toISOString().slice(0, 10);
    
    if (!CLOUD_ON) return;
    
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/user_checkins?select=checkin_date&device_id=eq.${deviceId}&checkin_date=gte.${weekStartStr}&checkin_date=lte.${todayStr}`,
        { headers: getSupabaseHeaders() }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const days = data.map(item => {
        const date = new Date(item.checkin_date);
        const day = date.getDay();
        return day === 0 ? 7 : day;
      });
      
      const weekKey = weekStartStr;
      if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
      STATE.weeklyCheckin[weekKey] = {
        days: days,
        claimed: days.length >= 7
      };
      
      const todayNum = today.getDay() === 0 ? 7 : today.getDay();
      if (days.includes(todayNum)) {
        this.markShownToday();
      }
      
      save();
      console.log('📅 簽到狀態已同步，本週簽到:', days.length, '天');
    } catch (e) {
      console.warn('⚠️ 同步簽到失敗:', e.message);
    }
  }
};

function getWeekStartDate(date) {
  var d = new Date(date);
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function getWeeklyCheckinProgress() {
  var today = new Date();
  var weekStart = getWeekStartDate(today);
  var weekKey = weekStart.toISOString().slice(0, 10);
  if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
  if (!STATE.weeklyCheckin[weekKey]) {
    STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
  }
  var weekData = STATE.weeklyCheckin[weekKey];
  var dayOfWeek = today.getDay();
  var todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
  var isTodaySigned = weekData.days.includes(todayNum);
  return {
    days: weekData.days,
    count: weekData.days.length,
    isTodaySigned: isTodaySigned,
    weekKey: weekKey,
    isComplete: weekData.days.length >= 7
  };
}

async function submitReport(targetType, targetId) {
  var category = document.getElementById('report-category')?.value;
  var reason = document.getElementById('report-reason')?.value.trim() || '';
  
  if (!category) {
    toast('請選擇檢舉類別', 'pink');
    return;
  }
  
  var reportData = {
    target_type: targetType,
    target_id: targetId,
    reporter_device: STATE.user.device,
    reporter_user_id: STATE.user.user_id || null,
    category: category,
    reason: reason,
    status: 'pending',
    created_at: new Date().toISOString()
  };
  
  if (CLOUD_ON) {
    try {
      var response = await fetch(SUPABASE_URL + "/rest/v1/reports", {
        method: 'POST',
        headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify([reportData])
      });
      
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      
      STATE._reportCount = (STATE._reportCount || 0) + 1;
      save();
      
      toast('✅ 檢舉已提交，感謝你的回報！', 'green');
      closeModal();
    } catch (e) {
      console.error('❌ 檢舉提交失敗:', e);
      // 離線儲存
      if (!STATE._offlineReports) STATE._offlineReports = [];
      STATE._offlineReports.push(reportData);
      STATE._reportCount = (STATE._reportCount || 0) + 1;
      save();
      toast('⚠️ 檢舉已記錄（離線），連網後將自動提交', 'green');
      closeModal();
    }
  } else {
    if (!STATE._offlineReports) STATE._offlineReports = [];
    STATE._offlineReports.push(reportData);
    STATE._reportCount = (STATE._reportCount || 0) + 1;
    save();
    toast('✅ 檢舉已記錄（離線），連網後將自動提交', 'green');
    closeModal();
  }
}

// 處理離線檢舉自動上傳 (P3)
async function processOfflineReports() {
  if (!CLOUD_ON || !STATE._offlineReports || STATE._offlineReports.length === 0) return;
  
  const pending = STATE._offlineReports.slice();
  let syncedCount = 0;
  
  for (const report of pending) {
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/reports", {
        method: 'POST',
        headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify([report])
      });
      
      if (response.ok) {
        syncedCount++;
        STATE._offlineReports = STATE._offlineReports.filter(r => r !== report);
      }
    } catch (e) {
      console.warn('⚠️ 離線檢舉上傳失敗:', e.message);
    }
  }
  
  if (syncedCount > 0) {
    save();
    console.log(`✅ 已上傳 ${syncedCount} 筆離線檢舉`);
  }
}

async function bindGoogleAccount() {
  if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
    toast('⚠️ Google 登入需要 HTTPS 環境，請使用 HTTPS 訪問', 'pink');
    return;
  }
  if (!isSupabaseReady()) {
    toast('⚠️ 認證服務暫時不可用，請稍後再試', 'pink');
    return;
  }
  try {
    toast('🔐 正在連線到 Google...', 'gold');
    var currentUrl = window.location.href.split('?')[0].split('#')[0];
    var result = await supabaseClientInstance.auth.signInWithOAuth({
      provider: 'google',
      options: {
        redirectTo: currentUrl,
        queryParams: {
          access_type: 'offline',
          prompt: 'consent'
        }
      }
    });
    if (result.error) throw result.error;
  } catch (error) {
    console.error('Google 登入錯誤:', error);
    toast('❌ 登入失敗：' + (error.message || '未知錯誤'), 'pink');
  }
}

async function checkOAuthCallback() {
  var params = new URLSearchParams(window.location.hash.substring(1));
  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');
  if (accessToken) {
    console.log('🔐 檢測到 OAuth 回調，正在處理...');
    try {
      var result = await supabaseClientInstance.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      });
      if (result.error) throw result.error;
      var userResult = await supabaseClientInstance.auth.getUser();
      if (userResult.error) throw userResult.error;
      await syncUserDataAfterBind(userResult.data.user);
      window.history.replaceState({}, '', window.location.pathname);
    } catch (error) {
      console.error('OAuth 回調處理錯誤:', error);
      toast('❌ 綁定失敗：' + error.message, 'pink');
    }
  }
}

async function syncUserDataAfterBind(user) {
  try {
    var deviceId = STATE.user.device;
    var email = user.email || '';
    var displayName = user.user_metadata?.full_name || user.email?.split('@')[0] || '夾客';
    var avatarUrl = user.user_metadata?.avatar_url || '';
    var googleId = user.id;
    var existingResult = await supabaseClientInstance.from('user_profiles').select('*').eq('google_id', googleId).maybeSingle();
    if (existingResult.error) throw existingResult.error;
    var existingUser = existingResult.data;
    var userId = null;
    
    if (existingUser) {
      userId = existingUser.id;
      var updates = {
        display_name: displayName,
        avatar_url: avatarUrl,
        total_points: Math.max(existingUser.total_points || 0, STATE.points),
        total_xp: Math.max(existingUser.total_xp || 0, STATE.total_xp || 0),
        last_active_at: new Date().toISOString(),
        is_anonymous: false
      };
      var updateResult = await supabaseClientInstance.from('user_profiles').update(updates).eq('device_id', deviceId);
      if (updateResult.error) throw updateResult.error;
      if (existingUser.total_points > STATE.points) STATE.points = existingUser.total_points;
      if (existingUser.total_xp > (STATE.total_xp || 0)) STATE.total_xp = existingUser.total_xp;
    } else {
      var newUserData = {
        device_id: deviceId,
        google_id: googleId,
        email: email,
        display_name: displayName,
        avatar_url: avatarUrl,
        total_points: STATE.points,
        total_xp: STATE.total_xp || 0,
        level: STATE.level || 1,
        is_anonymous: false,
        bound_at: new Date().toISOString(),
        created_at: new Date().toISOString(),
        last_active_at: new Date().toISOString()
      };
      var insertResult = await supabaseClientInstance.from('user_profiles').insert(newUserData).select().single();
      if (insertResult.error) throw insertResult.error;
      userId = insertResult.data.id;
    }
    
    STATE.user.is_bound = true;
    STATE.user.email = email;
    STATE.user.google_id = googleId;
    STATE.user.user_id = userId;
    STATE.user.display_name = displayName;
    STATE.user.avatar_url = avatarUrl;
    
    // 同步收藏
    if (STATE.favStores.length > 0 || STATE.favMachines.length > 0) {
      await syncFavorites(userId);
    }
    // 同步成就
    if (STATE.achievements && STATE.achievements.unlocked && STATE.achievements.unlocked.length > 0) {
      await syncAchievements(userId);
    }
    // 同步最近搜索
    if (STATE.recentRegions.length > 0) {
      await syncRecentRegions();
    }
    // 同步任務進度
    await loadTaskProgressFromCloud();
    
    save();
    addPoints(20, 'Google 帳號綁定獎勵');
    toast('✅ 帳號綁定成功！數據已雲端備份 (+20 分)', 'green');
    if (CURRENT === 'map') {
      setTimeout(function() {
        if (map && mapInitialized) {
          map.invalidateSize(true);
          updateMapMarkers();
          updateMapList();
        }
      }, 500);
    }
    showView('me');
  } catch (error) {
    console.error('同步數據錯誤:', error);
    toast('⚠️ 綁定成功但數據同步失敗: ' + error.message, 'pink');
    STATE.user.is_bound = true;
    save();
  }
}

async function syncFavorites(userId) {
  try {
    for (var i = 0; i < STATE.favStores.length; i++) {
      await supabaseClientInstance.from('user_favorites').upsert(
        { user_id: userId, store_id: STATE.favStores[i], created_at: new Date().toISOString() },
        { onConflict: 'user_id, store_id' }
      );
    }
    for (var j = 0; j < STATE.favMachines.length; j++) {
      await supabaseClientInstance.from('user_favorites').upsert(
        { user_id: userId, machine_id: STATE.favMachines[j], created_at: new Date().toISOString() },
        { onConflict: 'user_id, machine_id' }
      );
    }
    console.log('✅ 收藏已同步');
  } catch (e) { console.warn('收藏同步失敗:', e); }
}

async function syncAchievements(userId) {
  if (isSyncingAchievements) return;
  if (!userId) return;
  try {
    isSyncingAchievements = true;
    var unlocked = STATE.achievements?.unlocked || [];
    if (unlocked.length === 0) return;
    for (var i = 0; i < unlocked.length; i++) {
      var key = unlocked[i];
      var def = ACHIEVEMENT_DEFS[key];
      if (!def) continue;
      var checkResult = await supabaseClientInstance.from('user_achievements').select('id').eq('user_id', userId).eq('achievement_key', key).maybeSingle();
      if (checkResult.error) continue;
      if (checkResult.data) continue;
      await supabaseClientInstance.from('user_achievements').insert({
        user_id: userId,
        achievement_key: key,
        achievement_name: def.name,
        unlocked_at: new Date().toISOString()
      });
    }
  } catch (e) {
    console.warn('成就同步失敗:', e);
  } finally {
    isSyncingAchievements = false;
  }
}

async function logoutGoogle() {
  if (!confirm('確定要登出嗎？本地數據仍會保留。')) return;
  try {
    var result = await supabaseClientInstance.auth.signOut();
    if (result.error) throw result.error;
    STATE.user.is_bound = false;
    STATE.user.google_id = null;
    STATE.user.email = null;
    STATE.user.user_id = null;
    STATE.user.display_name = null;
    STATE.user.avatar_url = null;
    save();
    toast('✅ 已登出', 'green');
    showView('me');
  } catch (e) { toast('登出失敗: ' + e.message, 'pink'); }
}

// 儲存 polygon 引用以便更新
window._regionPolygons = [];

function addRegionPolygons() {
    // 清除舊的 polygon
    if (window._regionPolygons.length > 0) {
        window._regionPolygons.forEach(function(p) {
            if (map) map.removeLayer(p);
        });
        window._regionPolygons = [];
    }
    
    if (!map) return;
    
    // 添加每個區域的 polygon
    for (var key in REGION_POLYGONS) {
        var region = REGION_POLYGONS[key];
        var polygon = L.polygon(region.coords, {
            color: region.borderColor,
            weight: 1.5,
            opacity: 0.7,
            fillColor: region.color,
            fillOpacity: 1,
            interactive: false,
            smoothFactor: 1,
            className: 'region-polygon'
        }).addTo(map);
        
        // 儲存引用
        window._regionPolygons.push(polygon);
        
        // 添加區域標籤 (在中心位置)
        var center = getPolygonCenter(region.coords);
        var label = L.divIcon({
            className: 'region-label',
            html: '<div style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);text-shadow:0 0 12px rgba(0,0,0,0.9),0 0 24px rgba(0,0,0,0.8);letter-spacing:1px;pointer-events:none;">' + region.label + '</div>',
            iconSize: [60, 20],
            iconAnchor: [30, 10]
        });
        var labelMarker = L.marker([center.lat, center.lng], {
            icon: label,
            interactive: false,
            keyboard: false
        }).addTo(map);
        window._regionPolygons.push(labelMarker);
    }
}

// 計算多邊形中心點
function getPolygonCenter(coords) {
    var latSum = 0, lngSum = 0, count = 0;
    for (var i = 0; i < coords.length; i++) {
        latSum += coords[i][0];
        lngSum += coords[i][1];
        count++;
    }
    return { lat: latSum / count, lng: lngSum / count };
}

// 在 map 初始化完成後添加 polygon

    map.on('moveend zoomend', function() {

function getStoresInBounds() {
  if (!map) return STORES.filter(function(s) { return s.lat && s.lng; });
  var bounds = map.getBounds();
  if (!bounds) return STORES.filter(function(s) { return s.lat && s.lng; });
  var sw = bounds.getSouthWest();
  var ne = bounds.getNorthEast();
  return STORES.filter(function(s) {
    if (!s.lat || !s.lng) return false;
    return s.lat >= sw.lat && s.lat <= ne.lat && s.lng >= sw.lng && s.lng <= ne.lng;
  });
}

function ensureStoresVisible() {
  if (CURRENT !== 'map') return;
  if (!map) return;
  if (ensureStoresTimeout) {
    clearTimeout(ensureStoresTimeout);
    ensureStoresTimeout = null;
  }
  if (ensureStoresRetryCount > MAX_ENSURE_RETRIES) {
    ensureStoresRetryCount = 0;
    return;
  }
  var allStores = STORES.filter(function(s) { return s.lat && s.lng; });
  if (allStores.length === 0) return;
  if (!map.getContainer()) {
    ensureStoresTimeout = setTimeout(ensureStoresVisible, 500);
    return;
  }
  try {
    var bounds = map.getBounds();
    if (!bounds) return;
    var sw = bounds.getSouthWest();
    var ne = bounds.getNorthEast();
    var latRange = ne.lat - sw.lat;
    var lngRange = ne.lng - sw.lng;
    if (latRange < 0.0001 || lngRange < 0.0001) {
      ensureStoresRetryCount++;
      if (allStores.length > 0 && CURRENT === 'map') {
        var avgLat = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lat); }, 0) / allStores.length;
        var avgLng = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lng); }, 0) / allStores.length;
        map.setView([avgLat, avgLng], 12);
      }
      ensureStoresTimeout = setTimeout(ensureStoresVisible, 500);
      return;
    }
    ensureStoresRetryCount = 0;
    var visibleStores = allStores.filter(function(s) {
      return s.lat >= sw.lat && s.lat <= ne.lat && s.lng >= sw.lng && s.lng <= ne.lng;
    });
    var currentZoom = Math.round(map.getZoom());
    if (visibleStores.length === 0 && currentZoom <= 11 && CURRENT === 'map') {
      var avgLat_1 = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lat); }, 0) / allStores.length;
      var avgLng_1 = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lng); }, 0) / allStores.length;
      map.setView([avgLat_1, avgLng_1], 12);
      setTimeout(function() {
        if (CURRENT === 'map') {
          updateMapMarkers();
          updateMapList();
          updateRegionProgress();
        }
      }, 300);
    }
    if (visibleStores.length > 0 && CURRENT === 'map') {
      updateMapMarkers();
      updateMapList();
      updateRegionProgress();
    }
  } catch (e) {
    ensureStoresRetryCount++;
    if (ensureStoresRetryCount <= MAX_ENSURE_RETRIES) {
      ensureStoresTimeout = setTimeout(ensureStoresVisible, 1000);
    }
  }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

function grabVerifyGPS() {
  var el = document.getElementById('vf-gps');
  if (!el) return;
  el.textContent = '定位中，請確認已開啟 GPS...';
  el.className = 'text-yellow-400 text-xs';
  _vfGpsReady = false;
  var retryBtn = document.getElementById('vf-gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      _vfGpsLat = pos.coords.latitude;
      _vfGpsLng = pos.coords.longitude;
      _vfGpsReady = true;
      el.textContent = '📍 定位成功：' + _vfGpsLat.toFixed(2) + ', ' + _vfGpsLng.toFixed(2) + ' (精度 ±' + Math.round(pos.coords.accuracy) + 'm)';
      el.className = 'text-neongreen text-xs';
      var submitBtn = document.getElementById('vf-submit-btn');
      if (submitBtn) submitBtn.dispatchEvent(new Event('change'));
    }, function(err) {
      _vfGpsReady = false;
      el.textContent = '⚠️ 定位失敗，請確認已開啟 GPS 並重新嘗試';
      el.className = 'text-neonpink text-xs';
      var retryBtn = document.getElementById('vf-gps-retry');
      if (retryBtn) retryBtn.classList.remove('hidden');
    }, { enableHighAccuracy: true, timeout: 10000 });
  } else {
    _vfGpsReady = false;
    el.textContent = '⚠️ 此裝置不支援 GPS';
    el.className = 'text-neonpink text-xs';
  }
}

function retryVerifyGPS() {
  var retryBtn = document.getElementById('vf-gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  grabVerifyGPS();
}

function checkGpsDistance(store, userLat, userLng, limitKm, storeTypeLabel) {
    if (!store.lat || !store.lng) {
        return { 
            valid: true, 
            distance: null, 
            message: '⚠️ 該店鋪尚無 GPS 座標，將記錄您的位置' 
        };
    }
    var distance = calculateDistance(store.lat, store.lng, userLat, userLng);
    var distanceMeters = Math.round(distance * 1000);
    var limitMeters = Math.round(limitKm * 1000);
    if (distance > limitKm) {
        return {
            valid: false,
            distance: distanceMeters,
            message: '⚠️ 你距離該' + storeTypeLabel + ' ' + distanceMeters + ' 米，請在 ' + limitMeters + ' 米內操作'
        };
    }
    return {
        valid: true,
        distance: distanceMeters,
        message: '✅ 距離 ' + distanceMeters + ' 米，在 ' + limitMeters + ' 米範圍內'
    };
}

async function submitVerification(storeId) {
    var s = STORES.find(function(x) { return x.id === storeId; });
    if (!s) { toast('找不到該店鋪', 'pink'); return; }
    
    var photoBlob = window._cam?.vf;
    if (!photoBlob) { toast('請先拍攝店鋪照片', 'pink'); return; }
    
    if (!_vfGpsReady || !_vfGpsLat || !_vfGpsLng) { 
        toast('請等待 GPS 定位完成', 'pink'); 
        return; 
    }
    
    var isMallStore = s.type === 'mall' || (s.mall && s.mall.trim() !== '');
    var limitDistance = isMallStore ? 0.5 : 0.3;
    var storeTypeLabel = isMallStore ? '商場鋪 (GPS 可能不準確)' : '地鋪';
    
    if (s.lat && s.lng) {
        var distance = calculateDistance(s.lat, s.lng, _vfGpsLat, _vfGpsLng);
        var distanceMeters = Math.round(distance * 1000);
        var limitMeters = Math.round(limitDistance * 1000);
        if (distance > limitDistance) {
            toast('⚠️ 你距離該' + storeTypeLabel + ' ' + distanceMeters + ' 米，請在 ' + limitMeters + ' 米內認證', 'pink');
            return;
        }
        toast('✅ 距離 ' + distanceMeters + ' 米，在 ' + limitMeters + ' 米範圍內 (' + storeTypeLabel + ')', 'green');
    }
    
    var photoUrl = window._camPreview?.vf || '';
    if (CLOUD_ON) {
        try {
            var file = new File([photoBlob], "verify_" + Date.now() + ".jpg", { type: 'image/jpeg' });
            photoUrl = await uploadImage(file, 'verifications');
        } catch (e) { 
            toast('圖片上傳失敗', 'pink'); 
            return; 
        }
    }
    
    var verification = {
        store_id: storeId,
        verifier_device: STATE.user.device,
        verifier_user_id: STATE.user.user_id || null,
        verifier_name: STATE.user.name || '匿名用戶',
        photo_url: photoUrl,
        lat: _vfGpsLat,
        lng: _vfGpsLng,
        note: document.getElementById('vf-note')?.value.trim() || '',
        status: 'pending',
        created_at: new Date().toISOString()
    };
    
    if (CLOUD_ON) {
        try {
            await cloudInsert('store_verifications', verification);
            console.log('✅ 認證已同步到雲端');
        } catch (e) {
            console.warn('⚠️ 認證雲端同步失敗:', e.message);
            toast('⚠️ 認證記錄失敗，請稍後重試', 'pink');
            return;
        }
    }
    
    s.verification_count = (s.verification_count || 0) + 1;
    s._userVerified = true;
    
    if (s.verification_count >= 2) {
        s.status = 'verified';
        s.verified = 'verified';
        s.is_verified = true;
        
        if (s.submitted_by) {
            await addPoints(35, '認證通過追加獎勵');
            toast('🎉 ' + s.name + ' 已通過認證！提交者獲得 +35 分', 'green');
        }
        updateAchievementStat('store_complete');
        var regionStat = getRegionStat(s.region);
        if (regionStat) updateAchievementStat(regionStat);
        
        if (CLOUD_ON) {
            try {
                var checkResponse = await fetch(
                    SUPABASE_URL + "/rest/v1/verification_reviews?select=id&store_id=eq." + storeId + "&admin_status=eq.pending",
                    {
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY
                        }
                    }
                );
                var checkData = await checkResponse.json();
                if (!checkData || checkData.length === 0) {
                    toast('🔔 此店鋪已達到 2 人認證，等待管理員審核', 'gold');
                }
            } catch (e) {
                console.warn('⚠️ 檢查審核記錄失敗:', e.message);
            }
        }
    } else {
        toast('✅ 認證提交成功！目前 ' + s.verification_count + '/2 人認證', 'green');
    }
    
    save();
    
    if (CLOUD_ON) {
        try {
            await fetch(
                SUPABASE_URL + "/rest/v1/claw_stores?id=eq." + storeId,
                {
                    method: 'PATCH',
                    headers: {
                        'apikey': SUPABASE_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        verification_count: s.verification_count,
                        status: s.status,
                        verified: s.verified,
                        is_verified: s.is_verified
                    })
                }
            );
            console.log('✅ 前台認證計數已同步');
        } catch (e) {
            console.warn('⚠️ 同步認證計數失敗:', e.message);
        }
    }
    
    // 記錄任務進度
    await recordTaskCompletion('verify_store');
    
    // 記錄貢獻
    if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
        try {
            await fetch(
                SUPABASE_URL + "/rest/v1/user_contributions",
                {
                    method: 'POST',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify([{
                        user_id: STATE.user.user_id,
                        device_id: STATE.user.device,
                        store_id: storeId,
                        contribution_type: 'verify',
                        contribution_value: 1,
                        created_at: new Date().toISOString()
                    }])
                }
            );
        } catch (e) {
            console.warn('⚠️ 貢獻記錄同步失敗:', e.message);
        }
    }
    
    await addPoints(15, '認證店鋪');
    updateAchievementStat('verify_store');
    updateStreak();
    
    closeModal();
    openStore(storeId);
}

async function submitAllSupplement(storeId) {
    var s = STORES.find(function(x) { return x.id === storeId; });
    if (!s) { toast('找不到該店鋪', 'pink'); return; }
    
    var isStreet = s.type !== 'mall' && s.mall === '';
    var address = '';
    if (isStreet) {
        var addrInput = document.getElementById('sf-address');
        if (addrInput) address = addrInput.value.trim();
    }
    var size = window._sfSelections.size;
    var staff = window._sfSelections.staff;
    var coin = window._sfSelections.coin;
    
    if (isStreet && !address) { toast('請輸入詳細地址', 'pink'); return; }
    if (!size) { toast('請選擇規模', 'pink'); return; }
    if (staff === null || staff === undefined) { toast('請選擇是否有場務', 'pink'); return; }
    if (coin === null || coin === undefined) { toast('請選擇是否有電子兌幣', 'pink'); return; }
    
    var hasAddress = s.address_detail && s.address_detail !== '';
    var hasSize = s.size && s.size !== '中';
    var hasStaff = s.has_staff !== undefined && s.has_staff !== null;
    var hasCoin = s.has_e_coin !== undefined && s.has_e_coin !== null;
    
    if ((!isStreet || hasAddress) && hasSize && hasStaff && hasCoin) {
        toast('此店鋪資料已完整，無需重複補充', 'gold');
        return;
    }
    
    var currentGps = null;
    if (gpsLat && gpsLng) {
        currentGps = { lat: gpsLat, lng: gpsLng };
        console.log('📍 補充資料時 GPS 位置:', currentGps);
    }
    
    if (isStreet && address) s.address_detail = address;
    s.size = size;
    s.has_staff = staff;
    s.has_e_coin = coin;
    s.supplement_count = (s.supplement_count || 0) + 1;
    s.supplemented_by = STATE.user.device;
    s._userSupplemented = true;
    
    var supplementFields = [];
    if (isStreet && address) supplementFields.push('address_detail');
    supplementFields.push('size');
    supplementFields.push('has_staff');
    supplementFields.push('has_e_coin');
    
    for (var i = 0; i < supplementFields.length; i++) {
        var fieldName = supplementFields[i];
        var fieldValue = s[fieldName];
        if (fieldValue !== undefined && fieldValue !== null && fieldValue !== '') {
            await sb.from('field_status').upsert({
                table_name: 'claw_stores',
                record_id: storeId,
                field_name: fieldName,
                status: 'pending',
                submitted_by: STATE.user.device,
                submitted_type: 'supplement',
                updated_at: new Date().toISOString()
            }, { onConflict: 'table_name, record_id, field_name' });
        }
    }
    
    if (CLOUD_ON) {
        var updates = {};
        if (isStreet && address) updates.address_detail = address;
        updates.size = size;
        updates.has_staff = staff;
        updates.has_e_coin = coin;
        updates.supplemented_by = STATE.user.device;
        cloudInsert('claw_stores', Object.assign({ id: storeId }, updates));
        
        if (currentGps) {
            cloudInsert('store_supplements', {
                store_id: storeId,
                user_id: STATE.user.device,
                user_name: STATE.user.name,
                supplement_type: 'bulk_update',
                new_value: JSON.stringify({
                    address: address,
                    size: size,
                    has_staff: staff,
                    has_e_coin: coin
                }),
                gps_lat: currentGps.lat,
                gps_lng: currentGps.lng
            });
        }
    }
    
    // 記錄任務進度
    await recordTaskCompletion('supplement');
    
    // 記錄貢獻
    if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
        try {
            await fetch(
                SUPABASE_URL + "/rest/v1/user_contributions",
                {
                    method: 'POST',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify([{
                        user_id: STATE.user.user_id,
                        device_id: STATE.user.device,
                        store_id: storeId,
                        contribution_type: 'supplement',
                        contribution_value: 1,
                        created_at: new Date().toISOString()
                    }])
                }
            );
        } catch (e) {
            console.warn('⚠️ 貢獻記錄同步失敗:', e.message);
        }
    }
    
    await addPoints(15, '補充資料完成');
    updateAchievementStat('supplement');
    checkPerfectFile(storeId);
    updateStreak();
    toast('✅ 全部資料補充完成！獲得 15 積分', 'green');
    closeModal();
    setTimeout(function() { return openStore(storeId); }, 500);
}

function checkPerfectFile(storeId) {
  var s = STORES.find(function(x) { return x.id === storeId; });
  if (!s) return;
  var hasAddress = s.address_detail && s.address_detail !== '';
  var hasSize = s.size && s.size !== '中';
  var hasStaff = s.has_staff !== undefined && s.has_staff !== null;
  var hasCoin = s.has_e_coin !== undefined && s.has_e_coin !== null;
  if (hasAddress && hasSize && hasStaff && hasCoin) {
    updateAchievementStat('perfect_file');
    toast('📝 完美檔案！這間店的資料已完整！+20 分', 'gold');

}

  html += '</div>';
  
  html += '<button onclick="' + (liveTrack === "player" ? "openPlayerPost()" : "openOwnerPost()") + '" class="mt-3 w-full rounded-2xl py-3 font-black ' + (liveTrack === "player" ? "bg-neongreen text-black glow-green" : "bg-neonpink text-black glow-pink") + '">';
  html += (liveTrack === "player" ? "🎯 發布出貨戰報" : "🏬 發布台主宣傳");

  html += '</div>';
  return html;
}

async function submitPlayerPost() {
    var storeId = document.getElementById('lp-store-id')?.value;
    if (!storeId) { toast('請選擇店鋪', 'pink'); return; }
    
    var photoBlob = window._cam?.lp;
    if (!photoBlob) { toast('請先拍照', 'pink'); return; }
    
    var store = STORES.find(function(s) { return s.id === storeId; });
    if (!store) { toast('找不到該店鋪', 'pink'); return; }
    
    toast('📍 已選擇：' + store.name + ' (' + store.region + ')', 'gold');
    
    if (!gpsLat || !gpsLng) {
        toast('📍 請先開啟 GPS 定位，以確保實況資訊的真實性', 'pink');
        return;
    }
    
    if (store.lat && store.lng) {
        var distance = calculateDistance(store.lat, store.lng, gpsLat, gpsLng);
        var distanceMeters = Math.round(distance * 1000);
        if (distance > 0.5) {
            toast('⚠️ 你距離該店鋪 ' + distanceMeters + ' 米，請在 500 米內發布戰報\n\n實況資訊的真實性是我們的核心價值', 'pink');
            return;
        }
        toast('✅ 距離 ' + distanceMeters + ' 米，在 500 米範圍內，可以發布', 'green');
    } else {
        toast('⚠️ 該店鋪尚無 GPS 座標，將記錄您的發布位置', 'gold');
    }
    
    var selectedTags = [];
    document.querySelectorAll('[data-tag].chip-active-gold').forEach(function(btn) {
        selectedTags.push(btn.dataset.tag);
    });
    
    var photoUrl = '';
    if (CLOUD_ON) {
        try {
            var file = new File([photoBlob], "post_" + Date.now() + ".jpg", { type: 'image/jpeg' });
            photoUrl = await uploadImage(file, 'posts');
        } catch (e) {
            toast('圖片上傳失敗: ' + e.message, 'pink');
            return;
        }
    } else {
        photoUrl = window._camPreview?.lp || '';
    }
    
    var content = selectedTags.length > 0 ? selectedTags.join(' · ') : '🎉 出貨成功！';
    var post = {
        id: 'p' + Date.now() + '_' + uid(),
        track: 'player',
        store_id: storeId,
        store_name: store ? store.name : '',
        store_region: store ? store.region : '',
        content: content,
        tags: selectedTags,
        photo: photoUrl,
        author: STATE.user.name,
        author_device: STATE.user.device,
        ts: now(),
        expire: now() + DAY,
        likes: [],
        likeCount: 0,
        is_linked: false,
        gps_lat: gpsLat,
        gps_lng: gpsLng
    };
    
    if (!STATE.livePosts) STATE.livePosts = [];
    STATE.livePosts.unshift(post);
    save();
    
    await syncLivePost(post);
    await addPoints(5, '發布出貨戰報');
    updateStreak();
    
    // 記錄任務進度 (分享戰績)
    await recordTaskCompletion('share');
    
    toast('✅ 戰報發布成功！+5 分', 'green');
    closeModal();
    showView('live');
}

async function toggleLike(postId) {
  var post = STATE.livePosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  
  var userDevice = STATE.user.device;
  if (!post.likes) post.likes = [];
  
  var idx = post.likes.indexOf(userDevice);
  if (idx >= 0) {
    post.likes.splice(idx, 1);
  } else {
    post.likes.push(userDevice);
  }
  
  save();
  await syncLikeToCloud(postId, post.likes);
  
  if (CURRENT === 'live') {
    var overlay = document.getElementById('page-overlay');
    if (overlay) {
      overlay.innerHTML = VIEWS.live();
      overlay.scrollTop = 0;
      overlay.classList.add("view-enter");
    }
  }
}

function filterStoreSuggestions(prefix) {
  var input = document.getElementById(prefix + "-store-search");
  var container = document.getElementById(prefix + "-store-suggestions");
  if (!input || !container) return;
  var query = input.value.trim().toLowerCase();
  var filtered = STORES;
  if (query) filtered = STORES.filter(function(s) { return s.name.toLowerCase().includes(query) || s.region.toLowerCase().includes(query); });
  filtered = filtered.slice(0, 10);
  if (filtered.length === 0) { container.classList.add('hidden'); return; }
  container.classList.remove('hidden');
  container.innerHTML = filtered.map(function(s) {
    return '<button onclick="selectStoreSuggestion(\'' + prefix + '\', \'' + s.id + '\', \'' + s.name.replace(/'/g, "\\'") + '\')" class="block w-full text-left px-3 py-2 hover:bg-gold/20 text-sm text-white/80 border-b border-white/10 last:border-0 transition-colors">\n      <span class="text-gold">' + s.name + '</span>\n      <span class="text-[10px] text-white/40 ml-2">' + s.region + '</span>\n    </button>';
  }).join('');
  setTimeout(function() {
    document.addEventListener('click', function closeSuggestions(e) {
      if (!container.contains(e.target) && e.target !== input) {
        container.classList.add('hidden');
        document.removeEventListener('click', closeSuggestions);
      }
    });
  }, 100);
}

function selectStoreSuggestion(prefix, storeId, storeName) {

  if (container) container.classList.add('hidden');
  checkPostForm(prefix);
}

function viewFind() {
  var recent = STATE.recentRegions || [];
  var regionGroupOpen = { hk: false, kl: false, nt: false };
  var moreRegionsOpenMap = { hk: false, kl: false, nt: false };
  
  var renderRegionGroupFn = function(groupKey) {
    var data = REGIONS[groupKey];
    var isOpen = regionGroupOpen[groupKey];
    var isMoreOpen = moreRegionsOpenMap[groupKey] || false;
    var allRegions = isMoreOpen ? data.hot.concat(data.more) : data.hot;
    if (!isOpen) return '';
    var items = allRegions.slice();
    if (data.more.length > 0) items.push(isMoreOpen ? '📍 收起' : '📍 更多');
    return '<div class="mb-3 animate-pop"><div class="grid grid-cols-4 gap-2">' + items.map(function(item) {
      if (item === '📍 更多' || item === '📍 收起') {
        return '<button onclick="toggleMoreRegions(\'' + groupKey + '\')" class="rounded-full border py-1.5 text-center text-xs transition-all ' + (isMoreOpen ? 'chip-active-gold border-gold/60' : 'border-gold/40 text-gold hover:border-gold/60') + '">' + item + '</button>';
      }
      return '<button onclick="setRegion(\'' + item + '\')" class="rounded-full border py-1.5 text-center text-xs transition-all ' + (findState.region === item ? 'chip-active-gold border-gold/60' : 'border-gold/40 text-gold hover:border-gold/60') + '">' + item + '</button>';
    }).join('') + '</div></div>';
  };
  
  return '\n    <div class="mb-3 mt-4 flex items-center justify-between">\n      <div class="flex items-center gap-1.5 text-sm text-neongreen neon-green"><span class="flicker">📍</span> GPS · 附近店舖</div>\n      <button onclick="refreshGPS()" class="rounded-full border border-neongreen/40 px-3 py-1 text-xs text-neongreen">重新定位</button>\n    </div>\n    ' + (recent.length > 0 ? '<div class="mb-3"><p class="mb-1.5 text-[10px] font-bold text-white/40">🕐 最近搜索</p><div class="flex flex-wrap gap-2">' + recent.map(function(r) { return '<button onclick="setRegion(\'' + r + '\')" class="rounded-full border py-1.5 px-3 text-center text-xs transition-all ' + (findState.region === r ? 'chip-active-gold border-gold/60' : 'border-gold/40 text-gold hover:border-gold/60') + '">' + r + '</button>'; }).join('') + '</div></div>' : '<div class="mb-3"><p class="mb-1.5 text-[10px] text-white/30">🕐 最近搜索（選擇地區後會顯示在這裡）</p></div>') + '\n    <div class="mb-3 flex gap-2">\n      ' + Object.keys(REGIONS).map(function(key) { return '<button onclick="toggleRegionGroup(\'' + key + '\')" class="flex-1 rounded-xl border py-2 text-sm font-black transition-all ' + (regionGroupOpen[key] ? 'border-gold bg-gold/20 text-gold glow-gold' : 'border-white/20 text-white/45 hover:border-gold/40 hover:text-gold') + '">' + REGIONS[key].icon + ' ' + REGIONS[key].label + '</button>'; }).join('') + '\n    </div>\n    ' + renderRegionGroupFn('hk') + renderRegionGroupFn('kl') + renderRegionGroupFn('nt') + '\n    <div id="store-list" class="space-y-3">' + renderStoreList() + '</div>\n  ';
}

function renderStoreList() {
  var list = filteredStores();
  if (!list.length) return '<p class="py-10 text-center text-sm text-white/40">此區暫無店舖情報</p>';
  var start = 0, end = Math.min(PAGE_SIZE, list.length);
  var pageItems = list.slice(start, end);
  var hasMore = list.length > PAGE_SIZE;
  
  var formatDist = function(s) {
    if (s._dist === 9999) return '📍 位置未知';
    if (s._dist < 1) return Math.round(s._dist * 1000) + "m";
    return s._dist.toFixed(1) + "km";
  };
  
  var html = pageItems.map(function(s) {
    var isVerified = s.status === "verified" || s.verified === "verified";
    var badge = isVerified ? '<span class="rounded-full border border-neongreen/40 bg-neongreen/10 px-2 py-0.5 text-[10px] text-neongreen whitespace-nowrap">✅ 已認證</span>' : '<span class="rounded-full border border-yellow-400/40 bg-yellow-400/10 px-2 py-0.5 text-[10px] text-yellow-400 whitespace-nowrap">⏳ 審核中</span>';
    var borderClass = isVerified ? "border-gold/25 hover:border-gold/60" : "border-yellow-400/30 border-dashed hover:border-yellow-400/60";
    var distDisplay = (userLocation && s.lat && s.lng) ? '<span class="text-neonpink neon-pink whitespace-nowrap">📍 ' + formatDist(s) + '</span>' : '<span class="text-white/40 whitespace-nowrap">📍 ' + (s.dist || '?') + ' km</span>';
    
    return '<button onclick="openStore(\'' + s.id + '\')" class="w-full rounded-2xl border ' + borderClass + ' bg-zinc-950 p-4 text-left transition-all">\n      <div class="flex gap-3">\n        <div class="shrink-0">' + (s.photo ? '<img src="' + s.photo + '" class="h-16 w-16 rounded-lg object-cover" alt="' + s.name + '" />' : '<div class="flex h-16 w-16 items-center justify-center rounded-lg bg-zinc-800 text-3xl">🏪</div>') + '</div>\n        <div class="min-w-0 flex-1">\n          <div class="flex items-start justify-between gap-2">\n            <div class="min-w-0 flex-1">\n              <h3 class="font-black text-gold truncate">' + s.name + '</h3>\n              <p class="mt-0.5 text-xs text-white/50 truncate">' + s.region + ' · ' + s.addr + '</p>\n            </div>\n            <div class="shrink-0">' + badge + '</div>\n          </div>\n          <div class="mt-2 flex flex-wrap items-center gap-3 text-[11px] text-white/50">' + distDisplay + '<span class="whitespace-nowrap">🎰 ' + s.machines.length + ' 部機台</span><span class="whitespace-nowrap">' + s.size + '型' + (s.hour24 ? ' · 24H' : '') + (s.token ? ' · 需代幣' : '') + '</span></div>\n        </div>\n      </div>\n    </button>';
  }).join('');
  
  var moreBtn = hasMore ? '<button onclick="loadMoreStores()" class="mt-2 w-full rounded-2xl border border-gold/40 bg-zinc-950 py-4 text-center text-gold hover:border-gold/60 transition-all">🔽 顯示更多（' + (list.length - PAGE_SIZE) + ' 間）</button>' : '';
  return html + moreBtn;
}

function filteredStores() {
  var list = STORES.slice();
  if (findState.region !== "全部" && findState.region !== "") list = list.filter(function(s) { return s.region === findState.region; });
  if (userLocation) {
    list.forEach(function(s) { s._dist = (s.lat && s.lng) ? calculateDistance(userLocation.lat, userLocation.lng, s.lat, s.lng) : 9999; });
    list.sort(function(a, b) { return a._dist - b._dist; });
  } else {
    list.forEach(function(s) { s._dist = parseFloat(s.dist) || 9999; });
    list.sort(function(a, b) { return a._dist - b._dist; });
  }
  allFilteredStores = list;
  currentPage = 0;
  return list;
}

function loadMoreStores() {
  currentPage++;
  var start = currentPage * PAGE_SIZE, end = Math.min((currentPage + 1) * PAGE_SIZE, allFilteredStores.length);
  var pageItems = allFilteredStores.slice(start, end);
  if (pageItems.length === 0) { toast('已顯示全部店鋪', 'pink'); return; }
  var container = document.getElementById('store-list');
  if (!container) return;
  var oldMoreBtn = container.querySelector('button:last-child');
  if (oldMoreBtn && oldMoreBtn.textContent.includes('顯示更多')) oldMoreBtn.remove();
  
  var formatDist = function(s) {
    if (s._dist === 9999) return '📍 位置未知';
    if (s._dist < 1) return Math.round(s._dist * 1000) + "m";
    return s._dist.toFixed(1) + "km";
  };
  
  var newHtml = pageItems.map(function(s) {
    var isVerified = s.status === "verified" || s.verified === "verified";
    var badge = isVerified ? '<span class="rounded-full border border-neongreen/40 bg-neongreen/10 px-2 py-0.5 text-[10px] text-neongreen">✅ 已認證</span>' : '<span class="rounded-full border border-yellow-400/40 bg-yellow-400/10 px-2 py-0.5 text-[10px] text-yellow-400">⏳ 審核中</span>';
    var borderClass = isVerified ? "border-gold/25 hover:border-gold/60" : "border-yellow-400/30 border-dashed hover:border-yellow-400/60";
    var distDisplay = (userLocation && s.lat && s.lng) ? '<span class="text-neonpink neon-pink">📍 ' + formatDist(s) + '</span>' : '<span class="text-white/40">📍 ' + (s.dist || '?') + ' km</span>';

            '</div>' +

            '</div>' +
            '<div class="mt-2 flex items-center justify-between text-[10px]">' +
                '<span class="text-white/30">' + 
                    (isReached ? '🎉 已達標！' : '還差 ' + (50 - totalScore) + ' 分達標') + 
                '</span>' +

        '</div></div>\n' +

function renderWeeklyCheckin() {
  var progress = getWeeklyCheckinProgress();
  var dayNames = ['一', '二', '三', '四', '五', '六', '日'];
  var html = '<div class="mt-2">';
  html += '<div class="flex gap-1 justify-center">';
  for (var i = 1; i <= 7; i++) {
    var isSigned = progress.days.includes(i);
    var bg = isSigned ? 'bg-neongreen' : 'bg-white/10';
    var text = isSigned ? 'text-black' : 'text-white/30';
    html += '<div class="w-8 h-8 rounded-full ' + bg + ' flex items-center justify-center text-xs font-bold ' + text + '">' + dayNames[i - 1] + '</div>';
  }
  html += '</div>';
  html += '<div class="text-center text-[10px] text-white/40 mt-1">本週簽到 ' + progress.count + '/7 天</div>';
  var bonusInfo = '';
  if (progress.count >= 7) {
    bonusInfo = '🎊 已達全勤！';
  } else if (progress.count >= 5) {
    bonusInfo = '再 2 天達全勤 (+15分)';
  } else if (progress.count >= 3) {
    bonusInfo = '再 2 天達 5 天 (+5分)';
  } else {
    bonusInfo = (7 - progress.count) + ' 天後全勤 (+15分)';
  }
  html += '<div class="text-center text-[9px] text-gold/60 mt-0.5">' + bonusInfo + '</div>';
  html += '</div>';
  return html;
}

function renderAchievementProgress() {
  var achState = getAchievementState();
  var unlocked = achState.unlocked || [];
  var total = Object.keys(ACHIEVEMENT_DEFS).length;
  var nextAch = null;
  var minProgress = 100;
  
  for (var key in ACHIEVEMENT_DEFS) {
    if (unlocked.includes(key)) continue;
    var progress = getAchievementProgress(key);
    if (progress.percentage < minProgress && progress.percentage > 0) {
      minProgress = progress.percentage;
      nextAch = Object.assign({ key: key }, progress, { def: ACHIEVEMENT_DEFS[key] });
    }
  }
  
  var html = '<div class="mt-4 rounded-xl border border-gold/20 bg-zinc-950/50 p-3">\n    <div class="flex items-center justify-between">\n      <span class="text-xs text-white/40">🏆 成就進度</span>\n      <span class="text-[10px] text-gold">' + unlocked.length + '/' + total + '</span>\n    </div>\n    <div class="mt-1 h-1.5 w-full rounded-full bg-white/10 overflow-hidden">\n      <div class="h-full rounded-full bg-gold transition-all" style="width:' + (unlocked.length / total) * 100 + '%"></div>\n    </div>';
  
  if (nextAch) {
    html += '<div class="mt-2 text-[10px] text-white/40">\n      下一個成就：<span class="text-gold">' + nextAch.def.icon + ' ' + nextAch.def.name + '</span>\n      （' + nextAch.current + '/' + nextAch.required + '）\n    </div>';
  } else {
    html += '<div class="mt-2 text-[10px] text-neongreen">🎉 所有成就已解鎖！</div>';
  }
  html += '</div>';
  return html;
}

function quickAction(action, storeId) {
  var store = STORES.find(function(s) { return s.id === storeId; });
  if (!store) { toast('找不到該店鋪', 'pink'); return; }
  switch (action) {
    case 'checkin':
      doCheckin();
      break;
    case 'update':
      showView('map');
      setTimeout(function() {
        if (map && store.lat && store.lng) {
          map.flyTo([store.lat, store.lng], 16, { duration: 1 });
          setTimeout(function() {
            openStore(storeId);

          }, 800);
        } else {
          openStore(storeId);
        }

        openPlayerPostWithStore('lp', store);

      break;
    default:
      toast('未知操作', 'pink');
  }
}
