    async function sbFetch(path, opts = {}) {
      if (!CLOUD_ON) return null;
      const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
        ...opts,
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`,
          "Content-Type": "application/json",
          Prefer: "return=minimal",
          ...(opts.headers || {}),
        },
      });
      if (!res.ok) throw new Error("Supabase " + res.status);
      return res.status === 204 ? null : res.json();
    }

    async function cloudInsert(table, row) {
      if (!CLOUD_ON) return;
      try {
        await sbFetch(table, {
          method: "POST",
          headers: { Prefer: "return=minimal" },
          body: JSON.stringify([{ ...row, device: STATE.user.device, created_at: new Date().toISOString() }])
        });
      } catch (e) { console.log("[v0] cloudInsert 失敗:", e.message); }
    }

    async function uploadImage(file, folder = 'stores') {
      if (!CLOUD_ON) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = (e) => resolve(e.target.result);
          reader.readAsDataURL(file);
        });
      }

    function getFloorsInMall(mallName) {
      const group = window._mallGroups && window._mallGroups[mallName];
      if (!group) return [];
      const floorSet = new Set();
      group.stores.forEach(s => {
        const floor = s.floor || 'G';
        floorSet.add(floor);
      });
      const floors = Array.from(floorSet);
      floors.sort((a, b) => {
        if (a === 'G') return -1;
        if (b === 'G') return 1;
        const numA = parseInt(a);
        const numB = parseInt(b);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return a.localeCompare(b);
      });
      return floors;
    }

    function getStoresByFloor(mallName, floor) {
      const group = window._mallGroups && window._mallGroups[mallName];
      if (!group) return [];
      return group.stores.filter(s => (s.floor || 'G') === floor);
    }

  let targetFloor = highlightFloor;
  if (!targetFloor && highlightStoreId) {
    const store = group.stores.find(s => s.id === highlightStoreId);
    if (store) targetFloor = store.floor || 'G';

  if (!targetFloor) {

    targetFloor = floors.length > 0 ? floors[0] : 'G';

              onclick="switchMallFloor('${mallName.replace(/'/g, "\\'")}', '${floor}')">

function generateStoreListHtml(mallName, floor, highlightStoreId) {
  const stores = getStoresByFloor(mallName, floor);
  if (!stores.length) {
    return `<p style="text-align:center;color:rgba(255,255,255,0.3);padding:30px 0;font-size:13px;">此樓層暫無店鋪</p>`;
  }

  return stores.map((s, idx) => {
    const number = idx + 1;
    const isHighlight = s.id === highlightStoreId;
    const statusClass = s.verified === "verified" ? 'verified' : 'pending';
    const statusText = s.verified === "verified" ? '✅ 已認證' : '⏳ 審核中';
    return `
      <div class="mall-store-item ${isHighlight ? 'highlight' : ''}" 
           onclick="onMallStoreClick('${s.id}', '${mallName.replace(/'/g, "\\'")}', '${floor}')">

        <span class="store-name">${s.name}</span>
        <span class="store-status ${statusClass}">${statusText}</span>
      </div>

  }).join('');
}

    /* ============================================================
   4b. 地圖核心邏輯

function initMap() {
  const container = document.getElementById('map-container');
  if (!container) {
    console.error('❌ map-container 不存在');
    return;
  }

  // ===== 確保地圖容器可見 =====
  container.style.display = 'block';
  container.style.width = '100%';
  container.style.height = '100%';

  // ===== 如果地圖已初始化，直接刷新，不重複創建 =====
  if (mapInitialized && map && map.getContainer()) {
    console.log('🗺️ 地圖已初始化，跳過重複創建，執行刷新');
    // 強制刷新
    requestAnimationFrame(() => {
      setTimeout(() => {
        if (map) {
          // 先重置容器大小
          const c = document.getElementById('map-container');
          if (c) {
            c.style.display = 'block';
            c.style.width = '100%';
            c.style.height = '100%';
          }
          map.invalidateSize(true);
          if (userLocation) {
            map.setView([userLocation.lat, userLocation.lng], map.getZoom());
          }
          updateMapMarkers();
          updateMapList();
        }
      }, 100);
    });
    return;
  }

  // 如果 map 物件存在但未初始化，清理舊的
  if (map) {
    try {
      map.remove();
    } catch (e) {}
    map = null;
    markerCluster = null;
    userMarker = null;
  }

  let center = { lat: HK_CENTER.lat, lng: HK_CENTER.lng };
  let zoom = 13;
  if (userLocation) {
    center = { lat: userLocation.lat, lng: userLocation.lng };
    zoom = 15;
    console.log(`🗺️ 定位到 GPS 位置`);
  } else {
    console.log(`🗺️ 定位到香港中心點（等待 GPS）`);
  }

  try {
    map = L.map('map-container', {
      center: [center.lat, center.lng],
      zoom: zoom,
      zoomControl: false,
      attributionControl: true,
    });
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>, &copy; CartoDB',
      maxZoom: 19,
    }).addTo(map);

    map.on('moveend zoomend', function() {
      updateMapList();
    });

    // ===== 聚合圈顯示店鋪總數 =====
    markerCluster = L.markerClusterGroup({
      iconCreateFunction: function(cluster) {
        // 計算所有子標記代表的店鋪總數
        let totalStores = 0;
        const childMarkers = cluster.getAllChildMarkers();

        childMarkers.forEach(marker => {
          // 檢查 marker 是否有 totalStores 屬性（商場合併標記）
          if (marker.options && marker.options.totalStores) {
            // 商場合併標記：加上該商場的店鋪數量
            totalStores += marker.options.totalStores || 1;
          } else {
            // 獨立舖或其他標記：加 1
            totalStores += 1;
          }
        });

        // 如果總數小於等於 1，不顯示聚合圈（直接顯示單獨標記）
        if (totalStores <= 1) {
          return L.divIcon({
            html: '',
            className: '',
            iconSize: L.point(0, 0),
          });
        }

        // 返回聚合圈，顯示店鋪總數
        return L.divIcon({
          html: `<div class="marker-cluster-custom">${totalStores}</div>`,
          className: '',
          iconSize: L.point(36, 36),
        });
      },
      maxClusterRadius: 60,
      spiderfyOnMaxZoom: true,
      showCoverageOnHover: false,
      zoomToBoundsOnClick: true,
    });
    map.addLayer(markerCluster);

    if (userLocation) {
      addUserMarker(userLocation.lat, userLocation.lng);
    }
    updateMapMarkers();
    updateMapList();

    mapInitialized = true;
    console.log('🗺️ 地圖初始化完成');
    setTimeout(() => {
      if (map) map.invalidateSize();
    }, 300);
  } catch (e) {
    console.error('地圖初始化失敗:', e);
    toast('地圖載入失敗，請重新整理', 'pink');
  }
}

    function updateMapMarkers() {

  standaloneStores.forEach(s => {

                <span style="transform:rotate(45deg);color:#fff;font-weight:900;font-size:10px;">●</span>
              </div>`,

    marker.bindPopup(`

    function flyToStore(id) {

function createStoreModal(id) {

  const hasNav = mallStores.length > 1 && currentIndex >= 0;
  const prevId = hasNav ? mallStores[(currentIndex - 1 + mallStores.length) % mallStores.length].id : null;
  const nextId = hasNav ? mallStores[(currentIndex + 1) % mallStores.length].id : null;

}function updateStoreContent(id) {
  const s = STORES.find(x => x.id === id);
  if (!s) return;
  
  const container = document.getElementById('store-modal-container');
  if (!container) return;
  
  const fav = STATE.favStores.includes(s.id);
  
  // 獲取商場店鋪列表和當前索引
  const { mallStores, currentIndex, mallName } = getMallStores(s);
  const hasNav = mallStores.length > 1 && currentIndex >= 0;
  const prevId = hasNav ? mallStores[(currentIndex - 1 + mallStores.length) % mallStores.length].id : null;
  const nextId = hasNav ? mallStores[(currentIndex + 1) % mallStores.length].id : null;
  
  // 構建新內容
  const newContent = buildStoreContent(s, { fav, hasNav, currentIndex, mallStores, mallName, prevId, nextId });
  
  // 直接替換內容（無動畫，流暢切換）
  container.innerHTML = newContent;
}function getMallStores(s) {
  let mallStores = [];
  let currentIndex = -1;
  let mallName = '';
  
  if (s.mall && s.mall.trim() !== '') {
    mallName = s.mall;
    const group = window._mallGroups && window._mallGroups[mallName];
    if (group && group.stores) {
      mallStores = group.stores.slice().sort((a, b) => {
        const floorA = a.floor || 'G';
        const floorB = b.floor || 'G';
        if (floorA === 'G') return -1;
        if (floorB === 'G') return 1;
        const numA = parseInt(floorA);
        const numB = parseInt(floorB);
        if (!isNaN(numA) && !isNaN(numB)) return numA - numB;
        return floorA.localeCompare(floorB);
      });
      currentIndex = mallStores.findIndex(store => store.id === s.id);
    }
  }
  
  return { mallStores, currentIndex, mallName };
}

    function viewFind() {

      let regionGroupOpen = { hk: false, kl: false, nt: false };
      let moreRegionsOpenMap = { hk: false, kl: false, nt: false };

      const renderRegionGroupFn = (groupKey) => {
        const data = REGIONS[groupKey];
        const isOpen = regionGroupOpen[groupKey];
        const isMoreOpen = moreRegionsOpenMap[groupKey] || false;
        const allRegions = isMoreOpen ? [...data.hot, ...data.more] : data.hot;
        if (!isOpen) return '';
        const items = [...allRegions];

        }
        return `
          <div class="mb-3 animate-pop">
            <div class="grid grid-cols-4 gap-2">

                  return `<button onclick="toggleMoreRegions('${groupKey}')" class="rounded-full border py-1.5 text-center text-xs transition-all ${isMoreOpen ? 'chip-active-gold border-gold/60' : 'border-gold/40 text-gold hover:border-gold/60'}">${item}</button>`;
                }
                return `<button onclick="setRegion('${item}')" class="rounded-full border py-1.5 text-center text-xs transition-all ${findState.region === item ? 'chip-active-gold border-gold/60' : 'border-gold/40 text-gold hover:border-gold/60'}">${item}</button>`;
              }).join("")}
            </div>
          </div>
        `;
      };

      return `
        <div class="mb-3 mt-4 flex items-center justify-between">

    function setRegion(r) {
      findState.region = r;
      if (r !== "全部" && r !== "") {
        STATE.recentRegions = STATE.recentRegions.filter(x => x !== r);
        STATE.recentRegions.unshift(r);

    function refreshGPS() {
      toast("定位中…", "green");
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
            gpsLat = userLocation.lat;
            gpsLng = userLocation.lng;
            toast("已更新附近店舖", "green");
            const region = getRegionFromCoords(userLocation.lat, userLocation.lng);
            if (region) findState.region = region;
            showView("find");
          },
          () => { toast("無法定位", "pink");
            showView("find"); }
        );
      } else { toast("此裝置不支援定位", "pink");
        showView("find"); }
    }

    function getRegionFromCoords(lat, lng) {
      if (lat >= 22.24 && lat <= 22.29 && lng >= 114.14 && lng <= 114.25) {
        if (lng >= 114.18 && lng <= 114.20) return '銅鑼灣';
        if (lng >= 114.16 && lng <= 114.17) return '中環';
        if (lng >= 114.20 && lng <= 114.22) return '北角';
        return '銅鑼灣';
      }
      if (lat >= 22.29 && lat <= 22.35 && lng >= 114.14 && lng <= 114.24) {
        if (lat >= 22.31 && lat <= 22.32 && lng >= 114.16 && lng <= 114.17) return '旺角';
        if (lat >= 22.29 && lat <= 22.30 && lng >= 114.16 && lng <= 114.17) return '尖沙咀';
        if (lat >= 22.31 && lat <= 22.33 && lng >= 114.22 && lng <= 114.24) return '觀塘';
        if (lat >= 22.32 && lat <= 22.33 && lng >= 114.15 && lng <= 114.16) return '深水埗';
        return '旺角';
      }
      if (lat >= 22.35 && lat <= 22.56 && lng >= 113.92 && lng <= 114.30) {
        if (lat >= 22.35 && lat <= 22.38 && lng >= 114.10 && lng <= 114.13) return '荃灣';
        if (lat >= 22.35 && lat <= 22.36 && lng >= 114.12 && lng <= 114.13) return '葵芳';
        if (lat >= 22.42 && lat <= 22.45 && lng >= 114.02 && lng <= 114.04) return '元朗';
        return '荃灣';
      }
      return null;
    }

    function filteredStores() {
      let list = STORES.slice();
      if (findState.region !== "全部" && findState.region !== "") {
        list = list.filter(s => s.region === findState.region);
      }
      if (userLocation) {
        list.forEach(s => {
          s._dist = (s.lat && s.lng) ? calculateDistance(userLocation.lat, userLocation.lng, s.lat, s.lng) : 9999;
        });
        list.sort((a, b) => a._dist - b._dist);
      } else {
        list.forEach(s => s._dist = parseFloat(s.dist) || 9999);
        list.sort((a, b) => a._dist - b._dist);
      }
      allFilteredStores = list;
      currentPage = 0;
      return list;
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

        '';

    }

    function loadMoreStores() {
      currentPage++;

        return `

      container.insertAdjacentHTML('beforeend', newHtml);

// ----- 認證專用 GPS -----
let _vfGpsReady = false;
let _vfGpsLat = null;
let _vfGpsLng = null;

function grabVerifyGPS() {
  const el = document.getElementById('vf-gps');
  if (!el) return;
  
  el.textContent = '定位中，請確認已開啟 GPS...';
  el.className = 'text-yellow-400 text-xs';
  _vfGpsReady = false;
  
  const retryBtn = document.getElementById('vf-gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        _vfGpsLat = pos.coords.latitude;
        _vfGpsLng = pos.coords.longitude;
        _vfGpsReady = true;
        el.textContent = `📍 定位成功：${_vfGpsLat.toFixed(2)}, ${_vfGpsLng.toFixed(2)} (精度 ±${Math.round(pos.coords.accuracy)}m)`;
        el.className = 'text-neongreen text-xs';
        // 觸發表單按鈕更新
        document.getElementById('vf-submit-btn')?.dispatchEvent(new Event('change'));
      },
      (err) => {
        _vfGpsReady = false;
        el.textContent = '⚠️ 定位失敗，請確認已開啟 GPS 並重新嘗試';
        el.className = 'text-neonpink text-xs';
        const retryBtn = document.getElementById('vf-gps-retry');
        if (retryBtn) retryBtn.classList.remove('hidden');
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  } else {
    _vfGpsReady = false;
    el.textContent = '⚠️ 此裝置不支援 GPS';
    el.className = 'text-neonpink text-xs';
  }
}

function retryVerifyGPS() {
  const retryBtn = document.getElementById('vf-gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  grabVerifyGPS();
}

// ----- 提交認證 -----
async function submitVerification(storeId) {
  const s = STORES.find(x => x.id === storeId);
  if (!s) {
    toast('找不到該店鋪', 'pink');
    return;
  }
  
  // 檢查照片
  const photoBlob = window._cam?.vf;
  if (!photoBlob) {
    toast('請先拍攝店鋪照片', 'pink');
    return;
  }
  
  // 檢查 GPS
  if (!_vfGpsReady || !_vfGpsLat || !_vfGpsLng) {
    toast('請等待 GPS 定位完成', 'pink');
    return;
  }
  
  // ===== 新增：檢查認證人 GPS 是否在店鋪附近 =====
  if (s.lat && s.lng) {
    const distance = calculateDistance(s.lat, s.lng, _vfGpsLat, _vfGpsLng);
    // 限制在 200 米內（香港市區店鋪密集，200 米合理）
    const MAX_DISTANCE_KM = 0.2;
    if (distance > MAX_DISTANCE_KM) {
      toast(`⚠️ 你距離該店鋪 ${(distance * 1000).toFixed(0)} 米，請在 200 米內認證`, 'pink');
      return;
    }
    console.log(`📍 認證距離：${(distance * 1000).toFixed(0)} 米（限制 200 米）`);
  } else {
    // 如果店鋪沒有 GPS 座標（舊資料），允許認證但記錄警告
    console.log('⚠️ 店鋪無 GPS 座標，跳過距離檢查');
  }
  
  // 上傳照片
  let photoUrl = window._camPreview?.vf || '';
  if (CLOUD_ON) {
    try {
      const file = new File([photoBlob], `verify_${Date.now()}.jpg`, { type: 'image/jpeg' });
      photoUrl = await uploadImage(file, 'verifications');
    } catch (e) {
      toast('圖片上傳失敗', 'pink');
      return;
    }
  }
  
  
  // 保存認證記錄
  const verification = {
    store_id: storeId,
    verifier_id: STATE.user.device,
    photo_url: photoUrl,
    lat: _vfGpsLat,
    lng: _vfGpsLng,
    note: document.getElementById('vf-note')?.value.trim() || '',
    status: 'pending',
    created_at: new Date().toISOString()
  };
  
  // 儲存到本地
  if (!STATE.verifications) STATE.verifications = {};
  STATE.verifications[storeId] = verification;
  save();
  
  // 上傳到雲端
  if (CLOUD_ON) {
    cloudInsert('store_verifications', verification);
  }
  
  // 更新店鋪認證計數
  s.verification_count = (s.verification_count || 0) + 1;
  
  // 檢查是否達到 2 個認證（自動通過）
  if (s.verification_count >= 2) {
    s.verified = 'verified';
    s.is_verified = true;
    
    // 獎勵提交者 +35 分
    if (s.submitted_by) {
      // 找到提交者並加積分（通過提交者的 device_id）
      addPoints(35, '認證通過追加獎勵');
      toast(`🎉 ${s.name} 已通過認證！提交者獲得 +35 分`, 'green');
    }
    
    // 更新成就統計 - store_complete
    updateAchievementStat('store_complete');
    
    // 更新地區成就（基於店鋪地區）
    const regionStat = getRegionStat(s.region);
    if (regionStat) {
      updateAchievementStat(regionStat);
    }
  }
  
  // 認證者獲得 +15 分
  addPoints(15, '認證店鋪');
  updateAchievementStat('verify_store');
  
  // 更新連續天數
  updateStreak();
  
  toast('✅ 認證提交成功！獲得 15 積分', 'green');
  closeModal();
  
  // 刷新店鋪詳情
  openStore(storeId);
}

// ----- 一次性提交全部補充資料 -----
function submitAllSupplement(storeId) {
  const s = STORES.find(x => x.id === storeId);
  if (!s) {
    toast('找不到該店鋪', 'pink');
    return;
  }
  
  // 收集所有資料
  const isStreet = s.type !== 'mall' && s.mall === '';
  let address = '';
  if (isStreet) {
    const addrInput = document.getElementById('sf-address');
    if (addrInput) address = addrInput.value.trim();
  }
  
  const size = window._sfSelections.size;
  const staff = window._sfSelections.staff;
  const coin = window._sfSelections.coin;
  
  // 驗證（地鋪需要地址）
  if (isStreet && !address) {
    toast('請輸入詳細地址', 'pink');
    return;
  }
  if (!size) {
    toast('請選擇規模', 'pink');
    return;
  }
  if (staff === null || staff === undefined) {
    toast('請選擇是否有場務', 'pink');
    return;
  }
  if (coin === null || coin === undefined) {
    toast('請選擇是否有電子兌幣', 'pink');
    return;
  }
  
  // 檢查是否已補充（避免重複提交）
  const hasAddress = s.address_detail && s.address_detail !== '';
  const hasSize = s.size && s.size !== '中';
  const hasStaff = s.has_staff !== undefined && s.has_staff !== null;
  const hasCoin = s.has_e_coin !== undefined && s.has_e_coin !== null;
  
  if ((!isStreet || hasAddress) && hasSize && hasStaff && hasCoin) {
    toast('此店鋪資料已完整，無需重複補充', 'gold');
    return;
  }
  
  // 更新店鋪資料
  if (isStreet && address) {
    s.address_detail = address;
  }
  s.size = size;
  s.has_staff = staff;
  s.has_e_coin = coin;
  s.supplement_count = (s.supplement_count || 0) + 1;
  
  // 儲存到雲端
  if (CLOUD_ON) {
  const updates = {};
  if (isStreet && address) updates.address_detail = address;
  updates.size = size;
  updates.has_staff = staff;
  updates.has_e_coin = coin;
  cloudInsert('claw_stores', { id: storeId, ...updates });
  
  // 記錄每項補充（全部加入 user_name）
  if (isStreet && address) {
    cloudInsert('store_supplements', {
      store_id: storeId,
      user_id: STATE.user.device,
      user_name: STATE.user.name,  // ← 新增
      supplement_type: 'address_detail',
      new_value: address
    });
  }
  cloudInsert('store_supplements', {
    store_id: storeId,
    user_id: STATE.user.device,
    user_name: STATE.user.name,  // ← 新增
    supplement_type: 'size',
    new_value: size
  });
  cloudInsert('store_supplements', {
    store_id: storeId,
    user_id: STATE.user.device,
    user_name: STATE.user.name,  // ← 新增
    supplement_type: 'has_staff',
    new_value: String(staff)
  });
  cloudInsert('store_supplements', {
    store_id: storeId,
    user_id: STATE.user.device,
    user_name: STATE.user.name,  // ← 新增
    supplement_type: 'has_e_coin',
    new_value: String(coin)
  });
}
  
  // 獎勵積分 + 成就統計（一次過 +15 分）
  addPoints(15, '補充資料完成');
  updateAchievementStat('supplement');
  
  // 檢查完美檔案
  checkPerfectFile(storeId);
  
  // 更新連續天數
  updateStreak();
  
  toast('✅ 全部資料補充完成！獲得 15 積分', 'green');
  closeModal();
  
  // 刷新店鋪詳情
  setTimeout(() => {
    openStore(storeId);
  }, 500);
}

// ----- 檢查完美檔案 -----
function checkPerfectFile(storeId) {
  const s = STORES.find(x => x.id === storeId);
  if (!s) return;
  
  // 檢查 4 項是否都已填寫
  const hasAddress = s.address_detail && s.address_detail !== '';
  const hasSize = s.size && s.size !== '中';
  const hasStaff = s.has_staff !== undefined && s.has_staff !== null;
  const hasCoin = s.has_e_coin !== undefined && s.has_e_coin !== null;
  
  if (hasAddress && hasSize && hasStaff && hasCoin) {
    // 解鎖完美檔案成就
    updateAchievementStat('perfect_file');
    toast('📝 完美檔案！這間店的資料已完整！+20 分', 'gold');
  }
}

// ----- 任務輔助函數：打開認證任務 -----
function openVerifyTask() {
  // 找一間未認證的店鋪讓用戶認證
  const pendingStores = STORES.filter(s => s.verified !== 'verified' && s.submitted_by !== STATE.user.device);
  if (pendingStores.length === 0) {
    toast('🎉 所有店鋪都已認證！', 'gold');
    return;
  }
  // 隨機選一間
  const target = pendingStores[Math.floor(Math.random() * pendingStores.length)];
  toast(`📍 請認證「${target.name}」`, 'green');
  openStore(target.id);
  // 延遲打開認證表單
  setTimeout(() => {
    openVerifyForm(target.id);
  }, 800);
}

// ----- 任務輔助函數：打開補充任務 -----
function openSupplementTask() {
  // 找一間資料不完整的店鋪
  const incompleteStores = STORES.filter(s => {
    const hasAddress = s.address_detail && s.address_detail !== '';
    const hasSize = s.size && s.size !== '中';
    const hasStaff = s.has_staff !== undefined && s.has_staff !== null;
    const hasCoin = s.has_e_coin !== undefined && s.has_e_coin !== null;
    return !(hasAddress && hasSize && hasStaff && hasCoin);
  });
  if (incompleteStores.length === 0) {
    toast('🎉 所有店鋪資料都已完整！', 'gold');
    return;
  }
  // 隨機選一間
  const target = incompleteStores[Math.floor(Math.random() * incompleteStores.length)];
  toast(`📝 請補充「${target.name}」的資料`, 'green');
  openStore(target.id);
  setTimeout(() => {
    openSupplementForm(target.id);
  }, 800);
}

}

  document.querySelectorAll('.type-btn').forEach(btn => {

    btn.classList.toggle('text-gold', isActive);
    btn.classList.toggle('glow-gold', isActive);
    btn.classList.toggle('border-white/20', !isActive);
    btn.classList.toggle('text-white/45', !isActive);

    camBtn.onclick = function() { openCamera('nt'); };

  const mallSection = document.getElementById('mall-section');
  const streetSection = document.getElementById('street-address-section');
  
  if (type === 'mall') {
    if (mallSection) mallSection.classList.remove('hidden');
    if (streetSection) streetSection.classList.add('hidden');
    // 如果有選擇地區，顯示該地區的商場
    if (selectedRegion) {

      if (mallOptions) mallOptions.innerHTML = `<span class="text-[10px] text-white/40 py-1">⚠️ 請先選擇地區</span>`;
    }
  } else {
    if (mallSection) mallSection.classList.add('hidden');
    if (streetSection) streetSection.classList.remove('hidden');
    selectedMall = '';
    selectedFloor = '';
    const floorSection = document.getElementById('floor-section');
    if (floorSection) floorSection.classList.add('hidden');
    const mallSelector = document.getElementById('mall-selector');
    if (mallSelector) mallSelector.classList.remove('hidden');
    const mallConfirmed = document.getElementById('mall-confirmed');

    const addressPreview = document.getElementById('address-preview');
    if (addressPreview) addressPreview.classList.add('hidden');
    const mallDisplay = document.getElementById('mall-display');
    if (mallDisplay) mallDisplay.textContent = '';
    const mallOptions = document.getElementById('mall-options');
    if (mallOptions) mallOptions.innerHTML = '';
    const floorInput = document.getElementById('nt-floor');
    if (floorInput) floorInput.value = '';
    mallSelectionMode = 'button';
    mallInputValue = '';
  }
  
  updateSubmitButton();
}

  if (!container) return;
  
  if (!selectedRegion) {
    container.innerHTML = `<span class="text-[10px] text-white/40 py-1">⚠️ 請先選擇地區</span>`;
    return;
  }
  
  let malls = [];
  let regionKey = '';
  
  Object.keys(REGIONS).forEach(key => {
    const group = REGIONS[key];
    if (group.hot.includes(selectedRegion) || group.more.includes(selectedRegion)) {
      regionKey = key;
    }
  });
  
  // ===== 從 MALLS_CACHE 獲取該三大區的商場，再過濾 DISTRICT =====
  if (regionKey && MALLS_CACHE && MALLS_CACHE[regionKey]) {
    malls = MALLS_CACHE[regionKey]
      .filter(m => m.district === selectedRegion)  // ← 關鍵：只顯示該 DISTRICT
      .map(m => m.name);
  }
  
  // 如果 MALLS_CACHE 為空或沒有該 district 的商場，從 STORES 提取
  if (malls.length === 0) {
    malls = [...new Set(
      STORES.filter(s => s.region === selectedRegion && s.mall).map(s => s.mall)
    )];
  }
  
  // 過濾（輸入模式）
  let filteredMalls = malls;
  if (mallSelectionMode === 'input' && mallInputValue.trim()) {
    const query = mallInputValue.trim().toLowerCase();
    filteredMalls = malls.filter(m => m.toLowerCase().includes(query));
  }
  
  const displayMalls = (mallSelectionMode === 'input' && filteredMalls.length > 0) ? filteredMalls : malls;
  
  let html = '';
  if (mallSelectionMode === 'button') {
    html += `
      <div class="flex flex-wrap gap-2 mb-2">
        <button onclick="switchToMallInput()" 
          class="px-3 py-1.5 rounded-full border border-gold/40 text-xs text-gold hover:bg-gold/10 transition-all">

        </button>
        ${malls.map(m => `

            class="mall-option-btn px-3 py-1.5 rounded-full border border-gold/40 text-xs text-gold hover:bg-gold/10 transition-all">
            🏬 ${m}
          </button>
        `).join('')}
      </div>
    `;
  } else {
    html += `
      <div class="flex gap-2 mb-2">
        <input id="mall-custom-input" placeholder="請輸入商場名稱" 
          class="flex-1 rounded-lg border border-gold/40 bg-zinc-900 px-3 py-2 text-sm placeholder-zinc-600 focus:outline-none focus:border-gold"
          value="${mallInputValue}"
          oninput="onMallCustomInput(this.value)" />
        <button onclick="confirmMallInput()" 
          class="px-4 py-2 rounded-lg bg-gold/20 border border-gold/40 text-sm text-gold font-bold hover:bg-gold/30 transition-all">
          ✅ 確認
        </button>
      </div>
      <div class="flex flex-wrap gap-2" id="mall-button-list">
        ${displayMalls.map(m => `
          <button onclick="selectMall('${m.replace(/'/g, "\\'")}')" 
            class="mall-option-btn px-3 py-1.5 rounded-full border border-gold/40 text-xs text-gold hover:bg-gold/10 transition-all">
            🏬 ${m}
          </button>
        `).join('')}
        ${displayMalls.length === 0 ? `
          <span class="text-[10px] text-white/40 py-1">該地區暫無商場</span>
        ` : ''}
      </div>
    `;
  }
  
  container.innerHTML = html;
  
  if (mallSelectionMode === 'input') {
    setTimeout(() => {
      const input = document.getElementById('mall-custom-input');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }, 50);
  }

    if (selectedRegion === '港島區') regionKey = 'hk';

    else if (selectedRegion === '新界區') regionKey = 'nt';
    else {
      Object.keys(REGIONS).forEach(key => {
        const group = REGIONS[key];
        if (group.hot.includes(selectedRegion) || group.more.includes(selectedRegion)) {
          regionKey = key;
        }
      });
    }
    
    if (regionKey && MALLS_CACHE && MALLS_CACHE[regionKey]) {
      malls = MALLS_CACHE[regionKey].map(m => m.name);
    }
    if (malls.length === 0) {
      malls = [...new Set(
        STORES.filter(s => s.region === selectedRegion && s.mall).map(s => s.mall)
      )];
    }
    
    const query = value.trim().toLowerCase();
    // 有查詢時過濾，無查詢時顯示全部
    const filteredMalls = query ? malls.filter(m => m.toLowerCase().includes(query)) : malls;

// ===== 樓層輸入 =====
function onFloorInput(value) {
  const clean = value.replace(/[^Gg0-9]/g, '').toUpperCase();
  if (clean.length <= 3) {
    selectedFloor = clean;
    const input = document.getElementById('nt-floor');
    if (input) input.value = clean;
    updateAddressPreview();
    updateSubmitButton();
  } else {
    const input = document.getElementById('nt-floor');
    if (input) input.value = value.slice(0, 3);
  }
}

// ===== 更新地址預覽 =====
function updateAddressPreview() {
  const preview = document.getElementById('address-preview');
  const text = document.getElementById('address-preview-text');
  if (!preview || !text) return;
  
  if (selectedType === 'mall' && selectedMall && selectedFloor) {
    const mallStore = STORES.find(s => s.mall === selectedMall && s.region === selectedRegion);
    let addr = '';
    if (mallStore && mallStore.addr) {
      addr = mallStore.addr;
    }
    const district = selectedRegion || '';
    text.textContent = `${district}${addr}${selectedMall}${selectedFloor}樓`;
    preview.classList.remove('hidden');
  } else {
    preview.classList.add('hidden');
  }
}

// ===== 獲取 GPS =====
function grabGPS(elementId) {
  const el = document.getElementById(elementId);
  if (!el) return;
  
  el.textContent = '定位中，請確認已開啟 GPS...';
  el.className = 'text-yellow-400 text-xs';
  isGpsReady = false;
  
  const retryBtn = document.getElementById('gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        gpsLat = pos.coords.latitude;
        gpsLng = pos.coords.longitude;
        gpsAccuracy = pos.coords.accuracy;
        isGpsReady = true;
        // 顯示小數點後 2 位，儲存完整精度
        el.textContent = `📍 定位成功：${gpsLat.toFixed(2)}, ${gpsLng.toFixed(2)}`;
        el.className = 'text-neongreen text-xs';
        updateSubmitButton();
      },
      (err) => {
        isGpsReady = false;
        el.textContent = '⚠️ 定位失敗，請確認已開啟 GPS 並重新嘗試';
        el.className = 'text-neonpink text-xs';
        const retryBtn = document.getElementById('gps-retry');
        if (retryBtn) retryBtn.classList.remove('hidden');
        updateSubmitButton();
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  } else {
    isGpsReady = false;
    el.textContent = '⚠️ 此裝置不支援 GPS';
    el.className = 'text-neonpink text-xs';
    updateSubmitButton();
  }
}
// ===== 店名下拉清單（開頭匹配） =====
function updateNameSuggestions(value) {
  const container = document.getElementById('name-suggestions');
  const input = document.getElementById('nt-name');
  if (!container || !input) return;
  
  const query = value.trim();
  
  if (query.length < 1) {
    container.classList.add('hidden');
    return;
  }
  
  // 從 STORES 提取店名，去重，開頭匹配
  const uniqueNames = [...new Set(STORES.map(s => s.name))];
  const matched = uniqueNames
    .filter(name => name.toLowerCase().startsWith(query.toLowerCase()))
    .slice(0, 6);
  
  if (matched.length === 0) {
    container.classList.add('hidden');
    return;
  }
  
  container.classList.remove('hidden');
  container.innerHTML = matched.map(name => `
    <button onclick="selectNameSuggestion('${name.replace(/'/g, "\\'")}')" 
      class="block w-full text-left px-3 py-2 hover:bg-gold/20 text-sm text-white/80 border-b border-white/10 last:border-0 transition-colors">
      📝 ${name}
    </button>
  `).join('');
}

function selectNameSuggestion(name) {
  const input = document.getElementById('nt-name');
  const container = document.getElementById('name-suggestions');
  if (input) {
    input.value = name;
    input.dispatchEvent(new Event('input'));
  }
  if (container) container.classList.add('hidden');
  updateSubmitButton();
}

// ===== 點擊外部關閉下拉清單 =====
document.addEventListener('click', function(e) {
  const container = document.getElementById('name-suggestions');
  const input = document.getElementById('nt-name');
  if (container && input && !container.contains(e.target) && e.target !== input) {
    container.classList.add('hidden');
  }
});

// ===== 渲染地區選擇器（Tab 切頁模式） =====
let currentTab = 'hk'; // 'hk' | 'kl' | 'nt'

function renderRegionSelectorTab() {
  const container = document.querySelector('.region-selector-container');
  if (!container) return;
  
  // 不再強制重置 currentTab，保留用戶點擊的選擇
  
  const tabsHtml = `
    <div class="flex gap-2 mb-3">
      ${Object.keys(REGIONS).map(key => {
        const group = REGIONS[key];
        const isActive = currentTab === key;
        return `
          <button onclick="switchTab('${key}')" 
            class="region-tab flex-1 rounded-xl border py-2 text-sm font-black transition-all
            ${isActive 
              ? 'border-gold bg-gold/20 text-gold glow-gold' 
              : 'border-white/20 text-white/45 hover:border-gold/40 hover:text-gold'}">
            ${group.icon} ${group.label}
          </button>
        `;
      }).join('')}
    </div>
  `;
  
  const group = REGIONS[currentTab];
  const isMoreOpen = intelMoreOpenMap && intelMoreOpenMap[currentTab] || false;
  const allRegions = isMoreOpen ? [...group.hot, ...group.more] : group.hot;
  
  const regionsHtml = `
    <div class="flex flex-wrap gap-1.5">
      ${allRegions.map(r => `
        <button onclick="selectRegion('${r}', '${currentTab}')" 
          data-region="${r}"
          class="region-btn rounded-full border border-gold/40 px-3 py-1 text-xs text-gold hover:bg-gold/10 transition-all
          ${selectedRegion === r ? 'chip-active-gold border-gold/60' : ''}">
          ${r}
        </button>
      `).join('')}
      ${group.more.length > 0 ? `
        <button onclick="toggleMoreRegionsTab()" 
          class="rounded-full border border-gold/40 px-3 py-1 text-xs text-gold/50 hover:text-gold transition-all">
          ${isMoreOpen ? '📍 收起' : '📍 更多'}
        </button>
      ` : ''}
    </div>
  `;
  
  container.innerHTML = tabsHtml + regionsHtml;
}

// ===== 切換 Tab =====
function switchTab(tabKey) {
  currentTab = tabKey;
  renderRegionSelectorTab();
}

// ===== 切換更多地區（Tab 模式） =====
function toggleMoreRegionsTab() {
  if (!intelMoreOpenMap) {
    intelMoreOpenMap = { hk: false, kl: false, nt: false };
  }
  intelMoreOpenMap[currentTab] = !intelMoreOpenMap[currentTab];
  renderRegionSelectorTab();
}

// ===== 更新 Tab 高亮 =====
function updateTabHighlight(region) {
  let foundTab = 'hk';
  Object.keys(REGIONS).forEach(key => {
    const group = REGIONS[key];
    if (group.hot.includes(region) || group.more.includes(region)) {
      foundTab = key;
    }
  });
  currentTab = foundTab;
  renderRegionSelectorTab();
}

// ----- 提交出貨戰報 -----
async function submitPlayerPost() {
  const storeId = document.getElementById('lp-store-select')?.value;
  if (!storeId) {
    toast('請選擇店鋪', 'pink');
    return;
  }
  
  const photoBlob = window._cam?.lp;
  if (!photoBlob) {
    toast('請先拍照', 'pink');
    return;
  }
  
  const content = document.getElementById('lp-content')?.value.trim() || '🎉 出貨成功！';
  const store = STORES.find(s => s.id === storeId);
  
  // 上傳照片
  let photoUrl = '';
  if (CLOUD_ON) {
    try {
      const file = new File([photoBlob], `post_${Date.now()}.jpg`, { type: 'image/jpeg' });
      photoUrl = await uploadImage(file, 'posts');
    } catch (e) {
      toast('圖片上傳失敗', 'pink');
      return;
    }
  }
  
  // 儲存貼文
  const post = {
    id: 'p' + Date.now(),
    track: 'player',
    store_id: storeId,
    store_name: store ? store.name : '',
    content: content,
    photo: photoUrl,
    author: STATE.user.name,
    ts: now(),
    expire: now() + DAY,
    likes: 0,
    comments: 0
  };
  
  if (!STATE.livePosts) STATE.livePosts = [];
  STATE.livePosts.unshift(post);
  save();
  
  // 獎勵
  addPoints(5, '發布出貨戰報');
  updateStreak();
  
  toast('✅ 戰報發布成功！+5 分', 'green');
  closeModal();
  showView('live');
}

// ----- 提交台主宣傳 -----
async function submitOwnerPost() {
  const storeId = document.getElementById('lo-store-select')?.value;
  if (!storeId) {
    toast('請選擇店鋪', 'pink');
    return;
  }
  
  const photoBlob = window._cam?.lo;
  if (!photoBlob) {
    toast('請先拍照', 'pink');
    return;
  }
  
  const content = document.getElementById('lo-content')?.value.trim() || '🏬 新機台上架！';
  const store = STORES.find(s => s.id === storeId);
  const isLinked = window._loLinkMode || false;
  
  // 檢查積分（連結模式需要 20 分）
  if (isLinked && STATE.points < 20) {
    toast('積分不足 20，無法使用連結功能', 'pink');
    return;
  }
  
  // 上傳照片
  let photoUrl = '';
  if (CLOUD_ON) {
    try {
      const file = new File([photoBlob], `post_${Date.now()}.jpg`, { type: 'image/jpeg' });
      photoUrl = await uploadImage(file, 'posts');
    } catch (e) {
      toast('圖片上傳失敗', 'pink');
      return;
    }
  }
  
  // 扣積分（連結模式）
  if (isLinked) {
    addPoints(-20, '連結機台宣傳');
  }
  
  // 儲存貼文
  const post = {
    id: 'p' + Date.now(),
    track: 'owner',
    store_id: storeId,
    store_name: store ? store.name : '',
    content: content,
    photo: photoUrl,
    author: STATE.user.name,
    ts: now(),
    expire: isLinked ? now() + DAY * 30 : now() + DAY, // 連結模式 30 天，免費 24 小時
    is_linked: isLinked,
    likes: 0,
    comments: 0
  };
  
  if (!STATE.livePosts) STATE.livePosts = [];
  STATE.livePosts.unshift(post);
  save();
  
  // 獎勵（免費模式 +5 分，連結模式不加分因為已扣分）
  if (!isLinked) {
    addPoints(5, '發布台主宣傳');
  } else {
    toast('✅ 宣傳發布成功！連結已啟用（-20 分）', 'green');
  }
  updateStreak();
  
  toast(isLinked ? '✅ 宣傳發布成功！連結已啟用' : '✅ 宣傳發布成功！+5 分', 'green');
  closeModal();
  showView('live');
}

    function closeCamera(key) {

      if (stream) { stream.getTracks().forEach(t => t.stop());
        delete window._camStreams[key]; }
      const container = document.getElementById(`${key}-camera-container`);
      if (container) {
        container.innerHTML =
          `<button onclick="openCamera('${key}')" class="w-full rounded-lg bg-neongreen/90 py-2.5 text-sm font-black text-black">📸 開啟相機拍照</button>`;

    // ===== 拍照 =====
async function capturePhoto(key) {
  const videoEl = document.getElementById(`${key}-video`);
  if (!videoEl) return toast('請先開啟相機', 'pink');
  
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth || 800;
  canvas.height = videoEl.videoHeight || 600;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  
  // 顯示預覽
  const img = document.getElementById(`${key}-preview`);
  if (img) {
    img.src = dataUrl;
    img.classList.remove('hidden');
    img.style.display = 'block';
  }
  
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
  window._cam[key] = blob;
  window._camPreview[key] = dataUrl;
  
  // 關閉相機，顯示重拍按鈕
  closeCamera(key);
  
  // 在相機容器中顯示預覽 + 重拍按鈕
  const container = document.getElementById(`${key}-camera-container`);
  if (container) {
    container.innerHTML = `
      <div class="relative">
        <img src="${dataUrl}" class="w-full rounded-lg" alt="店鋪照片" />
        <div class="mt-2 flex gap-2">
          <button onclick="reopenCamera('${key}')" 
            class="flex-1 rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all">
            🔄 重新拍攝
          </button>
          <button onclick="clearPhoto('${key}')" 
            class="flex-1 rounded-lg border border-white/20 py-2 text-sm text-white/40 hover:bg-white/5 transition-all">
            ✕ 移除
          </button>
        </div>
      </div>
    `;
  }
  
  toast('✅ 已拍照！', 'green');
}

function reopenCamera(key) {
  // 清除照片
  window._cam[key] = null;
  window._camPreview[key] = null;
  // 重新打開相機
  openCamera(key);
}

// ===== 用戶成就狀態（儲存在 LocalStorage 的擴充） =====
function getAchievementState() {
  if (!STATE.achievements) {
    STATE.achievements = {
      unlocked: [],      // 已解鎖的成就 key 列表
      stats: {
        submit_store: 0,      // 提交店鋪總數
        verify_store: 0,      // 認證店鋪總數
        supplement: 0,        // 補充資料總次數
        store_complete: 0,    // 完整認證店鋪數
        region_hk_island: 0,  // 港島區認證數
        region_kowloon: 0,    // 九龍區認證數
        region_nt: 0,         // 新界區認證數
        perfect_file: 0,      // 完美檔案數
        streak_days: 0,       // 連續天數
        last_active_date: '', // 最後活躍日期
        weekly_days: [],      // 本週活躍天數 (1-7)
        monthly_days: []      // 本月活躍天數 (1-30)
      }
    };
    save();
  }
  return STATE.achievements;
}

// ===== 更新統計數據 =====
function updateAchievementStat(statType, increment = 1) {
  const state = getAchievementState();
  if (state.stats[statType] !== undefined) {
    state.stats[statType] += increment;
    save();
    checkAchievements();
  }
}

// ===== 更新連續天數 =====
function updateStreak() {
  const state = getAchievementState();
  const today = todayKey();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  const yesterdayKey = yesterday.toISOString().slice(0, 10);
  
  if (state.stats.last_active_date === today) {
    // 今天已經更新過了
    return;
  }
  
  if (state.stats.last_active_date === yesterdayKey) {
    // 連續
    state.stats.streak_days += 1;
  } else if (state.stats.last_active_date !== today) {
    // 中斷了
    state.stats.streak_days = 1;
  }
  
  state.stats.last_active_date = today;
  
  // 更新週全勤
  const dayOfWeek = new Date().getDay(); // 0=Sun, 1=Mon, ...
  const weekDay = dayOfWeek === 0 ? 7 : dayOfWeek;
  if (!state.stats.weekly_days.includes(weekDay)) {
    state.stats.weekly_days.push(weekDay);
    if (state.stats.weekly_days.length === 7) {
      updateAchievementStat('weekly_perfect', 1);
      state.stats.weekly_days = []; // 重置
    }
  }
  
  // 更新月全勤
  const dayOfMonth = new Date().getDate();
  if (!state.stats.monthly_days.includes(dayOfMonth)) {
    state.stats.monthly_days.push(dayOfMonth);
    if (state.stats.monthly_days.length === 30 || state.stats.monthly_days.length === 31) {
      updateAchievementStat('monthly_perfect', 1);
      state.stats.monthly_days = []; // 重置
    }
  }
  
  save();
  checkAchievements();
}

// ===== 檢查並解鎖成就 =====
function checkAchievements() {
  const state = getAchievementState();
  const unlocked = state.unlocked || [];
  let newlyUnlocked = [];
  
  Object.keys(ACHIEVEMENT_DEFS).forEach(key => {
    // 如果已解鎖，跳過
    if (unlocked.includes(key)) return;
    
    const def = ACHIEVEMENT_DEFS[key];
    const stats = state.stats;
    let isUnlocked = false;
    
    switch (def.condition.type) {
      case 'submit_store':
        if (stats.submit_store >= def.condition.count) isUnlocked = true;
        break;
      case 'verify_store':
        if (stats.verify_store >= def.condition.count) isUnlocked = true;
        break;
      case 'store_complete':
        if (stats.store_complete >= def.condition.count) isUnlocked = true;
        break;
      case 'region_hk_island':
        if (stats.region_hk_island >= def.condition.count) isUnlocked = true;
        break;
      case 'region_kowloon':
        if (stats.region_kowloon >= def.condition.count) isUnlocked = true;
        break;
      case 'region_nt':
        if (stats.region_nt >= def.condition.count) isUnlocked = true;
        break;
      case 'region_all':
        // 需要三個地區成就都解鎖
        if (unlocked.includes('hk_island') && 
            unlocked.includes('kowloon') && 
            unlocked.includes('nt')) {
          isUnlocked = true;
        }
        break;
      case 'supplement':
        if (stats.supplement >= def.condition.count) isUnlocked = true;
        break;
      case 'perfect_file':
        if (stats.perfect_file >= def.condition.count) isUnlocked = true;
        break;
      case 'streak':
        if (stats.streak_days >= def.condition.count) isUnlocked = true;
        break;
      case 'weekly_perfect':
        if (stats.weekly_perfect >= def.condition.count) isUnlocked = true;
        break;
      case 'monthly_perfect':
        if (stats.monthly_perfect >= def.condition.count) isUnlocked = true;
        break;
      default:
        break;
    }
    
    if (isUnlocked) {
      unlocked.push(key);
      newlyUnlocked.push(key);
      // 發放獎勵
      if (def.reward.points > 0) {
        addPoints(def.reward.points, `解鎖成就：${def.name}`);
      }
      // 如果有稱號，儲存
      if (def.reward.title) {
        // 可儲存稱號到 STATE
        if (!STATE.titles) STATE.titles = [];
        if (!STATE.titles.includes(def.reward.title)) {
          STATE.titles.push(def.reward.title);
        }
      }
      // 雲端記錄
      if (CLOUD_ON) {
        cloudInsert('user_achievements', {
          user_id: STATE.user.device,
          achievement_key: key,
          achievement_name: def.name
        });
      }
      // 顯示解鎖通知
      showAchievementUnlock(def);
    }
  });
  
  STATE.achievements.unlocked = unlocked;
  save();
  
  return newlyUnlocked;
}

// ===== 獲取用戶成就進度 =====
function getAchievementProgress(key) {
  const state = getAchievementState();
  const def = ACHIEVEMENT_DEFS[key];
  if (!def) return { current: 0, required: 0, percentage: 0, isUnlocked: false };
  
  const stats = state.stats;
  const unlocked = state.unlocked || [];
  let current = 0;
  let required = def.condition.count;
  
  switch (def.condition.type) {
    case 'submit_store': current = stats.submit_store || 0; break;
    case 'verify_store': current = stats.verify_store || 0; break;
    case 'store_complete': current = stats.store_complete || 0; break;
    case 'region_hk_island': current = stats.region_hk_island || 0; break;
    case 'region_kowloon': current = stats.region_kowloon || 0; break;
    case 'region_nt': current = stats.region_nt || 0; break;
    case 'region_all': current = unlocked.includes('hk_island') && unlocked.includes('kowloon') && unlocked.includes('nt') ? 1 : 0; break;
    case 'supplement': current = stats.supplement || 0; break;
    case 'perfect_file': current = stats.perfect_file || 0; break;
    case 'streak': current = stats.streak_days || 0; break;
    case 'weekly_perfect': current = stats.weekly_perfect || 0; break;
    case 'monthly_perfect': current = stats.monthly_perfect || 0; break;
    default: break;
  }
  
  const isUnlocked = unlocked.includes(key);
  const percentage = Math.min(100, Math.round((current / required) * 100));
  
  return { current, required, percentage, isUnlocked };
}

// ===== 獲取用戶等級資訊 =====
function getUserLevel() {
  const xp = STATE.total_xp || 0;
  const levels = [
    { level: 1, title: '新手爪友', xp: 0 },
    { level: 2, title: '見習爪客', xp: 50 },
    { level: 3, title: '探索爪客', xp: 150 },
    { level: 4, title: '情報爪客', xp: 300 },
    { level: 5, title: '資深爪客', xp: 500 },
    { level: 6, title: '偵查爪客', xp: 800 },
    { level: 7, title: '獵人爪客', xp: 1200 },
    { level: 8, title: '金牌爪客', xp: 1800 },
    { level: 9, title: '傳說爪客', xp: 2500 },
    { level: 10, title: '爪皇', xp: 3500 }
  ];
  
  let currentLevel = levels[0];
  let nextLevel = levels[1];
  for (let i = levels.length - 1; i >= 0; i--) {
    if (xp >= levels[i].xp) {
      currentLevel = levels[i];
      nextLevel = levels[i + 1] || null;
      break;
    }
  }
  
  return {
    level: currentLevel.level,
    title: currentLevel.title,
    xp: xp,
    xpForCurrent: currentLevel.xp,
    xpForNext: nextLevel ? nextLevel.xp : xp,
    nextTitle: nextLevel ? nextLevel.title : null,
    percentage: nextLevel ? Math.min(100, Math.round(((xp - currentLevel.xp) / (nextLevel.xp - currentLevel.xp)) * 100)) : 100
  };
}

// ===== 新增經驗值（整合原有 addPoints） =====
function addXP(amount, actionType) {
  if (!STATE.total_xp) STATE.total_xp = 0;
  STATE.total_xp += amount;

// ===== 更新每日活動記錄 =====
function updateDailyActivity(type) {
  const today = todayKey();
  if (!STATE.daily[today]) {
    STATE.daily[today] = { checkin: 0, review: 0, zombie: 0, ad: 0, adCooldownUntil: 0, live: 0, promoUsed: 0 };
  }
  
  // 打卡
  if (type === 'checkin') {
    STATE.daily[today].checkin = (STATE.daily[today].checkin || 0) + 1;
    // 更新連續天數
    updateStreak();
    // 每日打卡成就檢查
    checkAchievements();
  }
  
  save();
}

        if (map && mapInitialized) {

          });

          updateMapMarkers();
          updateMapList();
