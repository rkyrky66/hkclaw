window._cam = {};
window._camPreview = {};
window._camStreams = {};

function openCamera(key) {
  var container = document.getElementById(key + "-camera-container");
  if (!container) return;
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      gpsLat = pos.coords.latitude;
      gpsLng = pos.coords.longitude;
      isGpsReady = true;
      if (document.getElementById('nt-gps')) {
        var el = document.getElementById('nt-gps');
        el.textContent = '📍 定位成功：' + gpsLat.toFixed(2) + ', ' + gpsLng.toFixed(2);
        el.className = 'text-neongreen text-xs';
      }
      if (document.getElementById('vf-gps')) {
        var el = document.getElementById('vf-gps');
        el.textContent = '📍 定位成功：' + gpsLat.toFixed(2) + ', ' + gpsLng.toFixed(2);
        el.className = 'text-neongreen text-xs';
        _vfGpsReady = true;
        _vfGpsLat = gpsLat;
        _vfGpsLng = gpsLng;
      }
      updateFormState();
    }, function() { console.log('⚠️ 拍照時定位失敗，使用上次位置'); }, { enableHighAccuracy: true, timeout: 5000 });
  }
  
  if (window._camPreview && window._camPreview[key]) {
    container.innerHTML = '<div class="relative"><img src="' + window._camPreview[key] + '" class="w-full rounded-lg" alt="店鋪照片" /><div class="mt-2 flex gap-2"><button onclick="reopenCamera(\'' + key + '\')" class="flex-1 rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all">🔄 重新拍攝</button><button onclick="clearPhoto(\'' + key + '\')" class="flex-1 rounded-lg border border-white/20 py-2 text-sm text-white/40 hover:bg-white/5 transition-all">✕ 移除</button></div></div>';
    return;
  }
  
  container.innerHTML = '<video id="' + key + '-video" autoplay playsinline class="w-full rounded-lg bg-black" style="max-height:300px;"></video><div class="mt-2 flex gap-2"><button onclick="capturePhoto(\'' + key + '\')" class="flex-1 rounded-lg bg-neongreen py-2.5 text-sm font-black text-black">📸 拍照</button><button onclick="closeCamera(\'' + key + '\')" class="flex-1 rounded-lg border border-white/30 py-2.5 text-xs text-white/60">取消</button></div>';
  
  var videoEl = document.getElementById(key + "-video");
  if (!videoEl) return;
  
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(function(stream) { videoEl.srcObject = stream; videoEl.play(); window._camStreams[key] = stream; })
    .catch(function(err) { handleCameraError(err, key); });
}

function handleCameraError(err, key) {
  var container = document.getElementById(key + "-camera-container");
  if (!container) return;
  var errorTitle = '❌ 無法開啟相機', errorMsg = '', guideSteps = [];
  
  if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
    errorTitle = '📱 相機權限被拒絕';
    errorMsg = '為了確保店鋪情報的真實性，需要拍攝現場照片。';
    guideSteps = ['1️⃣ 開啟手機「設定」應用程式', '2️⃣ 點選「隱私權」或「應用程式管理」', '3️⃣ 點選「相機」', '4️⃣ 找到「Chrome」或「Safari」等瀏覽器', '5️⃣ 將相機權限改為「允許」', '6️⃣ 返回此頁面，點擊下方「重新嘗試」'];
  } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
    errorTitle = '📷 找不到相機裝置';
    errorMsg = '請確認你的裝置有後置鏡頭，且未被其他應用程式佔用。';
    guideSteps = ['1️⃣ 確認手機有後置鏡頭', '2️⃣ 關閉其他使用相機的 App（如 Instagram、WhatsApp）', '3️⃣ 重新啟動手機後再試', '4️⃣ 如果仍無法使用，可嘗試使用其他瀏覽器'];
  } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
    errorTitle = '🔒 相機被其他 App 佔用';
    errorMsg = '相機可能正在被其他應用程式使用。';
    guideSteps = ['1️⃣ 關閉所有使用相機的應用程式', '2️⃣ 重新啟動瀏覽器', '3️⃣ 再次點擊「開啟相機拍照」'];
  } else {
    errorTitle = '⚠️ 相機開啟失敗';
    errorMsg = '發生未知錯誤，請嘗試以下步驟：';
    guideSteps = ['1️⃣ 重新整理頁面（按 F5 或下拉重整）', '2️⃣ 重新啟動手機', '3️⃣ 嘗試使用其他瀏覽器（Chrome 或 Safari）', '4️⃣ 如果持續失敗，可先提交其他情報'];
  }
  
  container.innerHTML = '<div class="rounded-xl border border-neonpink/50 bg-neonpink/5 p-4 text-left"><div class="flex items-start gap-2"><span class="text-2xl">' + errorTitle.split(' ')[0] + '</span><div class="flex-1"><p class="font-bold text-neonpink">' + errorTitle + '</p><p class="text-xs text-white/60 mt-1">' + errorMsg + '</p></div></div><div class="mt-3 rounded-lg bg-black/40 p-3"><p class="text-[10px] font-bold text-gold/70 mb-1">📋 解決步驟：</p>' + guideSteps.map(function(step) { return '<p class="text-[10px] text-white/50 leading-relaxed">' + step + '</p>'; }).join('') + '</div><div class="mt-3 flex gap-2"><button onclick="openCamera(\'' + key + '\')" class="flex-1 rounded-lg bg-neongreen/80 py-2 text-sm font-black text-black">🔄 重新嘗試</button><button onclick="closeCamera(\'' + key + '\')" class="flex-1 rounded-lg border border-white/20 py-2 text-xs text-white/50">暫時跳過</button></div><p class="text-[8px] text-white/30 mt-2 text-center">💡 提示：拍照是為了確保情報真實性，建立社群信任</p></div>';
}

function closeCamera(key) {
  var stream = window._camStreams?.[key];
  if (stream) { stream.getTracks().forEach(function(t) { return t.stop(); }); delete window._camStreams[key]; }
  var container = document.getElementById(key + "-camera-container");
  if (container) container.innerHTML = '<button onclick="openCamera(\'' + key + '\')" class="w-full rounded-lg bg-neongreen/90 py-2.5 text-sm font-black text-black">📸 開啟相機拍照</button>';
}

async function capturePhoto(key) {
  var videoEl = document.getElementById(key + "-video");
  if (!videoEl) return toast('請先開啟相機', 'pink');
  var canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth || 800;
  canvas.height = videoEl.videoHeight || 600;
  var ctx = canvas.getContext('2d');
  ctx.drawImage(videoEl, 0, 0);
  var dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  var img = document.getElementById(key + "-preview");
  if (img) { img.src = dataUrl; img.classList.remove('hidden'); img.style.display = 'block'; }
  var blob = await new Promise(function(resolve) { return canvas.toBlob(resolve, 'image/jpeg', 0.8); });
  window._cam[key] = blob;
  window._camPreview[key] = dataUrl;
  
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      gpsLat = pos.coords.latitude;
      gpsLng = pos.coords.longitude;
      isGpsReady = true;
      if (document.getElementById('nt-gps')) {
        var el = document.getElementById('nt-gps');
        el.textContent = '📍 定位成功：' + gpsLat.toFixed(2) + ', ' + gpsLng.toFixed(2);
        el.className = 'text-neongreen text-xs';
      }
      if (document.getElementById('vf-gps')) {
        var el = document.getElementById('vf-gps');
        el.textContent = '📍 定位成功：' + gpsLat.toFixed(2) + ', ' + gpsLng.toFixed(2);
        el.className = 'text-neongreen text-xs';
        _vfGpsReady = true;
        _vfGpsLat = gpsLat;
        _vfGpsLng = gpsLng;
      }
      updateFormState();
    }, function() { console.log('⚠️ 拍照完成時定位失敗，使用上次位置'); }, { enableHighAccuracy: true, timeout: 3000 });
  }
  
  closeCamera(key);
  var container = document.getElementById(key + "-camera-container");
  if (container) {
    container.innerHTML = '<div class="relative"><img src="' + dataUrl + '" class="w-full rounded-lg" alt="店鋪照片" /><div class="mt-2 flex gap-2"><button onclick="reopenCamera(\'' + key + '\')" class="flex-1 rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all">🔄 重新拍攝</button><button onclick="clearPhoto(\'' + key + '\')" class="flex-1 rounded-lg border border-white/20 py-2 text-sm text-white/40 hover:bg-white/5 transition-all">✕ 移除</button></div></div>';
  }
  
  if (typeof checkPostForm === 'function') {
    var prefix = key === 'lp' ? 'lp' : key === 'lo' ? 'lo' : null;
    if (prefix) checkPostForm(prefix);
  }
  toast('✅ 已拍照！', 'green');
}

function reopenCamera(key) { window._cam[key] = null; window._camPreview[key] = null; openCamera(key); }

function clearPhoto(key) {
  window._cam[key] = null;
  window._camPreview[key] = null;
  var container = document.getElementById(key + "-camera-container");
  if (container) container.innerHTML = '<button onclick="openCamera(\'' + key + '\')" class="w-full rounded-lg bg-neongreen/90 py-2.5 text-sm font-black text-black">📸 開啟相機拍照</button>';
  var img = document.getElementById(key + "-preview");
  if (img) { img.classList.add('hidden'); img.style.display = 'none'; }
  toast('已移除照片', 'pink');
}

async function submitMachine(sid) {
  var photoBlob = window._cam?.mf;
  if (!photoBlob) return toast("請先拍照", "pink");
  
  if (!gpsLat || !gpsLng) {
    toast('📍 請先點擊「開啟相機拍照」以獲取位置', 'pink');
    return;
  }
  
  var photoUrl = window._camPreview?.mf || '';
  if (CLOUD_ON) {
    try {
      var file = new File([photoBlob], Date.now() + ".jpg", { type: 'image/jpeg' });
      photoUrl = await uploadImage(file, 'machines');
    } catch (e) { toast('圖片上傳失敗', 'pink'); return; }
  }
  
  var s = STORES.find(function(x) { return x.id === sid; });
  if (!s) { toast('找不到該店鋪', 'pink'); return; }
  
  if (s.lat && s.lng) {
    var distance = calculateDistance(s.lat, s.lng, gpsLat, gpsLng);
    if (distance > 0.2) {
      toast('⚠️ 你距離該店鋪 ' + (distance * 1000).toFixed(0) + ' 米，請在 200 米內上架機台', 'pink');
      return;
    }
  }
  
  var feats = document.querySelectorAll('#mf-feats .chip-active-green');
  var featsArray = [];
  feats.forEach(function(b) { return featsArray.push(b.dataset.tag); });
  if (!featsArray.length) return toast("請至少選一個台性標籤", "pink");
  
  var playsArray = [];
  document.querySelectorAll('#mf-plays .chip-active-green').forEach(function(b) { return playsArray.push(b.dataset.tag); });
  
  s.machines.unshift({ id: sid + "_u" + uid(), no: "新" + (s.machines.length + 1), feats: featsArray, plays: playsArray, prize: "台主自報", updated: now(), photo: photoUrl });
  cloudInsert("claw_machines", { store_id: sid, feats: featsArray, photo: photoUrl });
  toast("機台已上架", "green");
  
  // 記錄任務進度 (機台打卡)
  await recordTaskCompletion('machine_checkin');
  
  // 記錄貢獻 (機台共享)
  if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
    try {
      await fetch(
        SUPABASE_URL + "/rest/v1/user_contributions",
        {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
          body: JSON.stringify([{
            user_id: STATE.user.user_id,
            device_id: STATE.user.device,
            store_id: sid,
            contribution_type: 'machine',
            contribution_value: 1,
            created_at: new Date().toISOString()
          }])
        }
      );
    } catch (e) {
      console.warn('⚠️ 貢獻記錄同步失敗:', e.message);
    }
  }
  
  var followers = STATE.favStores.filter(function(storeId) { return storeId === sid; });
  if (followers.length > 0) {
    if (!STATE.notifications) STATE.notifications = [];

// 獲取今日打卡記錄
function getTodayCheckins() {
    var today = todayKey();
    if (!STATE.checkins) STATE.checkins = {};
    if (!STATE.checkins[today]) STATE.checkins[today] = [];
    return STATE.checkins[today];
}

// 檢查是否已在該店鋪打卡
function hasCheckedInToday(storeId) {
    var checkins = getTodayCheckins();
    return checkins.indexOf(storeId) !== -1;
}

// 店鋪打卡
async function doStoreCheckin(storeId) {
    var s = STORES.find(function(x) { return x.id === storeId; });
    if (!s) { toast('找不到該店鋪', 'pink'); return; }
    
    // 檢查是否已打卡
    if (hasCheckedInToday(storeId)) {
        toast('📍 今日已在「' + s.name + '」打卡，明天再來吧！', 'gold');
        return;
    }
    
    // 檢查 GPS
    if (!gpsLat || !gpsLng) {
        toast('📍 請先開啟 GPS 定位', 'pink');
        return;
    }
    
    // GPS 距離檢查 (300米)
    if (s.lat && s.lng) {
        var distance = calculateDistance(s.lat, s.lng, gpsLat, gpsLng);
        var distanceMeters = Math.round(distance * 1000);
        if (distance > 0.3) {
            toast('⚠️ 你距離該店鋪 ' + distanceMeters + ' 米，請在 300 米內打卡', 'pink');
            return;
        }
        toast('✅ 距離 ' + distanceMeters + ' 米，在 300 米範圍內', 'green');
    }
    
    // 記錄打卡
    var checkins = getTodayCheckins();
    checkins.push(storeId);
    save();
    
    // 記錄任務進度
    await recordTaskCompletion('checkin');
    
    // 同步到雲端
    if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
        try {
            await fetch(
                SUPABASE_URL + "/rest/v1/store_checkins",
                {
                    method: 'POST',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify([{
                        user_id: STATE.user.user_id,
                        device_id: STATE.user.device,
                        store_id: storeId,
                        store_name: s.name,
                        checkin_date: todayKey(),
                        lat: gpsLat,
                        lng: gpsLng,
                        created_at: new Date().toISOString()
                    }])
                }
            );
        } catch (e) {
            console.warn('⚠️ 打卡雲端同步失敗:', e.message);
        }
    }
    
    toast('✅ 在「' + s.name + '」打卡成功！+5 分', 'green');
    
    // 更新店鋪詳情 (刷新按鈕狀態)
    updateStoreContent(storeId);
}

function timeAgo(ts) {
  var diff = now() - ts;
  if (diff < HOUR) return Math.max(1, Math.floor(diff / 60000)) + " 分鐘前";
  if (diff < DAY) return Math.floor(diff / HOUR) + " 小時前";
  return Math.floor(diff / DAY) + " 天前";
}

// ============================================================
// GPS 定位 (完整版)
// ============================================================
function refreshGPS() {
  const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
  toast("定位中…", "green");
  
  if (!navigator.geolocation) {
    toast("此裝置不支援定位", "pink");
    showView("find");
    return;
  }
  
  if (navigator.permissions && navigator.permissions.query) {
    navigator.permissions.query({ name: 'geolocation' }).then(function(result) {
      if (result.state === 'denied') {
        if (isIOS) {
          showIOSLocationGuide();
        } else {
          showAndroidLocationGuide();
        }
        return;
      } else if (result.state === 'prompt') {
        doLocationRequest();
      } else if (result.state === 'granted') {
        doLocationRequest();
      }
    }).catch(function() {
      doLocationRequest();
    });
  } else {
    doLocationRequest();
  }
}

function doLocationRequest() {
  navigator.geolocation.getCurrentPosition(
    function(pos) {
      userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      gpsLat = userLocation.lat;
      gpsLng = userLocation.lng;
      toast("✅ 定位成功！已更新附近店舖", "green");
      const region = getRegionFromCoords(userLocation.lat, userLocation.lng);
      if (region) findState.region = region;
      if (map && mapInitialized) {
        map.flyTo([userLocation.lat, userLocation.lng], 15, { duration: 1 });
        addUserMarker(userLocation.lat, userLocation.lng);
        updateMapMarkers();
        updateMapList();
        updateRegionProgress();
      }
      showView("find");
    },
    function(err) {
      const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (err.code === 1) {
        if (isIOS) {
          showIOSLocationGuide();
        } else {
          showAndroidLocationGuide();
        }
      } else if (err.code === 2) {
        toast("📡 GPS 訊號弱，請到室外", "pink");
      } else if (err.code === 3) {
        toast("⏱️ 定位超時，請重試", "pink");
      } else {
        toast("❌ 定位失敗: " + err.message, "pink");
      }
      showView("find");
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

function getRegionFromCoords(lat, lng) {
  if (lat >= 22.24 && lat <= 22.29 && lng >= 114.14 && lng <= 114.25) {
    if (lng >= 114.18 && lng <= 114.20) return '銅鑼灣';
    if (lng >= 114.16 && lng <= 114.17) return '中環';
    if (lng >= 114.20 && lng <= 114.22) return '北角';
    return '銅鑼灣';
  }
  if (lat >= 22.29 && lat <= 22.35 && lng >= 114.14 && lng <= 114.24) {
    if (lat >= 22.31 && lat <= 22.32 && lng >= 114.16 && lng <= 114.17) return '旺角';
    if (lat >= 22.29 && lat <= 22.30 && lng >= 114.16 && lng <= 114.17) return '尖沙咀';
    if (lat >= 22.31 && lat <= 22.33 && lng >= 114.22 && lng <= 114.24) return '觀塘';
    if (lat >= 22.32 && lat <= 22.33 && lng >= 114.15 && lng <= 114.16) return '深水埗';
    return '旺角';
  }
  if (lat >= 22.35 && lat <= 22.56 && lng >= 113.92 && lng <= 114.30) {
    if (lat >= 22.35 && lat <= 22.38 && lng >= 114.10 && lng <= 114.13) return '荃灣';
    if (lat >= 22.35 && lat <= 22.36 && lng >= 114.12 && lng <= 114.13) return '葵芳';
    if (lat >= 22.42 && lat <= 22.45 && lng >= 114.02 && lng <= 114.04) return '元朗';
    return '荃灣';
  }
  return null;
}

// ============================================================
// 下拉刷新
// ============================================================
function initPullToRefresh() {
  var container = document.getElementById('main');
  var indicator = document.getElementById('pull-indicator');
  if (!container || !indicator) return;
  
  container.addEventListener('touchstart', function(e) {
    if (container.scrollTop === 0) {
      pullStartY = e.touches[0].clientY;
      isPulling = true;
      pullMoveY = 0;
    }
  }, { passive: true });
  
  container.addEventListener('touchmove', function(e) {
    if (!isPulling || isRefreshing) return;
    var deltaY = e.touches[0].clientY - pullStartY;
    if (deltaY > 0 && container.scrollTop === 0) {
      pullMoveY = Math.min(deltaY, 80);
      indicator.style.top = Math.min(pullMoveY - 60, 0) + "px";
      var text = indicator.querySelector('.text');
      if (text) text.textContent = pullMoveY > 60 ? '🔄 鬆手同步資料' : '⬇️ 下拉同步最新資料';
      indicator.classList.toggle('active', pullMoveY > 60);
    }
  }, { passive: true });
  
  container.addEventListener('touchend', function() {
    if (isPulling && pullMoveY > 60 && !isRefreshing) {
      isRefreshing = true;
      if (indicator) {
        indicator.classList.add('loading');
        indicator.style.top = '0px';
        var text = indicator.querySelector('.text');
        if (text) text.textContent = '🔄 同步中...';
      }
      refreshAllData().catch(function(e) {
        toast('同步失敗: ' + e.message, 'pink');
      }).finally(function() {
        if (indicator) {
          indicator.classList.remove('loading', 'active');
          indicator.style.top = '-60px';
          var text = indicator.querySelector('.text');
          if (text) text.textContent = '⬇️ 下拉同步最新資料';
        }
        isRefreshing = false;
      });
    }
    isPulling = false;
    pullMoveY = 0;
  }, { passive: true });
}

async function refreshAllData() {
  toast('🔄 正在同步最新資料...', 'green');
  await loadCloud();
  await loadMalls();
  await loadLivePosts();
  await processPendingPosts();
  await processOfflineReports();
  await loadTaskProgressFromCloud();
  
  if (CURRENT === 'map') {
    if (mapInitialized) { updateMapMarkers(); updateMapList(); updateRegionProgress(); ensureStoresVisible(); }
    else { initMap(); }
  } else { showView(CURRENT); }
  toast('✅ 已更新至最新資料', 'green');
}

const UserFocus = {
  getFavorites() { return STATE.favStores || []; },
  getCurrentViewing() { return STATE._currentViewingStore || null; },
  getFavoriteMachines() { return STATE.favMachines || []; },
  setCurrentViewing(storeId) { STATE._currentViewingStore = storeId; save(); },
  clearCurrentViewing() { STATE._currentViewingStore = null; save(); },
  isInterested(storeId) {
    const favorites = this.getFavorites();
    const current = this.getCurrentViewing();
    return favorites.includes(storeId) || current === storeId;
  }
};

// ============================================================
// 啟動應用
// ============================================================
(async function initApp() {
  console.log('🚀 爪爪情報站啟動中...');
  await loadCloud();
  await loadMalls();
  await loadLivePosts();
  await processPendingPosts();
  await processOfflineReports();
  await CheckinManager.syncFromCloud();
  await loadTaskProgressFromCloud();
  
  setTimeout(() => {
    CheckinManager.checkAndShowReminder();
  }, 2000);
  
  setInterval(async function() {
    await processPendingPosts();
    await processOfflineReports();
  }, 300000);
  
  const mapPage = document.getElementById('map-page-container');
  const overlay = document.getElementById('page-overlay');
  if (mapPage) mapPage.style.display = 'flex';
  if (overlay) overlay.style.display = 'none';
  
  setTimeout(() => { initMap(); }, 300);
  setTimeout(() => { updateMapList(); updateRegionProgress(); }, 500);
  setTimeout(initPullToRefresh, 500);
  
  if (navigator.geolocation) {
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      console.log('📱 iOS 裝置：定位需要用戶點擊觸發');
      setTimeout(() => {
        toast('📍 請點擊「重新定位」按鈕獲取位置', 'gold');
      }, 1500);
    } else {
      navigator.geolocation.getCurrentPosition(
        function(pos) {
          userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
          gpsLat = userLocation.lat;
          gpsLng = userLocation.lng;
          console.log('✅ 自動定位成功:', userLocation);
          if (map && mapInitialized) {
            map.flyTo([userLocation.lat, userLocation.lng], 15, { duration: 1.2 });
            addUserMarker(userLocation.lat, userLocation.lng);
            updateMapMarkers();
            updateMapList();
            updateRegionProgress();
          }
        },
        function(err) {
          console.log('⚠️ 自動定位失敗:', err.message);
          toast('📍 請點擊「重新定位」按鈕獲取位置', 'gold');
        },
        { enableHighAccuracy: true, timeout: 5000, maximumAge: 60000 }
      );
    }
  } else {
    console.log('⚠️ 此裝置不支援 GPS 定位');
  }
  
  console.log('🚀 爪爪情報站啟動完成！');
})();
