async function sbFetch(path, opts = {}) {
  if (!CLOUD_ON) return null;
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "return=minimal",
      ...(opts.headers || {}),
    },
  });
  if (!res.ok) throw new Error("Supabase " + res.status);
  return res.status === 204 ? null : res.json();
}
async function cloudInsert(table, row) {
  if (!CLOUD_ON) return;
  try { 
    await sbFetch(table, { 
      method: "POST", 
      headers: {
        Prefer: "return=minimal"
      },
      body: JSON.stringify([{ ...row, device: STATE.user.device, created_at: new Date().toISOString() }]) 
    }); 
  }
  catch (e) { 
    console.log("[v0] cloudInsert 失敗:", e.message);
  }
}
// 上傳圖片到 Supabase Storage
async function uploadImage(file, folder = 'stores') {
  if (!CLOUD_ON) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => resolve(e.target.result);
      reader.readAsDataURL(file);
    });
  }
  
  const BUCKET = 'claw-stores-images';
  const fileName = `${folder}/${Date.now()}_${uid()}.jpg`;
  const path = `storage/v1/object/${BUCKET}/${fileName}`;
  
  const uploadRes = await fetch(`${SUPABASE_URL}/${path}`, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      'Content-Type': file.type || 'image/jpeg',
    },
    body: file,
  });
  
  if (!uploadRes.ok) {
    const errText = await uploadRes.text();
    console.error('上傳失敗 - 狀態:', uploadRes.status, '響應:', errText);
    try {
      const errJson = JSON.parse(errText);
      throw new Error(`上傳失敗: ${errJson.message || errText}`);
    } catch {
      throw new Error(`上傳失敗 (${uploadRes.status}): ${errText}`);
    }
  }
  
  const publicUrl = `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${fileName}`;
  return publicUrl;
}

let MALLS_CACHE = null;

async function loadMalls() {
  if (!CLOUD_ON) {
    return { hk: [], kl: [], nt: [] };
  }
  
  if (MALLS_CACHE) return MALLS_CACHE;
  
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/malls?select=*&order=name`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      }
    });
    
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    
    const malls = await response.json();
    
    const grouped = { hk: [], kl: [], nt: [] };
    malls.forEach(m => {
      if (m.region === '港島區') grouped.hk.push(m);
      else if (m.region === '九龍區') grouped.kl.push(m);
      else if (m.region === '新界區') grouped.nt.push(m);
    });
    
    MALLS_CACHE = grouped;
    console.log(`✅ 載入 ${malls.length} 個商場`);
    return grouped;
    
  } catch (e) {
    console.error('載入商場失敗:', e);
    return { hk: [], kl: [], nt: [] };
  }
}

  Object.keys(regionGroupOpen).forEach(key => {
    if (key !== group) regionGroupOpen[key] = false;
  });
  showView("find");
}

// 渲染某大區的地區按鈕
function renderRegionGroup(group) {
  const data = REGIONS[group];
  const isOpen = regionGroupOpen[group];
  const isMoreOpen = moreRegionsOpenMap[group] || false;
  const allRegions = isMoreOpen ? [...data.hot, ...data.more] : data.hot;
  
  if (!isOpen) return '';
  
  const items = [...allRegions];
  if (data.more.length > 0) {
    items.push(isMoreOpen ? '📍 收起' : '📍 更多');
  }
  
  return `
    <div class="mb-3 animate-pop">
      <div class="grid grid-cols-4 gap-2">
        ${items.map(item => {
          if (item === '📍 更多' || item === '📍 收起') {
            return `
              <button onclick="toggleMoreRegions('${group}')" 
                class="rounded-full border py-1.5 text-center text-xs transition-all
                ${isMoreOpen 
                  ? 'chip-active-gold border-gold/60' 
                  : 'border-gold/40 text-gold hover:border-gold/60'}"
              >${item}</button>
            `;
          }
          return `
            <button onclick="setRegion('${item}')" 
              class="rounded-full border py-1.5 text-center text-xs transition-all
              ${findState.region === item 
                ? 'chip-active-gold border-gold/60' 
                : 'border-gold/40 text-gold hover:border-gold/60'}"
            >${item}</button>
          `;
        }).join("")}
      </div>
    </div>
  `;
}

// 渲染商場列表（根據已選 district 過濾）
async function renderMallList(query = '') {
  const container = document.getElementById('nt-mall-list');
  if (!container) return;
  
  // 如果沒有選中地區，提示用戶
  if (!selectedIntelRegion) {
    container.innerHTML = `<p class="text-xs text-white/40">請先選擇地區</p>`;
    return;
  }
  
  const malls = await loadMalls();
  
  // 從所有商場中過濾出 district 等於所選地區的商場
  let allMalls = [];
  Object.keys(malls).forEach(key => {
    allMalls = allMalls.concat(malls[key]);
  });
  
  let mallList = allMalls.filter(m => m.district === selectedIntelRegion);
  
  // 如果有搜尋關鍵字，進一步過濾
  if (query && query.trim()) {
    const q = query.trim().toLowerCase();
    mallList = mallList.filter(m => m.name.toLowerCase().includes(q));
  }
  
  // 按名稱排序
  mallList.sort((a, b) => a.name.localeCompare(b.name));
  
  if (mallList.length === 0) {
    container.innerHTML = `
      <p class="text-xs text-white/40">「${selectedIntelRegion}」暫無商場資料</p>
      <p class="mt-1 text-[10px] text-white/30">請在輸入框中直接輸入商場名稱</p>
    `;
    return;
  }
  
  container.innerHTML = `
    <p class="mb-1.5 text-[10px] text-white/40">快速選擇</p>
    <div class="flex flex-wrap gap-2">
      ${mallList.map(m => `
        <button onclick="selectMall('${m.name.replace(/'/g, "\\'")}')" 
          class="rounded-full border py-1.5 px-3 text-center text-xs transition-all
          ${selectedMall === m.name 
            ? 'chip-active-gold border-gold/60' 
            : 'border-gold/40 text-gold hover:border-gold/60'}"
        >${m.name}</button>
      `).join('')}
    </div>
  `;
}

// 選擇商場
function selectMall(name) {
  selectedMall = name;
  
  // 填入輸入框
  const input = document.getElementById('nt-mall-input');
  if (input) {
    input.value = name;
  }
  
  // 顯示樓層輸入框
  const floorSection = document.getElementById('nt-floor-section');
  if (floorSection) {
    floorSection.classList.remove('hidden');
  }
  
  // 清空樓層輸入框（切換商場時重置）
  const floorInput = document.getElementById('nt-floor');
  if (floorInput) {
    floorInput.value = '';
  }
  
  // ===== 更新詳細地址（檢查是否有完整地址） =====
  const addrInput = document.getElementById('nt-addr');
  const mallData = getMallData(name);
  
  if (addrInput) {
    if (mallData && mallData.address) {
      // ✅ 有完整地址：自動填入
      addrInput.value = mallData.address;
      toast('✅ 已自動填入地址', 'green');
    } else {
      // ❌ 無完整地址：只填商場名
      addrInput.value = name;
      toast('📍 可補充完整地址獲得 +5 積分', 'gold');
    }
  }
  
  // 重新渲染商場列表（更新高亮）
  renderMallList(name);
  
  // 綁定樓層輸入事件（即時更新地址）
  if (floorInput) {
    floorInput.removeEventListener('input', updateAddressWithFloor);
    floorInput.addEventListener('input', updateAddressWithFloor);
  }
}

// 更新地址（加入樓層）
function updateAddressWithFloor() {
  const mallInput = document.getElementById('nt-mall-input');
  const floorInput = document.getElementById('nt-floor');
  const addrInput = document.getElementById('nt-addr');
  
  if (!mallInput || !floorInput || !addrInput) return;
  
  const mallName = mallInput.value.trim();
  const floor = floorInput.value.trim();
  
  if (mallName) {
    if (floor) {
      addrInput.value = `${mallName} ${floor}樓`;
    } else {
      addrInput.value = mallName;
    }
  }
}

function setRegion(r) {
  findState.region = r;
  
  if (r !== "全部" && r !== "") {
    STATE.recentRegions = STATE.recentRegions.filter(x => x !== r);
    STATE.recentRegions.unshift(r);
    if (STATE.recentRegions.length > 6) {
      STATE.recentRegions = STATE.recentRegions.slice(0, 6);
    }
    save();
  }
  
  showView("find");
}
function filteredStores() {
  let list = STORES.slice();
  
  if (findState.region !== "全部" && findState.region !== "") {
    list = list.filter(s => s.region === findState.region);
  }
  
  list.forEach(s => s._hit = false);
  
  if (filterActive()) {
    const on = id => document.getElementById(id)?.checked;
    
    if (on("f_token")) list = list.filter(s => !s.token);
    if (on("f_24")) list = list.filter(s => s.hour24);
    if (on("f_staff")) list = list.filter(s => s.staff);
    if (on("f_big")) list = list.filter(s => s.size === "大");
    
    const tag = document.getElementById("f_tag")?.value;
    if (tag) {
      list.forEach(s => s._hit = s.machines.some(m => m.feats.includes(tag)));
      list.sort((a, b) => (b._hit === true) - (a._hit === true));
    }
  }
  
  return list.sort((a, b) => (b._hit === true) - (a._hit === true) || a.dist - b.dist);
}

async function submitMachine(sid) {
  const photoBlob = window._cam?.mf;
  if (!photoBlob) return toast("請先現拍機台照", "pink");
  
  let photoUrl = window._camPreview?.mf || '';
  if (CLOUD_ON) {
    try {
      const file = new File([photoBlob], `${Date.now()}.jpg`, { type: 'image/jpeg' });
      photoUrl = await uploadImage(file, 'machines');
    } catch (e) {
      toast('圖片上傳失敗，請重試', 'pink');
      return;
    }
  }
  
  const feats = selectedTags("mf-feats");
  if (!feats.length) return toast("請至少選一個台性標籤", "pink");
  
  const s = STORES.find(x => x.id === sid);
  s.machines.unshift({ 
    id: sid + "_u" + uid(), 
    no: "新" + (s.machines.length + 1), 
    feats, 
    plays: selectedTags("mf-plays"), 
    prize: "台主自報", 
    updated: now(), 
    photo: photoUrl
  });
  
  cloudInsert("claw_machines", { store_id: sid, feats, photo: photoUrl });
  toast("機台已上架，相片成為識別", "green");
  closeModal(); 
  openStore(sid);
}

  // 不再需要 input 監聽，改由 capturePhoto 處理

// 開啟相機
function openCamera(key) {
  const container = document.getElementById(`${key}-camera-container`);
  if (!container) return;
  
  container.innerHTML = `
    <video id="${key}-video" autoplay playsinline class="w-full rounded-lg bg-black" style="max-height:300px;"></video>
    <div class="mt-2 flex gap-2">
      <button onclick="capturePhoto('${key}')" class="flex-1 rounded-lg bg-neongreen py-2.5 text-sm font-black text-black">📸 拍照</button>
      <button onclick="closeCamera('${key}')" class="flex-1 rounded-lg border border-white/30 py-2.5 text-xs text-white/60">取消</button>
    </div>
  `;
  
  const videoEl = document.getElementById(`${key}-video`);
  if (!videoEl) return;
  
  navigator.mediaDevices.getUserMedia({ 
    video: { facingMode: 'environment' } 
  }).then(stream => {
    videoEl.srcObject = stream;
    videoEl.play();
    window._camStreams = window._camStreams || {};
    window._camStreams[key] = stream;
  }).catch(() => {
    toast('無法開啟相機，請允許權限', 'pink');
    closeCamera(key);
  });
}

// 拍照
async function capturePhoto(key) {
  const videoEl = document.getElementById(`${key}-video`);
  if (!videoEl) return toast('請先開啟相機', 'pink');
  
  const canvas = document.createElement('canvas');
  canvas.width = videoEl.videoWidth || 800;
  canvas.height = videoEl.videoHeight || 600;
  canvas.getContext('2d').drawImage(videoEl, 0, 0);
  
  const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
  
  const img = document.getElementById(`${key}-preview`);
  const sz = document.getElementById(`${key}-size`);
  if (img) { img.src = dataUrl; img.classList.remove('hidden'); }
  
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.8));
  window._cam[key] = blob;
  window._camPreview[key] = dataUrl;
  
  const kb = Math.round(blob.size / 1024);
  if (sz) { sz.textContent = `已壓縮 ${kb}KB`; sz.className = 'mt-1 text-[10px] text-neongreen'; }
  
  closeCamera(key);
  toast('✅ 已拍照！', 'green');
}

window._camPreview = {};

// 關閉相機
function closeCamera(key) {
  const stream = window._camStreams?.[key];
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    delete window._camStreams[key];
  }
  const container = document.getElementById(`${key}-camera-container`);
  if (container) {
    container.innerHTML = `
      <button onclick="openCamera('${key}')" class="w-full rounded-lg bg-neongreen/90 py-2.5 text-sm font-black text-black">
        📸 開啟相機拍照（強制現拍）
      </button>
    `;
  }
}
async function compressTo(input, key, maxW, q, targetKB) {
  const file = input.files[0]; 
  if (!file) return;
  
  const dataUrl = await new Promise((resolve) => {
    compressImage(file, maxW, q, targetKB, (dataUrl) => resolve(dataUrl));
  });
  
  const blob = await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      canvas.toBlob(resolve, 'image/jpeg', q);
    };
    img.onerror = () => {
      fetch(dataUrl).then(r => r.blob()).then(resolve);
    };
    img.src = dataUrl;
  });
  
  window._cam[key] = blob;
  window._camPreview[key] = dataUrl;
  
  const img = document.getElementById(`${key}-preview`);
  const sz = document.getElementById(`${key}-size`);
  if (img) { 
    img.src = dataUrl; 
    img.classList.remove("hidden"); 
  }
  if (sz) { 
    sz.textContent = `已壓縮 ${Math.round(blob.size/1024)}KB`; 
    sz.className = "mt-1 text-[10px] text-neonpink"; 
  }
}
/* 核心：Canvas 壓縮，最大寬 maxW、初始品質 q，逐步降質直到 < targetKB */
function compressImage(file, maxW, quality, targetKB, cb) {
  const reader = new FileReader();
  reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      let q = quality, out = canvas.toDataURL("image/jpeg", q);
      while (out.length / 1024 > targetKB && q > 0.2) { q -= 0.1; out = canvas.toDataURL("image/jpeg", q); }
      cb(out, Math.round(out.length / 1024));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

  const c = color === "pink" ? "border-neonpink text-neonpink glow-pink" : "border-neongreen text-neongreen glow-green";
  const el = document.createElement("div");
  el.className = `animate-pop pointer-events-auto rounded-full border ${c} bg-black px-4 py-2 text-sm font-bold`;
  el.textContent = msg; root.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ============================================================
   10. 雲端讀取（Supabase）- 改為直接載入真實資料
============================================================ */
async function loadCloud() {
  console.log("[v0] 直接從 Supabase 讀取資料...");
  
  try {
    const response = await fetch(`${SUPABASE_URL}/rest/v1/claw_stores?select=*`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
      }
    });
    
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    
    const stores = await response.json();
    console.log(`✅ 成功載入 ${stores.length} 筆資料`);
    
    STORES = stores.map(s => ({
      id: String(s.id),
      name: s.name || "未命名店鋪",
      region: s.region || "旺角",
      addr: s.addr || "（未填地址）",
      ig: s.ig || "",
      fb: s.fb || "",
      verified: s.status === "verified" ? "verified" : "pending",
      size: s.size || "中",
      token: s.token || false,
      hour24: s.hour24 || false,
      staff: s.staff || false,
      dist: (Math.random() * 2 + 0.1).toFixed(1),
      machines: s.machines || []
    }));

    console.log(`✅ 已更新 STORES 陣列，共 ${STORES.length} 家店鋪`);
    
    if (CURRENT === "find") {
      showView("find");
    }
    
  } catch (e) { 
    console.error("[v0] 讀取失敗:", e.message);
    STORES = seedStores();
    if (CURRENT === "find") {
      showView("find");
    }
    toast("無法載入店鋪資料，使用示範店鋪", "pink");
  }
}
