function openStoreFromMap(id) {
  if (mapSelectionMode) {
    var prefix = mapSelectionMode;
    mapSelectionMode = null;
    var store = STORES.find(function(s) { return s.id === id; });
    if (store) {
      if (prefix === 'lp') { openPlayerPostWithStore(prefix, store); }
      else if (prefix === 'lo') { openOwnerPostWithStore(prefix, store); }
    }
    return;
  }
  
  var s = STORES.find(function(x) { return x.id === id; });
  if (!s || !s.lat || !s.lng) return;
  
  if (map) {
    isAutoMoving = true;
    map.closePopup();
    map.panTo([s.lat, s.lng], { duration: 0.3 });
    
    setTimeout(function() {
        var popupContent = document.createElement('div');
        popupContent.style.cssText = 'text-align:left;padding:8px;min-width:220px;';
        
        var distText = '';
        if (userLocation && s.lat && s.lng) {
            var dist = calculateDistance(userLocation.lat, userLocation.lng, s.lat, s.lng);
            distText = dist < 1 ? Math.round(dist * 1000) + 'm' : dist.toFixed(1) + 'km';
        }
        
        var allVotes = window._allFieldVotes || [];
        var storeVotes = allVotes.filter(function(v) { return String(v.store_id) === String(s.id); });
        var staffVotes = storeVotes.filter(function(v) { return v.field_name === 'has_staff'; });
        var coinVotes = storeVotes.filter(function(v) { return v.field_name === 'has_e_coin'; });
        
        function getMainAnswer(votes) {
            if (!votes.length) return null;
            var counts = {};
            votes.forEach(function(v) {
                if (!counts[v.answer]) counts[v.answer] = 0;
                counts[v.answer]++;
            });
            return Object.keys(counts).sort(function(a, b) { return counts[b] - counts[a]; })[0];
        }
        
        var staffAnswer = getMainAnswer(staffVotes);
        var coinAnswer = getMainAnswer(coinVotes);
        
        var tagsHtml = '';
        if (staffAnswer) tagsHtml += '<span style="background:rgba(255,255,255,0.1);border-radius:12px;padding:2px 10px;font-size:10px;color:#fff;margin-right:4px;">' + (staffAnswer === 'true' ? '👤 有場務' : '👤 無場務') + '</span>';
        if (coinAnswer) tagsHtml += '<span style="background:rgba(255,255,255,0.1);border-radius:12px;padding:2px 10px;font-size:10px;color:#fff;">' + (coinAnswer === 'true' ? '💳 有電子兌幣' : '💳 無電子兌幣') + '</span>';
        
        popupContent.innerHTML = 
            '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                '<span style="color:#D4AF37;font-weight:700;font-size:14px;">' + s.name + '</span>' +
                (distText ? '<span style="color:#aaa;font-size:11px;">' + distText + '</span>' : '') +
            '</div>' +
            '<div style="margin-top:4px;display:flex;align-items:center;gap:4px;">' +
                '<span style="color:#aaa;font-size:11px;">' + (s.addr && s.addr !== '' ? s.addr : s.region + '地鋪') + '</span>' +
                (s.lat && s.lng ? '<a href="https://www.google.com/maps?q=' + s.lat + ',' + s.lng + '" target="_blank" style="color:#00FF00;font-size:11px;text-decoration:none;">🗺️</a>' : '') +
            '</div>' +
            (tagsHtml ? '<div style="margin-top:6px;">' + tagsHtml + '</div>' : '') +
            '<a href="javascript:void(0)" data-store-detail="' + String(s.id) + '" style="display:block;margin-top:8px;background:rgba(212,175,55,0.15);border:1px solid rgba(212,175,55,0.3);border-radius:8px;padding:6px;font-size:11px;color:#D4AF37;text-align:center;cursor:pointer;text-decoration:none;">👆 店鋪詳情</a>';
        
        var popup = L.popup({

            closeButton: false, autoPan: false, autoClose: true, closeOnClick: false

        .setLatLng([s.lat, s.lng])

                .setContent(popupContent)
                .openOn(map);

                
            }
        });
        setTimeout(function() { isAutoMoving = false; }, 100);
    }, 350);
  }
}

        }
        if (confirmSection) confirmSection.classList.remove('hidden');

// ============================================================
// GPS 每 2 秒追蹤 (檢舉模式用) - 完整版
// ============================================================
var _verifyReportGpsTimer = null;

function startVerifyReportGpsTracking() {
    stopVerifyReportGpsTracking();
    _finalGpsLat = null;
    _finalGpsLng = null;
    _finalGpsLocked = false;
    
    function tick() {
        var el = document.getElementById('vr-gps');
        if (!el) { stopVerifyReportGpsTracking(); return; }
        
        if (_finalGpsLocked) return;
        
        if (!navigator.geolocation) {
            el.textContent = '⚠️ 此裝置不支援 GPS 定位';
            el.className = 'text-neonpink text-xs';
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                gpsLat = pos.coords.latitude;
                gpsLng = pos.coords.longitude;
                isGpsReady = true;
                
                if (el && !_finalGpsLocked) {
                    el.textContent = '實時更新中：' + gpsLat.toFixed(6) + ', ' + gpsLng.toFixed(6);
                    el.className = 'text-neongreen text-xs';
                }
                updateVerifySubmitButton();
            },
            function(err) {
                isGpsReady = false;
                gpsLat = null;
                gpsLng = null;
                
                if (!_finalGpsLocked) {
                    if (err.code === 1) {
                        // Permission denied — 停止輪詢
                        stopVerifyReportGpsTracking();
                        el.textContent = '🔒 定位權限已被封鎖，請在瀏覽器設定中允許定位權限';
                        el.className = 'text-neonpink text-xs';
                        
                        // 添加重新定位按鈕
                        var existingBtn = document.getElementById('vr-gps-retry');
                        if (existingBtn) existingBtn.remove();
                        var retryBtn = document.createElement('button');
                        retryBtn.id = 'vr-gps-retry';
                        retryBtn.className = 'mt-2 w-full rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all';
                        retryBtn.textContent = '🔄 重新定位';
                        retryBtn.onclick = function() {
                            var btn = document.getElementById('vr-gps-retry');
                            if (btn) btn.remove();
                            startVerifyReportGpsTracking();
                        };
                        el.parentElement.appendChild(retryBtn);
                        
                        updateVerifySubmitButton();
                        return;
                    } else if (err.code === 2) {
                        el.textContent = '📡 GPS 訊號弱，請到室外';
                        el.className = 'text-yellow-400 text-xs';
                    } else if (err.code === 3) {
                        el.textContent = '⏱️ 定位超時';
                        el.className = 'text-yellow-400 text-xs';
                    } else {
                        el.textContent = '⚠️ 定位失敗';
                        el.className = 'text-yellow-400 text-xs';
                    }
                    
                    // 添加重新定位按鈕
                    if (!document.getElementById('vr-gps-retry')) {
                        var retryBtn2 = document.createElement('button');
                        retryBtn2.id = 'vr-gps-retry';
                        retryBtn2.className = 'mt-2 w-full rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all';
                        retryBtn2.textContent = '🔄 重新定位';
                        retryBtn2.onclick = function() {
                            var btn2 = document.getElementById('vr-gps-retry');
                            if (btn2) btn2.remove();
                            startVerifyReportGpsTracking();
                        };
                        el.parentElement.appendChild(retryBtn2);
                    }
                    updateVerifySubmitButton();
                }
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }
    
    tick();
    _verifyReportGpsTimer = setInterval(tick, 2000);
}

function stopVerifyReportGpsTracking() {
    if (_verifyReportGpsTimer) {
        clearInterval(_verifyReportGpsTimer);
        _verifyReportGpsTimer = null;
    }
}

function onVerifyReportCategoryChange(category) {
    _verifyReportCategory = category;
    
    var detailEl = document.getElementById('vr-report-detail');
    var warningEl = document.getElementById('vr-warning');
    
    if (!detailEl || !warningEl) return;
    
    if (!category) {
        detailEl.classList.add('hidden');
        warningEl.classList.add('hidden');
        updateVerifySubmitButton();
        return;
    }
    
    var needsGpsPhoto = (category === 'store_not_exist' || category === 'location_wrong' || category === 'photo_fake');
    var needsInput = (category === 'name_wrong' || category === 'other');
    
    var html = '';
    if (needsGpsPhoto) {
        html += '<div class="mb-3">' +
            '<label class="text-xs font-bold text-gold">📍 GPS 定位 <span class="text-neonpink">（必填）</span></label>' +
            '<div class="mt-1 rounded-xl border border-white/10 bg-zinc-900/50 p-3">' +
                '<span id="vr-gps" class="text-yellow-400 text-xs">⏳ 定位中...</span>' +
            '</div>' +
        '</div>' +
        '<div>' +
            '<label class="text-xs font-bold text-gold">📷 現場照片 <span class="text-neonpink">（必填）</span></label>' +
            '<p class="text-[11px] text-white/50 mt-1 mb-2">請拍下現場情況作為證據：</p>' +
            '<div id="vr-camera-container" class="mt-1 rounded-xl border-2 border-dashed border-white/20 bg-zinc-900 p-3 text-center">' +
                '<button onclick="openCamera(\'vr\')" class="w-full rounded-lg bg-neongreen/90 py-2.5 text-sm font-black text-black">📸 開啟相機拍照</button>' +
                '<img id="vr-preview" class="mt-2 hidden w-full rounded-lg" alt="預覽" />' +
            '</div>' +
        '</div>';
    }
    
    if (needsInput) {
        var placeholder = category === 'name_wrong' ? '請輸入正確的店鋪名稱' : '請描述店鋪的問題';
        html += '<div>' +
            '<label class="text-xs font-bold text-gold">' + (category === 'name_wrong' ? '正確店名' : '問題說明') + ' <span class="text-neonpink">（必填）</span></label>' +
            '<input id="vr-input" placeholder="' + placeholder + '" class="mt-1 w-full rounded-lg border border-gold/40 bg-zinc-900 px-3 py-2.5 text-sm placeholder-zinc-600 focus:outline-none focus:border-gold" />' +
        '</div>';
    }
    
    detailEl.innerHTML = html;
    detailEl.classList.remove('hidden');
    warningEl.classList.remove('hidden');
    
    if (needsGpsPhoto) {
        startVerifyReportGpsTracking();
    } else {
        stopVerifyReportGpsTracking();
    }
    
    updateVerifySubmitButton();
}

function updateVerifySubmitButton() {
    var btn = document.getElementById('vf-submit-btn');
    if (!btn) return;
    
    // ✅ 提交中鎖定按鈕
    if (isSubmittingVerification) {
        btn.disabled = true;
        btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
        btn.innerHTML = '⏳ 提交中...';
        return;
    }
    
    if (_verifyMode === 'confirm') {
        var photoReady = !!(window._camPreview && window._camPreview.vf);
        var gpsReady = !!_finalGpsLocked;
        
        if (!photoReady) {
            btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
            btn.disabled = true;
            btn.innerHTML = '📷 請拍下店鋪全貌';
        } else if (!gpsReady) {
            btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
            btn.disabled = true;
            btn.innerHTML = '📍 GPS 定位鎖定中';
        } else {
            btn.className = 'w-full rounded-2xl bg-neongreen py-3.5 text-base font-black text-black glow-green transition-all hover:scale-[1.02] active:scale-[0.98]';
            btn.disabled = false;
            btn.innerHTML = '✅ 按此提交 (+15 積分)';
        }
    } else {
        // 檢舉模式
        var category = _verifyReportCategory;
        var ready = false;
        
        if (category === 'store_not_exist' || category === 'location_wrong' || category === 'photo_fake') {
            var reportPhotoReady = !!(window._camPreview && window._camPreview.vr);
            var reportGpsReady = !!_finalGpsLocked;
            
            if (!reportPhotoReady) {
                btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
                btn.disabled = true;
                btn.innerHTML = '📷 請拍下現場情況';
            } else if (!reportGpsReady) {
                btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
                btn.disabled = true;
                btn.innerHTML = '📍 GPS 定位鎖定中';
            } else {
                btn.className = 'w-full rounded-2xl bg-neonpink py-3.5 text-base font-black text-black glow-pink transition-all hover:scale-[1.02] active:scale-[0.98]';
                btn.disabled = false;
                btn.innerHTML = '🚨 按此提交檢舉';
            }
        } else if (category === 'name_wrong' || category === 'other') {
            var inputVal = document.getElementById('vr-input')?.value.trim();
            ready = !!inputVal;
            
            if (ready) {
                btn.className = 'w-full rounded-2xl bg-neonpink py-3.5 text-base font-black text-black glow-pink transition-all hover:scale-[1.02] active:scale-[0.98]';
                btn.disabled = false;
                btn.innerHTML = '🚨 按此提交檢舉';
            } else {
                btn.className = 'w-full rounded-2xl bg-white/10 py-3.5 text-base font-black text-white/30 cursor-not-allowed';
                btn.disabled = true;
                btn.innerHTML = '📝 請輸入說明';
            }
        }
    }
}

// ============================================================
// GPS 每 2 秒追蹤 (店鋪實證用) - 修正版
// ============================================================
var _verifyGpsTimer = null;
var _verifyGpsRetryBtnShown = false;

function startVerifyGpsTracking() {
    stopVerifyGpsTracking();
    _finalGpsLat = null;
    _finalGpsLng = null;
    _finalGpsLocked = false;
    _verifyGpsRetryBtnShown = false;
    
    function tick() {
        var el = document.getElementById('vf-gps');
        if (!el) { stopVerifyGpsTracking(); return; }
        
        if (_finalGpsLocked) return;
        
        if (!navigator.geolocation) {
            _vfGpsReady = false;
            _vfGpsLat = null;
            _vfGpsLng = null;
            showVerifyGpsUnavailable(el, '⚠️ 此裝置不支援 GPS 定位');
            return;
        }
        
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                _vfGpsLat = pos.coords.latitude;
                _vfGpsLng = pos.coords.longitude;
                _vfGpsReady = true;
                
                // 成功獲取 GPS，移除重新定位按鈕
                removeVerifyGpsRetryButton(el);
                _verifyGpsRetryBtnShown = false;
                
                if (el && !_finalGpsLocked) {
                    el.textContent = '實時更新中：' + _vfGpsLat.toFixed(6) + ', ' + _vfGpsLng.toFixed(6);
                    el.className = 'text-neongreen text-xs';
                }
                updateVerifySubmitButton();
            },
            function(err) {
                _vfGpsReady = false;
                _vfGpsLat = null;
                _vfGpsLng = null;
                
                if (!_finalGpsLocked) {
                    if (err.code === 1) {
                        // ✅ Permission denied — 停止輪詢
                        stopVerifyGpsTracking();
                        showVerifyGpsPermissionBlocked(el);
                        updateVerifySubmitButton();
                        return;
                    } else if (err.code === 2) {
                        showVerifyGpsRetryButton(el, '📡 GPS 訊號弱，請到室外');
                    } else if (err.code === 3) {
                        showVerifyGpsRetryButton(el, '⏱️ 定位超時');
                    } else {
                        showVerifyGpsRetryButton(el, '⚠️ 定位失敗');
                    }
                    updateVerifySubmitButton();
                }
            },
            { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
    }
    
    tick();
    _verifyGpsTimer = setInterval(tick, 2000);
}

function stopVerifyGpsTracking() {
    if (_verifyGpsTimer) {
        clearInterval(_verifyGpsTimer);
        _verifyGpsTimer = null;
    }
}

// 顯示 GPS 權限被封鎖 (實證)
function showVerifyGpsPermissionBlocked(el) {
    if (!el) return;
    el.textContent = '🔒 定位權限已被封鎖，請在瀏覽器設定中允許定位權限';
    el.className = 'text-neonpink text-xs';
    
    removeVerifyGpsRetryButton(el);
    var retryBtn = document.createElement('button');
    retryBtn.id = 'vf-gps-retry';
    retryBtn.className = 'mt-2 w-full rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all';
    retryBtn.textContent = '🔄 重新定位';
    retryBtn.onclick = function() {
        removeVerifyGpsRetryButton(el);
        startVerifyGpsTracking();
    };
    el.parentElement.appendChild(retryBtn);
}

// 顯示 GPS 重新定位按鈕 (實證)
function showVerifyGpsRetryButton(el, message) {
    if (!el) return;
    el.textContent = message;
    el.className = 'text-yellow-400 text-xs';
    
    if (!document.getElementById('vf-gps-retry')) {
        var retryBtn = document.createElement('button');
        retryBtn.id = 'vf-gps-retry';
        retryBtn.className = 'mt-2 w-full rounded-lg border border-gold/40 py-2 text-sm text-gold hover:bg-gold/10 transition-all';
        retryBtn.textContent = '🔄 重新定位';
        retryBtn.onclick = function() {
            removeVerifyGpsRetryButton(el);
            startVerifyGpsTracking();
        };
        el.parentElement.appendChild(retryBtn);
    }
}

// 顯示 GPS 不可用 (實證)
function showVerifyGpsUnavailable(el, message) {
    if (!el) return;
    el.textContent = message;
    el.className = 'text-neonpink text-xs';
}

// 移除重新定位按鈕 (實證)
function removeVerifyGpsRetryButton(el) {
    var existingBtn = document.getElementById('vf-gps-retry');
    if (existingBtn) existingBtn.remove();
}


function grabVerifyGPS() {
  var el = document.getElementById('vf-gps');
  if (!el) return;
  el.textContent = '定位中，請確認已開啟 GPS...';
  el.className = 'text-yellow-400 text-xs';
  _vfGpsReady = false;
  var retryBtn = document.getElementById('vf-gps-retry');
  if (retryBtn) retryBtn.classList.add('hidden');
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(pos) {
      _vfGpsLat = pos.coords.latitude;
      _vfGpsLng = pos.coords.longitude;
      _vfGpsReady = true;
      el.textContent = '📍 定位成功：' + _vfGpsLat.toFixed(2) + ', ' + _vfGpsLng.toFixed(2) + ' (精度 ±' + Math.round(pos.coords.accuracy) + 'm)';
      el.className = 'text-neongreen text-xs';
      var submitBtn = document.getElementById('vf-submit-btn');
      if (submitBtn) submitBtn.dispatchEvent(new Event('change'));

    var distanceMeters = Math.round(distance * 1000);

    if (distance > limitKm) {

        valid: true,
        distance: distanceMeters,

    };
}

// 店鋪頁面顯示投票結果
function getFieldVoteDisplay(storeId, fieldName, contributions) {
    // contributions: 該店鋪的投票陣列（從 loadCloud 或 API 取得）
    var votes = contributions.filter(function(c) { return c.field_name === fieldName; });
    
    if (votes.length === 0) return null;
    
    var answerCounts = {};
    votes.forEach(function(v) {
        if (!answerCounts[v.answer]) answerCounts[v.answer] = 0;
        answerCounts[v.answer]++;
    });
    
    var sorted = Object.keys(answerCounts).sort(function(a, b) { return answerCounts[b] - answerCounts[a]; });
    var mainAnswer = sorted[0];
    var mainCount = answerCounts[mainAnswer];
    
    if (votes.length === 1) {
        return { mainAnswer: mainAnswer, mainCount: 0, display: 'single' };
    }
    
    // 計算最近 30 天異議
    var thirtyDaysAgo = new Date();
    thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
    var recentVotes = votes.filter(function(v) { return new Date(v.voted_at) >= thirtyDaysAgo; });
    var recentDissent = recentVotes.filter(function(v) { return v.answer !== mainAnswer; });
    
    if (recentDissent.length > 0) {
        return { mainAnswer: mainAnswer, mainCount: mainCount, dissentCount: recentDissent.length, display: 'dissent' };
    }
    
    return { mainAnswer: mainAnswer, mainCount: mainCount, display: 'majority' };
}

// 計算地區稱號
// ============================================================
function calculateRegionTitle(regionGroup, contributions) {
    // contributions: [{ action_type, contribution_value }]
    
    var totalValue = 0;
    var actionTotals = {};
    
    contributions.forEach(function(c) {
        totalValue += c.contribution_value || 0;
        if (!actionTotals[c.action_type]) actionTotals[c.action_type] = 0;
        actionTotals[c.action_type] += c.contribution_value || 0;
    });
    
    // 找出最高佔比的路線
    var bestRoute = null;
    var bestValue = 0;
    
    Object.keys(TITLE_DEFS).forEach(function(routeKey) {
        var route = TITLE_DEFS[routeKey];
        var routeValue = 0;
        route.actions.forEach(function(action) {
            routeValue += actionTotals[action] || 0;
        });
        if (routeValue > bestValue) {
            bestValue = routeValue;
            bestRoute = route;
        }
    });
    
    if (!bestRoute || totalValue === 0) {
        return { title: '旅人', route: null, level: 0, totalValue: 0 };
    }
    
    // 判斷等級
    var level = 1;
    for (var i = bestRoute.levels.length - 1; i >= 0; i--) {
        if (totalValue >= bestRoute.levels[i].threshold) {
            level = bestRoute.levels[i].level;
            break;
        }
    }
    
    var levelInfo = bestRoute.levels.find(function(l) { return l.level === level; });
    
    return {
        title: levelInfo.title,
        route: bestRoute,
        level: level,
        totalValue: totalValue
    };
}

// ============================================================
// 計算全港總稱號
// ============================================================
function calculateGlobalTitle(allContributions) {
    // 計算三區各自的等級
    var regionLevels = {};
    for (var key in REGION_KEYS) {
        var regionContributions = allContributions.filter(function(c) { return c.region_group === key; });
        var title = calculateRegionTitle(key, regionContributions);
        regionLevels[key] = title.level;
    }
    
    // 三區中最低等級
    var minLevel = Math.min(regionLevels['hk'] || 0, regionLevels['kl'] || 0, regionLevels['nt'] || 0);
    
    // 全港稱號表
    var GLOBAL_TITLES = [
        { level: 0, title: null },
        { level: 1, title: null },
        { level: 2, title: '全港探索者' },
        { level: 3, title: '全港制霸' },
        { level: 4, title: '香港傳說' },
        { level: 5, title: '爪皇降臨' }
    ];
    
    var globalTitle = GLOBAL_TITLES[minLevel] || GLOBAL_TITLES[0];
    
    return {
        title: globalTitle.title || '',
        level: minLevel,
        totalValue: allContributions.reduce(function(sum, c) { return sum + (c.contribution_value || 0); }, 0)
    };
}

// 計算兩點距離（米）
function calculateGpsDistance(lat1, lng1, lat2, lng2) {
    var R = 6371000;
    var dLat = (lat2 - lat1) * Math.PI / 180;
    var dLng = (lng2 - lng1) * Math.PI / 180;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + 
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
            Math.sin(dLng / 2) * Math.sin(dLng / 2);
    var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    return R * c;
}

// AI 核對兩張照片 + GPS
async function aiCompareStorePhotos(photo1Url, gps1, photo2Url, gps2) {
    try {
        var apiKey = await getOpenRouterApiKey();
        if (!apiKey) {
            console.warn('⚠️ 無法取得 OpenRouter API Key');
            return null;
        }
        
        var gpsDistance = Math.round(calculateGpsDistance(gps1.lat, gps1.lng, gps2.lat, gps2.lng));
        
        var prompt = '比較兩張照片是否同一店鋪門面。照片1 GPS：' + gps1.lat + ', ' + gps1.lng + '；照片2 GPS：' + gps2.lat + ', ' + gps2.lng + '；GPS 距離 ' + gpsDistance + ' 米（需小於50米）。只回傳 JSON：{"is_same_store": true 或 false, "confidence_score": 0.0到1.0}';
        
        var response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Authorization': 'Bearer ' + apiKey,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                model: AI_MODEL,
                max_tokens: 2000,
                messages: [
                    {
                        role: 'user',
                        content: [
                            { type: 'text', text: prompt },
                            { type: 'image_url', image_url: { url: photo1Url, detail: 'low' } },
                            { type: 'image_url', image_url: { url: photo2Url, detail: 'low' } }
                        ]
                    }
                ]
            })
        });
        
        if (!response.ok) {
            var errorText = await response.text();
            console.warn('⚠️ AI 核對失敗:', response.status, errorText);
            return null;
        }
        
        var data = await response.json();
        var content = data.choices[0].message.content;
        
        if (!content) {
            console.warn('⚠️ AI 回傳內容為空');
            return null;
        }
        
        var cleanContent = content.replace(/```json\n?/g, '').replace(/```/g, '').trim();
        
        try {
            return JSON.parse(cleanContent);
        } catch (e) {
            var startIdx = cleanContent.indexOf('{');
            var endIdx = cleanContent.lastIndexOf('}');
            if (startIdx !== -1 && endIdx !== -1 && endIdx > startIdx) {
                var jsonStr = cleanContent.slice(startIdx, endIdx + 1);
                try {
                    return JSON.parse(jsonStr);
                } catch (e2) {
                    return null;
                }
            }
            return null;
        }
    } catch (e) {
        console.warn('⚠️ AI 核對失敗:', e.message);
        return null;
    }
}

                    if (reviewResult === 'already_complete') {
                        // 已認證完畢，同步 claw_stores
                        var syncResult = await supabaseClientInstance
                            .from('verification_reviews')
                            .select('verifier_1_device, verifier_1_name, verifier_2_device, verifier_2_name')
                            .eq('store_id', stringStoreId)
                            .single();
                        
                        if (!syncResult.error && syncResult.data) {
                            await supabaseClientInstance
                                .from('claw_stores')
                                .update({
                                    status: 'verified',
                                    is_verified: true,
                                    first_verifier_device: syncResult.data.verifier_1_device,
                                    first_verifier_name: syncResult.data.verifier_1_name,
                                    second_verifier_device: syncResult.data.verifier_2_device,
                                    second_verifier_name: syncResult.data.verifier_2_name
                                })
                                .eq('id', numericStoreId);
                        }
                        
                        toast('此店鋪已認證完畢', 'gold');
                        enableSubmitButton(submitBtn, '✅ 提交實證（+20 積分）');
                        return;
                    }
                    if (reviewResult === 'already_verified') {
                        toast('你已經實證過這間店鋪了', 'gold');
                        enableSubmitButton(submitBtn, '✅ 提交實證（+20 積分）');
                        return;
                    }
                } catch (e) {
                    console.warn('⚠️ verification_reviews 寫入失敗:', e.message);
                    toast('⚠️ 實證記錄失敗，請稍後重試', 'pink');
                    enableSubmitButton(submitBtn, '✅ 提交實證（+20 積分）');
                    return;
                }
            }
            
            // 2. 寫 store_verifications
            if (CLOUD_ON) {
                try {
                    var insertVerificationResult = await supabaseClientInstance
                        .from('store_verifications')
                        .insert(verification);
                    if (insertVerificationResult.error) throw insertVerificationResult.error;
                } catch (e) {
                    console.warn('⚠️ store_verifications 寫入失敗:', e.message);
                }
            }
            
            // 3. 更新 claw_stores
            if (CLOUD_ON) {
                try {
                    var updateData = {};
                    
                    if (reviewResult === 'verifier_1') {
                        updateData = {
                            verification_count: 1,
                            verification_count_2: 0,
                            status: 'pending',
                            is_verified: false,
                            first_verifier_device: verification.verifier_device,
                            first_verifier_name: STATE.user.name || STATE.user.display_name || '',
                            first_verified_at: new Date().toISOString()
                        };
                    } else if (reviewResult === 'verifier_2') {
                        updateData = {
                            verification_count_2: 1,
                            second_verifier_device: verification.verifier_device,
                            second_verifier_name: STATE.user.name || STATE.user.display_name || '',
                            second_verified_at: new Date().toISOString()
                        };
                    }
                    
                    console.log('🕵️ updateData:', JSON.stringify(updateData));
                    
                    if (Object.keys(updateData).length > 0) {
                        var updateStoreResult = await supabaseClientInstance
                            .from('claw_stores')
                            .update(updateData)
                            .eq('id', numericStoreId);
                        
                        if (updateStoreResult.error) throw updateStoreResult.error;
                        console.log('✅ claw_stores 已更新:', JSON.stringify(updateData));
                    }
                } catch (e) {
                    console.warn('⚠️ claw_stores 更新失敗:', e.message);
                }
            }
            
            // 4. 觸發 AI 核對
            if (reviewResult === 'verifier_1' || reviewResult === 'verifier_2') {
                var firstSubmitterPhoto = s.photo || '';
                var firstSubmitterGps = { lat: s.lat || 0, lng: s.lng || 0 };
                
                var reviewData = null;
                try {
                    var reviewResult2 = await supabaseClientInstance
                        .from('verification_reviews')
                        .select('verifier_1_photo, verifier_1_gps, verifier_2_photo, verifier_2_gps')
                        .eq('store_id', stringStoreId)
                        .single();
                    if (!reviewResult2.error && reviewResult2.data) {
                        reviewData = reviewResult2.data;
                    }
                } catch (e) {
                    console.warn('⚠️ 讀取認證者資料失敗:', e.message);
                }
                
                if (reviewData) {
                    var aiResults = await runAiVerificationCheck(
                        storeId,
                        firstSubmitterPhoto, firstSubmitterGps,
                        reviewData.verifier_1_photo || '', reviewData.verifier_1_gps || { lat: 0, lng: 0 },
                        reviewData.verifier_2_photo || '', reviewData.verifier_2_gps || { lat: 0, lng: 0 }
                    );
                    
                    var aiCheckResult = 'unchecked';
                    var aiGroup1Result = null;
                    var aiGroup2Result = null;
                    
                    if (aiResults && aiResults.group1 && aiResults.group2) {
                        aiGroup1Result = aiResults.group1.is_same_store === true;
                        aiGroup2Result = aiResults.group2.is_same_store === true;
                        
                        if (aiGroup1Result && aiGroup2Result) {
                            aiCheckResult = 'passed';
                        } else {
                            aiCheckResult = 'failed';
                        }
                    }
                    
                    // 寫入 AI 結果
                    try {
                        await supabaseClientInstance
                            .from('verification_reviews')
                            .update({
                                ai_check_group1: aiGroup1Result,
                                ai_check_group2: aiGroup2Result,
                                ai_check_result: aiCheckResult,
                                ai_checked_at: new Date().toISOString()
                            })
                            .eq('store_id', stringStoreId);
                        console.log('✅ AI 核對結果已寫入:', aiCheckResult);
                    } catch (e) {
                        console.warn('⚠️ 寫入 AI 核對結果失敗:', e.message);
                    }
                    
                    // 根據結果處理
                    if (reviewResult === 'verifier_1') {
                        // 搶先認證
                        if (aiCheckResult === 'passed') {
                            await supabaseClientInstance
                                .from('claw_stores')
                                .update({
                                    status: 'verified',
                                    is_verified: true
                                })
                                .eq('id', numericStoreId);
                            
                            console.log('✅ AI 核對通過，自動認證成功');
                            toast('🎉 搶先認證成功！+20 分', 'green');
                            
                            // 首發者追加 +30
                            await supabaseClientInstance
                                .from('claw_stores')
                                .update({ submitter_reward_claimed: false })
                                .eq('id', numericStoreId);
                            
                            updateAchievementStat('store_complete');
                            var regionStat = getRegionStat(s.region);
                            if (regionStat) updateAchievementStat(regionStat);
                            
                        } else if (aiCheckResult === 'failed') {
                            console.log('⚠️ AI 核對未通過，等待管理員審核');
                            toast('📤 已提交，等待管理員審核', 'gold');
                        } else {
                            console.log('⚠️ AI 核對服務不可用');
                            toast('📤 已提交，等待管理員審核', 'gold');
                        }
                        
                    } else if (reviewResult === 'verifier_2') {
                        // 追加認證：不影響主認證狀態
                        if (aiCheckResult === 'passed') {
                            toast('🎉 追加認證成功！+10 分', 'green');
                        } else if (aiCheckResult === 'failed') {
                            toast('📤 已提交，等待管理員審核', 'gold');
                        } else {
                            toast('📤 已提交，等待管理員審核', 'gold');
                        }
                    }
                }
            }
            
            // 5. 更新本地
            STATE.verifications = STATE.verifications || {};
            STATE.verifications[s.id] = true;
            save();
            
            // 6. 重新載入
            if (CLOUD_ON) {
                try {
                    await loadCloud();
                } catch (e) {
                    console.warn('⚠️ 重新載入失敗:', e.message);
                }
            }
            
            // 7. 加分
            if (reviewResult === 'verifier_1') {
                await addPoints(20, '搶先認證');
            } else if (reviewResult === 'verifier_2') {
                await addPoints(10, '追加認證');
            }
            
            await recordTaskCompletion('verify_store');
            updateStreak();
            await recordRegionContribution('verify_store', s.region, storeId);
            
            closeModal();
            if (CURRENT === 'map') {
                updateMapMarkers();
                updateMapList();
            }
            
        } else {
            // ========== 店鋪有問題模式（檢舉） ==========
            var category = _verifyReportCategory;
            if (!category) {
                toast('請選擇問題類型', 'pink');
                enableSubmitButton(submitBtn, '🚨 提交檢舉');
                return;
            }
            
            var reportData = {
                target_type: 'store',
                target_id: storeId,
                reporter_device: STATE.user.device,
                reporter_user_id: STATE.user.user_id || null,
                category: category,
                reason: '',
                status: 'pending',
                created_at: new Date().toISOString()
            };
            
            var needsGpsPhoto = (category === 'store_not_exist' || category === 'location_wrong' || category === 'photo_fake');
            var needsInput = (category === 'name_wrong' || category === 'other');
            
            if (needsGpsPhoto) {
                var reportPhotoBlob = window._cam?.vr;
                if (!reportPhotoBlob) {
                    toast('請先拍攝現場照片', 'pink');
                    enableSubmitButton(submitBtn, '🚨 提交檢舉');
                    return;
                }
                
                if (!_finalGpsLocked || !_finalGpsLat || !_finalGpsLng) {
                    toast('請先拍照以鎖定 GPS 位置', 'pink');
                    enableSubmitButton(submitBtn, '🚨 提交檢舉');
                    return;
                }
                
                var reportPhotoUrl = window._camPreview?.vr || '';
                if (CLOUD_ON) {
                    try {
                        var reportFile = new File([reportPhotoBlob], "report_" + Date.now() + ".jpg", { type: 'image/jpeg' });
                        reportPhotoUrl = await uploadImage(reportFile, 'reports');
                    } catch (e) {
                        toast('圖片上傳失敗', 'pink');
                        enableSubmitButton(submitBtn, '🚨 提交檢舉');
                        return;
                    }
                }
                
                reportData.photo_url = reportPhotoUrl;
                reportData.gps_lat = _finalGpsLat;
                reportData.gps_lng = _finalGpsLng;
            }
            
            if (needsInput) {
                var inputVal = document.getElementById('vr-input')?.value.trim();
                if (!inputVal) {
                    toast(category === 'name_wrong' ? '請輸入正確店名' : '請描述問題', 'pink');
                    enableSubmitButton(submitBtn, '🚨 提交檢舉');
                    return;
                }
                reportData.reason = inputVal;
            }
            
            if (CLOUD_ON) {
                try {
                    await supabaseClientInstance
                        .from('reports')
                        .insert(reportData);
                } catch (e) {
                    console.warn('⚠️ 檢舉寫入失敗:', e.message);
                }
            }
            
            toast('✅ 檢舉已提交', 'green');
            closeModal();
        }
    } finally {
        isSubmittingVerification = false;
        releaseSubmitLock('submitVerification');
    }
}

// 創建/更新 verification_reviews (修正版 - 回傳認證者位置)
// ============================================================
async function upsertVerificationReview(storeId, verification) {
    if (!CLOUD_ON) return 'local_only';
    
    try {
        var stringStoreId = String(storeId);
        
        // 使用 SDK 查詢
        var checkResult = await supabaseClientInstance
            .from('verification_reviews')
            .select('*')
            .eq('store_id', stringStoreId)
            .order('created_at', { ascending: false })
            .limit(1);
        
        if (checkResult.error) throw checkResult.error;
        
        var existingReviews = checkResult.data || [];
        
        if (existingReviews && existingReviews.length > 0) {
            var review = existingReviews[0];
            
            if (review.verifier_2_device) {
                return 'already_complete';
            }
            
            if (review.verifier_1_device === verification.verifier_device) {
                return 'already_verified';
            }
            
            var updateData = {
                verifier_2_device: verification.verifier_device,
                verifier_2_name: STATE.user.name || STATE.user.display_name || '',
                verifier_2_photo: verification.photo_url,
                verifier_2_gps: { lat: verification.lat, lng: verification.lng },
                admin_status: 'pending',
                updated_at: new Date().toISOString()
            };
            
            var updateResult = await supabaseClientInstance
                .from('verification_reviews')
                .update(updateData)
                .eq('id', review.id);
            
            if (updateResult.error) throw updateResult.error;
            
            console.log('✅ verification_reviews 已更新（第二位認證者）');
            return 'verifier_2';
        } else {
            // 查詢首發者資料
            var storeResult = await supabaseClientInstance
                .from('claw_stores')
                .select('submitted_by_device, photo, lat, lng')
                .eq('id', parseInt(storeId))
                .single();
            
            var firstSubmitterDevice = '';
            var firstSubmitterPhoto = '';
            var firstSubmitterGps = { lat: null, lng: null };
            
            if (!storeResult.error && storeResult.data) {
                firstSubmitterDevice = storeResult.data.submitted_by_device || '';
                firstSubmitterPhoto = storeResult.data.photo || '';
                if (storeResult.data.lat && storeResult.data.lng) {
                    firstSubmitterGps = { lat: storeResult.data.lat, lng: storeResult.data.lng };
                }
            }
            
            var newReview = {
                store_id: stringStoreId,
                first_submitter_device: firstSubmitterDevice,
                first_submitter_name: '',
                first_submitter_photo: firstSubmitterPhoto,
                first_submitter_gps: firstSubmitterGps,
                verifier_1_device: verification.verifier_device,
                verifier_1_name: STATE.user.name || STATE.user.display_name || '',
                verifier_1_photo: verification.photo_url,
                verifier_1_gps: { lat: verification.lat, lng: verification.lng },
                admin_status: 'pending',
                created_at: new Date().toISOString(),
                updated_at: new Date().toISOString()
            };
            
            var insertResult = await supabaseClientInstance
                .from('verification_reviews')
                .insert(newReview);
            
            if (insertResult.error) throw insertResult.error;
            
            console.log('✅ verification_reviews 已創建（第一位認證者）');
            return 'verifier_1';
        }
    } catch (e) {
        console.warn('⚠️ verification_reviews 同步失敗:', e.message);
        throw e;
    }
}

// 街道 AutoComplete
var _supplementStreetTimer = null;

function onSupplementStreetInput(value) {
  window._supplementStreet = value.trim();
  
  clearTimeout(_supplementStreetTimer);
  _supplementStreetTimer = setTimeout(function() {
    autocompleteSupplementStreet(window._supplementStreet);
  }, 500);
}

async function autocompleteSupplementStreet(query) {
  var container = document.getElementById('supplement-street-suggestions');
  if (!container) return;
  
  if (!query || query.length < 1) {
    container.classList.add('hidden');
    return;
  }
  
  try {
    var alsUrl = 'https://www.als.gov.hk/lookup?q=' + encodeURIComponent('香港 ' + (window._supplementDistrict ? window._supplementDistrict + ' ' : '') + query);
    var alsRes = await fetch(alsUrl, { headers: { 'Accept': 'application/json' } });
    var alsData = await alsRes.json();
    
    var streets = [];
    if (alsData.SuggestedAddress && alsData.SuggestedAddress.length > 0) {
      for (var i = 0; i < alsData.SuggestedAddress.length; i++) {
        var chiStreet = alsData.SuggestedAddress[i].Address.PremisesAddress.ChiPremisesAddress;
        if (chiStreet && chiStreet.ChiStreet && chiStreet.ChiStreet.StreetName) {
          var streetName = chiStreet.ChiStreet.StreetName;
          if (streets.indexOf(streetName) === -1) {
            streets.push(streetName);
          }
        }
      }
    }
    
    if (streets.length > 0) {
      container.innerHTML = streets.map(function(st) {
        return '<button onclick="selectSupplementStreet(\'' + st.replace(/'/g, "\\'") + '\')" class="block w-full text-left px-3 py-2 hover:bg-gold/20 text-sm text-white/80 border-b border-white/10 last:border-0">' + st + '</button>';
      }).join('');
      container.classList.remove('hidden');
    } else {
      container.classList.add('hidden');
    }
  } catch (e) {
    container.classList.add('hidden');
  }
}

}

  var submitBtn = disableSubmitButton('supplement-submit-btn', '⏳ 驗證中...');

    var s = STORES.find(function(x) { return x.id === storeId; });
    if (!s) { toast('找不到該店鋪', 'pink'); return; }
    
    var district = window._supplementDistrict;

      toast('請選擇地區', 'pink');

    }
    if (!street) {
      toast('請輸入街道', 'pink');
      enableSubmitButton(submitBtn, '🔍 提交驗證地址');
      return;
    }
    if (!buildingNo) {
      toast('請輸入街號', 'pink');
      enableSubmitButton(submitBtn, '🔍 提交驗證地址');
      return;
    }
    
    // 組合查詢
    var fullAddress = street + ' ' + buildingNo;
    var query = '香港 ' + district + ' ' + fullAddress;
    
    // 呼叫 ALS
    var alsUrl = 'https://www.als.gov.hk/lookup?q=' + encodeURIComponent(query);
    var alsRes = await fetch(alsUrl, { headers: { 'Accept': 'application/json' } });
    var alsData = await alsRes.json();
    
    var geocodedLat = null;
    var geocodedLng = null;
    
    if (alsData.SuggestedAddress && alsData.SuggestedAddress.length > 0) {
      var firstResult = alsData.SuggestedAddress[0];
      var geo = firstResult.Address.PremisesAddress.GeospatialInformation;
      geocodedLat = parseFloat(geo.Latitude);
      geocodedLng = parseFloat(geo.Longitude);
    }
    
    var distanceMeters = null;
    
    if (geocodedLat && geocodedLng && s.lat && s.lng) {
      var distance = calculateDistance(s.lat, s.lng, geocodedLat, geocodedLng);
      distanceMeters = Math.round(distance * 1000);
    }
    
    // 情況 A：距離 < 100 米
    if (distanceMeters !== null && distanceMeters < 100) {
      s.addr = district + ' ' + fullAddress;
      
      if (CLOUD_ON) {
        await supabaseClientInstance
          .from('claw_stores')
          .update({ addr: district + ' ' + fullAddress })
          .eq('id', parseInt(storeId));
      }
      
      save();
      await addPoints(15, '補充地址');
      await recordTaskCompletion('supplement');
      await recordRegionContribution('supplement', s.region, storeId);
       if (CURRENT === 'map') {
        updateMapList();
        updateMapMarkers();
      }
      toast('✅ 地址驗證通過！+15 分', 'green');
      closeModal();
      setTimeout(function() { openStore(storeId); }, 300);
      return;
    }
    
    // 情況 B 和 C：都即時寫入 + 提交審核
    s.addr = district + ' ' + fullAddress;
    
    if (CLOUD_ON) {
      await supabaseClientInstance
        .from('claw_stores')
        .update({ addr: district + ' ' + fullAddress })
        .eq('id', parseInt(storeId));
    }
    
    save();
    
    // 提交管理員審核
    if (CLOUD_ON) {
      await supabaseClientInstance
        .from('address_submissions')
        .insert({
          store_id: String(storeId),
          submitted_address: fullAddress,
          submitted_by: STATE.user.device,
          user_id: STATE.user.user_id || null,
          geocoded_lat: geocodedLat,
          geocoded_lng: geocodedLng,
          store_lat: s.lat || null,
          store_lng: s.lng || null,
          distance_meters: distanceMeters,
          status: 'pending',
          created_at: new Date().toISOString()
        });
    }
        // ✅ 刷新地圖列表
    if (CURRENT === 'map') {
      updateMapList();
      updateMapMarkers();
    }
    toast('📤 已提交成功！管理員審核通過後即可獲得 15 積分', 'gold');
    closeModal();
    
  } catch (e) {
    console.warn('補充地址失敗:', e.message);
    toast('提交失敗: ' + e.message, 'pink');
    enableSubmitButton(submitBtn, '🔍 提交驗證地址');
  } finally {
    releaseSubmitLock('submitSupplementAddress');
  }
}

// 驗證補充地址（使用 Nominatim）
// 驗證補充地址（使用香港政府 ALS API）
async function verifySupplementAddress(storeId) {
    var s = STORES.find(function(x) { return x.id === storeId; });
    if (!s) { toast('找不到該店鋪', 'pink'); return; }
    
    var address = document.getElementById('sa-address')?.value.trim();
    if (!address) {
        toast('請輸入地址', 'pink');
        return;
    }
    
    var verifyBtn = document.getElementById('sa-verify-btn');
    if (verifyBtn) {
        verifyBtn.disabled = true;
        verifyBtn.textContent = '⏳ 驗證中...';
    }
    
    try {
        // ✅ 使用香港政府 ALS API（不需 API Key，精確到門牌）
        var geocodeUrl = 'https://www.als.gov.hk/lookup?q=' + encodeURIComponent('香港 ' + address);
        
        var geocodeRes = await fetch(geocodeUrl, {
            headers: { 'Accept': 'application/json' }
        });
        
        if (!geocodeRes.ok) {
            throw new Error('HTTP ' + geocodeRes.status);
        }
        
        var geocodeData = await geocodeRes.json();
        
        var resultHtml = '';
        
        if (geocodeData.SuggestedAddress && geocodeData.SuggestedAddress.length > 0) {
            var firstResult = geocodeData.SuggestedAddress[0];
            var premises = firstResult.Address.PremisesAddress;
            var geo = premises.GeospatialInformation;
            var geocodedLat = parseFloat(geo.Latitude);
            var geocodedLng = parseFloat(geo.Longitude);
            
            // 取得匹配分數
            var score = firstResult.ValidationInformation ? firstResult.ValidationInformation.Score : 0;
            
            // 取得建築物名稱（如有）
            var buildingName = '';
            if (premises.ChiPremisesAddress && premises.ChiPremisesAddress.BuildingName) {
                buildingName = premises.ChiPremisesAddress.BuildingName;
            }
            
            // 與店鋪 GPS 對比
            var distanceMeters = null;
            var isVerified = false;
            
            if (s.lat && s.lng) {
                var distance = calculateDistance(s.lat, s.lng, geocodedLat, geocodedLng);
                distanceMeters = Math.round(distance * 1000);
                isVerified = distanceMeters <= 100 && score >= 60;
            }
            
            if (isVerified) {
                // 驗證通過
                resultHtml = `
                    <div class="rounded-xl border border-neongreen/40 bg-neongreen/10 p-3">
                        <p class="text-sm font-bold text-neongreen">✅ 地址驗證通過！</p>
                        <p class="text-xs text-white/60 mt-1">📍 距離店鋪 ${distanceMeters} 米</p>
                        ${buildingName ? '<p class="text-xs text-white/40 mt-1">🏢 ' + buildingName + '</p>' : ''}
                        ${score ? '<p class="text-xs text-white/40 mt-1">🎯 匹配度：' + score.toFixed(0) + '%</p>' : ''}
                    </div>
                `;
                
                if (verifyBtn) {
                    verifyBtn.textContent = '✅ 提交地址（+15 積分）';
                    verifyBtn.disabled = false;
                    verifyBtn.onclick = function() { submitVerifiedAddress(storeId, address, geocodedLat, geocodedLng, distanceMeters); };
                }
            } else {
                // 驗證失敗
                var failReason = '';
                if (distanceMeters !== null && distanceMeters > 100) {
                    failReason = '📍 距離店鋪 ' + distanceMeters + ' 米（需在 100 米內）';
                } else if (score < 60) {
                    failReason = '🎯 匹配度過低：' + score.toFixed(0) + '%';
                } else {
                    failReason = '📍 距離店鋪未知';
                }
                
                resultHtml = `
                    <div class="rounded-xl border border-yellow-400/40 bg-yellow-400/10 p-3">
                        <p class="text-sm font-bold text-yellow-400">⚠️ 地址驗證失敗</p>
                        <p class="text-xs text-white/60 mt-1">${failReason}</p>
                        <p class="text-xs text-white/40 mt-1">將提交管理員審核，通過後可獲得積分</p>
                    </div>
                `;
                
                if (verifyBtn) {
                    verifyBtn.textContent = '📤 提交管理員審核';
                    verifyBtn.disabled = false;
                    verifyBtn.onclick = function() { submitAddressForReview(storeId, address, geocodedLat, geocodedLng, distanceMeters); };
                }
            }
        } else {
            // 找不到地址
            resultHtml = `
                <div class="rounded-xl border border-neonpink/40 bg-neonpink/10 p-3">
                    <p class="text-sm font-bold text-neonpink">❌ 找不到此地址</p>
                    <p class="text-xs text-white/60 mt-1">請確認地址是否正確，或嘗試更詳細的地址</p>
                    <p class="text-xs text-white/40 mt-1">格式範例：西洋菜南街 2A</p>
                </div>
            `;
            
            if (verifyBtn) {
                verifyBtn.disabled = false;
                verifyBtn.textContent = '🔍 重新驗證';
                verifyBtn.onclick = function() { verifySupplementAddress(storeId); };
            }
        }
        
        var resultContainer = document.getElementById('sa-verify-result');
        if (resultContainer) {
            resultContainer.innerHTML = resultHtml;
            resultContainer.classList.remove('hidden');
        }
        
    } catch (e) {
        console.warn('⚠️ 地址查詢失敗:', e.message);
        toast('地址驗證失敗，請稍後重試', 'pink');
        
        if (verifyBtn) {
            verifyBtn.disabled = false;
            verifyBtn.textContent = '🔍 重新驗證';
            verifyBtn.onclick = function() { verifySupplementAddress(storeId); };
        }
    }
}

          ) +

        (reactionHtml ? '<div class="mt-1">' + reactionHtml + '</div>' : '') +
        interactionHtml +
      '</div>';
      
      // ✅ 每 5 篇插入廣告卡
      if (postIndex % 5 === 0 && !isAdFree()) {
          postHtml += '<div style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:10px;text-align:center;color:rgba(255,255,255,0.3);font-size:10px;margin-top:12px;">[ 廣告 ]</div>';
      }
      
      return postHtml;
    }).join('');

    html += '<p class="text-center text-sm text-white/40 py-6">' + (liveTrack === 'mine' ? '你還沒有發布貼文' : '暫無戰報，快來發布第一個！') + '</p>';

  return html;
}

async function submitPlayerPost() {
    // 🔒 防重鎖
    if (!acquireSubmitLock('submitPlayerPost')) return;
    if (!requireLogin('發布戰報')) return;
    if (isUserBanned()) {
        showBannedMessage();
        return;
    }
    var submitBtn = disableSubmitButton('lp-submit-btn', '⏳ 發布中...');
    
    try {
        var storeId = document.getElementById('lp-store-id')?.value;
        if (!storeId) { 
            toast('請選擇店鋪', 'pink'); 
            enableSubmitButton(submitBtn, '✅ 發布戰報');
            return; 
        }
        
        var store = STORES.find(function(s) { return s.id === storeId; });
        if (!store) { 
            toast('找不到該店鋪', 'pink'); 
            enableSubmitButton(submitBtn, '✅ 發布戰報');
            return; 
        }
        
        toast('📍 已選擇：' + store.name + ' (' + store.region + ')', 'gold');
        
        if (!gpsLat || !gpsLng) {
            toast('📍 請先開啟 GPS 定位，以確保實況資訊的真實性', 'pink');
            enableSubmitButton(submitBtn, '✅ 發布戰報');
            return;
        }
        
        if (store.lat && store.lng) {
            var distance = calculateDistance(store.lat, store.lng, gpsLat, gpsLng);
            var distanceMeters = Math.round(distance * 1000);
            if (distance > 0.5) {
                toast('⚠️ 你距離該店鋪 ' + distanceMeters + ' 米，請在 500 米內發布戰報', 'pink');
                enableSubmitButton(submitBtn, '✅ 發布戰報');
                return;
            }
            toast('✅ 距離 ' + distanceMeters + ' 米，在 500 米範圍內，可以發布', 'green');
        }
        
        var selectedTags = [];
        document.querySelectorAll('[data-tag].chip-active-gold').forEach(function(btn) {
            selectedTags.push(btn.dataset.tag);
        });
        
        // ✅ 上傳多張照片（最多 3 張）
        var photos = [];
        var multiPhotos = window._camMulti?.['lp'] || [];
        
        if (multiPhotos.length > 0) {
            for (var i = 0; i < multiPhotos.length; i++) {
                var photoBlob = multiPhotos[i].blob;
                if (CLOUD_ON) {
                    try {
                        var file = new File([photoBlob], "post_" + Date.now() + "_" + i + ".jpg", { type: 'image/jpeg' });
                        var url = await uploadImage(file, 'posts');
                        photos.push(url);
                    } catch (e) {
                        toast('第 ' + (i + 1) + ' 張圖片上傳失敗', 'pink');
                        enableSubmitButton(submitBtn, '✅ 發布戰報');
                        return;
                    }
                } else {
                    photos.push(multiPhotos[i].dataUrl);
                }
            }
        } else if (window._cam?.['lp']) {
            var singleBlob = window._cam['lp'];
            if (CLOUD_ON) {
                try {
                    var singleFile = new File([singleBlob], "post_" + Date.now() + ".jpg", { type: 'image/jpeg' });
                    var singleUrl = await uploadImage(singleFile, 'posts');
                    photos.push(singleUrl);
                } catch (e) {
                    toast('圖片上傳失敗', 'pink');
                    enableSubmitButton(submitBtn, '✅ 發布戰報');
                    return;
                }
            } else {
                photos.push(window._camPreview?.['lp'] || '');
            }
        }
        
        if (photos.length === 0) {
            toast('請先拍照', 'pink');
            enableSubmitButton(submitBtn, '✅ 發布戰報');
            return;
        }
        
        var content = selectedTags.length > 0 ? selectedTags.join(' · ') : '🎉 出貨成功！';
        
        // ✅ 計算今日已發佈次數，決定是否扣分
        var today = todayKey();
        var dailyData = daily();
        var postCount = dailyData.live || 0;
        var isFree = postCount < POST_FREE_COUNT;
        if (postCount >= POST_DAILY_LIMIT) {
    toast('📢已達每日發佈上限(' + POST_DAILY_LIMIT + '/' + POST_DAILY_LIMIT + ')', 'pink');
    enableSubmitButton(submitBtn, '✅ 發布戰報');
    return;
}
        if (isFree) {
            toast('🎯 今日第 ' + (postCount + 1) + ' 次免費發布（共 2 次免費）', 'green');
        } else {
            if (STATE.points < POST_COST) {
                toast('⚠️ 積分不足 10 分，無法發布（今日前 2 次免費已用完）', 'pink');
                enableSubmitButton(submitBtn, '✅ 發布戰報');
                return;
            }
            toast('💡 今日第 ' + (postCount + 1) + ' 次發布，扣除 10 積分', 'gold');
        }
        
        var post = {
            id: 'p' + Date.now() + '_' + uid(),
            track: 'player',
            store_id: String(storeId),
            store_name: store ? store.name : '',
            store_region: store ? store.region : '',
            content: content,
            tags: selectedTags,
            photo: photos[0] || '',
            photos: photos,
            author: STATE.user.name,
            author_device: STATE.user.device,
            author_user_id: STATE.user.user_id || null,
            ts: now(),
            expire: now() + (STATE.extendedPostLifespan ? 2 * DAY : DAY),
            likes: [],
            likeCount: 0,
            is_linked: false,
            gps_lat: gpsLat,
            gps_lng: gpsLng
        };
        
        if (!STATE.livePosts) STATE.livePosts = [];
        STATE.livePosts.unshift(post);
        save();
        
        await syncLivePost(post);
        
        if (isFree) {
            await addPoints(5, '發布出貨戰報');
        } else {
           await addPoints(-POST_COST, '發布戰報（超過免費次數）');
        }
        
        dailyData.live = postCount + 1;
        save();
        
        updateStreak();
        await recordTaskCompletion('share');
        await recordRegionContribution('post', store.region, storeId);
        
        // ✅ 清除多張照片
        if (window._camMulti) window._camMulti['lp'] = [];
        window._cam['lp'] = null;
        window._camPreview['lp'] = null;
        
        closeModal();
        showView('live');
    } finally {
        releaseSubmitLock('submitPlayerPost');
    }
}

async function toggleLike(postId) {
  var post = STATE.livePosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  
  var userDevice = STATE.user.device;
  if (!post.likes) post.likes = [];
  
  var idx = post.likes.indexOf(userDevice);
  if (idx >= 0) {
    post.likes.splice(idx, 1);
  } else {
    post.likes.push(userDevice);
  }
  
  save();
  await syncLikeToCloud(postId, post.likes);
  // ✅ 檢查是否達成 3 讚延長
if (post.likes.length >= 3) {
    var newExpire = post.expire + DAY;
    post.expire = newExpire;
    await syncLivePost(post);
    toast('🎉 獲得 3 個讚，貼文延長 1 天！', 'green');
}
  // 只更新按鈕，不重新渲染
  var likeBtn = document.querySelector('[data-post-id="' + postId + '"]');
  if (likeBtn) {
    var hasLiked = post.likes.includes(userDevice);
    likeBtn.innerHTML = (hasLiked ? '❤️' : '🤍') + ' ' + post.likes.length;
    if (hasLiked) {
      likeBtn.classList.remove('text-white/30');
      likeBtn.classList.add('text-neonpink');
    } else {
      likeBtn.classList.remove('text-neonpink');
      likeBtn.classList.add('text-white/30');
    }
  }
}

async function toggleReaction(postId, reactionKey) {
  var post = STATE.livePosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  
  if (post.author_device === STATE.user.device) {
    toast('不能對自己的貼文發表感受', 'pink');
    return;
}
  
  
  if (!post.reactions) post.reactions = {};
  
  var userDevice = STATE.user.device;
  
  // 移除用戶之前的所有反應（只能選一個）
  Object.keys(post.reactions).forEach(function(key) {
    if (Array.isArray(post.reactions[key])) {
      post.reactions[key] = post.reactions[key].filter(function(d) { return d !== userDevice; });
      if (post.reactions[key].length === 0) delete post.reactions[key];
    }
  });
  
  // 加入新反應
  if (!post.reactions[reactionKey]) post.reactions[reactionKey] = [];
  if (!post.reactions[reactionKey].includes(userDevice)) {
    post.reactions[reactionKey].push(userDevice);
  } else {
    post.reactions[reactionKey] = post.reactions[reactionKey].filter(function(d) { return d !== userDevice; });
    if (post.reactions[reactionKey].length === 0) delete post.reactions[reactionKey];
  }
  
  save();
  
  // 雲端同步
  if (CLOUD_ON) {
    try {
      await fetch(
        SUPABASE_URL + "/rest/v1/live_posts?id=eq." + encodeURIComponent(postId),
        {
          method: 'PATCH',
          headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
          body: JSON.stringify({ reactions: post.reactions, updated_at: new Date().toISOString() })
        }
      );
    } catch (e) {
      console.warn('⚠️ 感想同步失敗:', e.message);
    }
  }
  // ✅ 檢查是否達成 5 感受延長
var totalReactions = 0;
Object.keys(post.reactions).forEach(function(key) {
    totalReactions += post.reactions[key].length;
});
if (totalReactions >= 5) {
    post.expire = post.expire + 2 * DAY;
    await syncLivePost(post);
    toast('🎉 獲得 5 個感受，貼文延長 2 天！', 'green');
}
  // 只更新感想按鈕區域
  if (CURRENT === 'live') {
    var overlay = document.getElementById('page-overlay');
    if (overlay) {
      overlay.innerHTML = VIEWS.live();
      overlay.scrollTop = 0;
    }
  }
}

async function deletePost(postId) {
  if (!confirm('確定要刪除這篇貼文嗎？\n\n⚠️ 刪除後將扣除 10 積分')) return;
  
  var post = STATE.livePosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  
  if (post.author_device !== STATE.user.device) {
    toast('只能刪除自己的貼文', 'pink');
    return;
  }
  
  try {
    // 雲端刪除
    if (CLOUD_ON) {
      await supabaseClientInstance
        .from('live_posts')
        .delete()
        .eq('id', postId);
    }
    
    // 本地刪除
    STATE.livePosts = STATE.livePosts.filter(function(p) { return p.id !== postId; });
    save();
    
    // 扣分
    await addPoints(-10, '刪除貼文');
    
    toast('✅ 貼文已刪除，-10 分', 'green');
    
    if (CURRENT === 'live') {
      showView('live');
    }
  } catch (e) {
    toast('❌ 刪除失敗: ' + e.message, 'pink');
  }
}

async function saveEditedTags(postId) {
  var selectedTags = [];
  document.querySelectorAll('[data-tag].chip-active-gold').forEach(function(btn) {
    selectedTags.push(btn.dataset.tag);
  });
  
  var post = STATE.livePosts.find(function(p) { return p.id === postId; });
  if (!post) return;
  
  post.tags = selectedTags;
  post.content = selectedTags.length > 0 ? selectedTags.join(' · ') : '';
  save();
  
  if (CLOUD_ON) {
    try {
      var response = await fetch(
        SUPABASE_URL + "/rest/v1/live_posts?id=eq." + encodeURIComponent(postId),
        {
          method: 'PATCH',
          headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
          body: JSON.stringify({ 
            tags: selectedTags,
            content: post.content,
            updated_at: new Date().toISOString()
          })
        }
      );
      if (!response.ok && response.status !== 204) throw new Error('HTTP ' + response.status);
    } catch (e) {
      console.warn('⚠️ 標籤更新失敗:', e.message);
    }
  }
  
  toast('✅ 標籤已更新', 'green');
  closeModal();
  if (CURRENT === 'live') showView('live');
}

function filterStoreSuggestions(prefix) {
  var input = document.getElementById(prefix + "-store-search");
  var container = document.getElementById(prefix + "-store-suggestions");
  if (!input || !container) return;
  var query = input.value.trim().toLowerCase();
  var filtered = STORES;
  if (query) filtered = STORES.filter(function(s) { return s.name.toLowerCase().includes(query) || s.region.toLowerCase().includes(query); });
  filtered = filtered.slice(0, 10);
  if (filtered.length === 0) { container.classList.add('hidden'); return; }
  container.classList.remove('hidden');
  container.innerHTML = filtered.map(function(s) {
    return '<button onclick="selectStoreSuggestion(\'' + prefix + '\', \'' + s.id + '\', \'' + s.name.replace(/'/g, "\\'") + '\')" class="block w-full text-left px-3 py-2 hover:bg-gold/20 text-sm text-white/80 border-b border-white/10 last:border-0 transition-colors">\n      <span class="text-gold">' + s.name + '</span>\n      <span class="text-[10px] text-white/40 ml-2">' + s.region + '</span>\n    </button>';
  }).join('');
  setTimeout(function() {
    document.addEventListener('click', function closeSuggestions(e) {
      if (!container.contains(e.target) && e.target !== input) {
        container.classList.add('hidden');
        document.removeEventListener('click', closeSuggestions);
      }
    });
  }, 100);
}

function selectStoreSuggestion(prefix, storeId, storeName) {

    nameDisplay.textContent = store.name + '（' + store.region + '）';

  }
  
  checkPostForm(prefix);
}

function renderStoreList() {

  var start = 0, end = Math.min(PAGE_SIZE, list.length);
  var pageItems = list.slice(start, end);
  var hasMore = list.length > PAGE_SIZE;
  
var formatDist = function(s) {
    if (!s._dist || s._dist === 9999 || isNaN(s._dist)) return '📍 位置未知';
    if (s._dist < 1) return Math.round(s._dist * 1000) + "m";
    return s._dist.toFixed(1) + "km";
};
  
  function renderStoreCard(s) {
    var isVerified = s.status === "verified" || s.verified === "verified";
    var badge = isVerified ? '<span class="rounded-full border border-neongreen/40 bg-neongreen/10 px-2 py-0.5 text-[10px] text-neongreen whitespace-nowrap">✅ 已認證</span>' : '<span class="rounded-full border border-yellow-400/40 bg-yellow-400/10 px-2 py-0.5 text-[10px] text-yellow-400 whitespace-nowrap">⏳ 審核中</span>';
    var borderClass = isVerified ? "border-gold/25 hover:border-gold/60" : "border-yellow-400/30 border-dashed hover:border-yellow-400/60";
    var distDisplay = (userLocation && s.lat && s.lng) ? '<span class="text-neonpink neon-pink whitespace-nowrap">📍 ' + formatDist(s) + '</span>' : '<span class="text-white/40 whitespace-nowrap">📍 ' + (s.dist || '?') + ' km</span>';
    
    return '<button onclick="openStoreFromMap(\'' + s.id + '\')" class="w-full rounded-2xl border ' + borderClass + ' bg-zinc-950 p-4 text-left transition-all">\n      <div class="flex gap-3">\n        <div class="shrink-0">' + (s.photo ? '<img src="' + s.photo + '" class="h-16 w-16 rounded-lg object-cover" alt="' + s.name + '" />' : '<div class="flex h-16 w-16 items-center justify-center rounded-lg bg-zinc-800 text-3xl">🏪</div>') + '</div>\n        <div class="min-w-0 flex-1">\n          <div class="flex items-start justify-between gap-2">\n            <div class="min-w-0 flex-1">\n              <h3 class="font-black text-gold truncate">' + s.name + '</h3>\n              <p class="mt-0.5 text-xs text-white/50 truncate">' + s.region + ' · ' + (s.addr || '') + '</p>\n            </div>\n            <div class="shrink-0">' + badge + '</div>\n          </div>\n          <div class="mt-2 flex flex-wrap items-center gap-3 text-[11px] text-white/50">' + distDisplay + '<span class="whitespace-nowrap">🎰 ' + (s.machines ? s.machines.length : 0) + ' 部機台</span></div>\n        </div>\n      </div>\n    </button>';
  }
  
  // 分組：商場 vs 地鋪
  var mallGroups = {};
  var standaloneStores = [];
  pageItems.forEach(function(s) {
    if (s.mall && s.mall !== '') {
      if (!mallGroups[s.mall]) mallGroups[s.mall] = [];
      mallGroups[s.mall].push(s);
    } else {
      standaloneStores.push(s);
    }
  });
  
  var html = '';
  
  // 商場群組（摺疊，預設收起）
  Object.keys(mallGroups).forEach(function(mallName) {
    var stores = mallGroups[mallName];
    var mallDist = (userLocation && stores[0].lat && stores[0].lng) ? formatDist(stores[0]) : '';
    html += '<button onclick="toggleMallExpand(this)" class="w-full rounded-xl border border-gold/30 bg-gold/5 p-3 text-left transition-all">\n      <div class="flex items-center justify-between">\n        <span class="font-bold text-gold text-sm">🏬 ' + mallName + '</span>\n        <span class="text-[10px] text-white/40">' + stores.length + ' 間店鋪 ' + (mallDist ? ' · 📍' + mallDist : '') + ' ▼</span>\n      </div>\n    </button>\n    <div class="hidden space-y-2 pl-2 mt-1">' + stores.map(function(s) { return renderStoreCard(s); }).join('') + '</div>\n    ';
  });
  
  // 地鋪
  standaloneStores.forEach(function(s) {
    html += renderStoreCard(s);
  });
  
  var moreBtn = hasMore ? '<button onclick="loadMoreStores()" class="mt-2 w-full rounded-2xl border border-gold/40 bg-zinc-950 py-4 text-center text-gold hover:border-gold/60 transition-all">🔽 顯示更多（' + (list.length - PAGE_SIZE) + ' 間）</button>' : '';

// 商場摺疊
function toggleMallExpand(btn) {
  var nextDiv = btn.nextElementSibling;
  if (nextDiv) {
    nextDiv.classList.toggle('hidden');
    btn.textContent = nextDiv.classList.contains('hidden') ? btn.textContent.replace('▲', '▼') : btn.textContent.replace('▼', '▲');
  }
}
function filteredStores() {
  var list = STORES.slice();
  
  // 地區篩選
  if (findState.region !== "全部" && findState.region !== "") list = list.filter(function(s) { return s.region === findState.region; });

  
  // 搜索
  if (findSearchQuery) {
      list = list.filter(function(s) { return s.name.toLowerCase().includes(findSearchQuery.toLowerCase()); });
  }
  
  // 排序
  if (findSortMethod === 'name') {
      list.sort(function(a, b) { return a.name.localeCompare(b.name, 'zh-HK'); });
  } else if (findSortMethod === 'hot') {
      list.sort(function(a, b) { return (b.verification_count || 0) - (a.verification_count || 0); });
  } else if (findSortMethod === 'distance') {
      if (userLocation) {
          list.forEach(function(s) { s._dist = (s.lat && s.lng) ? calculateDistance(userLocation.lat, userLocation.lng, s.lat, s.lng) : 9999; });
          list.sort(function(a, b) { return a._dist - b._dist; });
      }
  }
  
  allFilteredStores = list;
  currentPage = 0;
  return list;
}

        return '<button onclick="openStoreFromMap(\'' + s.id + '\')" class="w-full rounded-2xl border ' + borderClass + ' bg-zinc-950 p-4 text-left transition-all">\n      <div class="flex gap-3">\n        <div class="shrink-0">' + (s.photo ? '<img src="' + s.photo + '" class="h-16 w-16 rounded-lg object-cover" alt="' + s.name + '" />' : '<div class="flex h-16 w-16 items-center justify-center rounded-lg bg-zinc-800 text-3xl">🏪</div>') + '</div>\n        <div class="min-w-0 flex-1">\n          <div class="flex items-start justify-between gap-2">\n            <div><h3 class="font-black text-gold">' + s.name + '</h3><p class="mt-0.5 text-xs text-white/50">' + s.region + ' · ' + s.addr + '</p></div>\n            ' + badge + '\n          </div>\n          <div class="mt-2 flex flex-wrap items-center gap-3 text-[11px] text-white/50">' + distDisplay + '<span>🎰 ' + s.machines.length + ' 部機台</span><span>' + (s.size === 'small' ? '小型' : s.size === 'large' ? '大型' : '中型') + (s.hour24 ? ' · 24H' : '') + (s.token ? ' · 需代幣' : '') + '</span></div>\n        </div>\n      </div>\n    </button>';

async function claimSubmitterReward(storeId) {
    if (!requireLogin('領取獎勵')) return;
    
    var store = STORES.find(function(s) { return s.id === storeId; });
    if (!store) return;
    
    if (store.submitter_reward_claimed) {
        toast('已領取', 'gold');
        return;
    }
    
    if (store.submitted_by_device !== STATE.user.device) {
        toast('只有提交者可以領取', 'pink');
        return;
    }
    
    try {
        await supabaseClientInstance
            .from('claw_stores')
            .update({ submitter_reward_claimed: true })
            .eq('id', parseInt(storeId));
        
        store.submitter_reward_claimed = true;
        save();
        
        await addPoints(35, '提交店鋪通過認證追加獎勵');
        toast('🎉 領取 35 積分成功！', 'green');
        showView('task');
    } catch (e) {
        toast('❌ 領取失敗: ' + e.message, 'pink');
    }
}

    html += '<div class="w-8 h-8 rounded-full ' + bg + ' flex items-center justify-center text-xs font-bold ' + text + '">' + dayNames[i - 1] + '</div>';
  }
  html += '</div>';
  html += '<div class="text-center text-[10px] text-white/40 mt-1">本週簽到 ' + progress.count + '/7 天</div>';
  var bonusInfo = '';
  if (progress.count >= 7) {
    bonusInfo = '🎊 已達全勤！';

  html += '<div class="text-center text-[9px] text-gold/60 mt-0.5">' + bonusInfo + '</div>';
  html += '</div>';
  return html;
}

function renderAchievementProgress() {
  var achState = getAchievementState();
  var unlocked = achState.unlocked || [];
  var total = Object.keys(ACHIEVEMENT_DEFS).length;
  var nextAch = null;
  var minProgress = 100;
  
  for (var key in ACHIEVEMENT_DEFS) {
    if (unlocked.includes(key)) continue;
    var progress = getAchievementProgress(key);
    if (progress.percentage < minProgress && progress.percentage > 0) {
      minProgress = progress.percentage;
      nextAch = Object.assign({ key: key }, progress, { def: ACHIEVEMENT_DEFS[key] });
    }
  }
  
  var html = '<div class="mt-4 rounded-xl border border-gold/20 bg-zinc-950/50 p-3">\n    <div class="flex items-center justify-between">\n      <span class="text-xs text-white/40">🏆 成就進度</span>\n      <span class="text-[10px] text-gold">' + unlocked.length + '/' + total + '</span>\n    </div>\n    <div class="mt-1 h-1.5 w-full rounded-full bg-white/10 overflow-hidden">\n      <div class="h-full rounded-full bg-gold transition-all" style="width:' + (unlocked.length / total) * 100 + '%"></div>\n    </div>';
  
  if (nextAch) {
    html += '<div class="mt-2 text-[10px] text-white/40">\n      下一個成就：<span class="text-gold">' + nextAch.def.icon + ' ' + nextAch.def.name + '</span>\n      （' + nextAch.current + '/' + nextAch.required + '）\n    </div>';
  } else {
    html += '<div class="mt-2 text-[10px] text-neongreen">🎉 所有成就已解鎖！</div>';
  }
  html += '</div>';
  return html;
}
