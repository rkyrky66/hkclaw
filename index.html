/* ============================================================
   🎯 任務系統 CSS (新增)
   ============================================================ */
.task-progress-bar {
    background: linear-gradient(90deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
    border: 1px solid rgba(212,175,55,0.3);
}
.task-progress-bar .bar-fill {
    background: linear-gradient(90deg, #D4AF37, #FFD700);
    transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.task-progress-bar .bar-fill.complete {
    background: linear-gradient(90deg, #00FF00, #00CC88);
}
.task-item {
    transition: all 0.2s ease;
}
.task-item:active {
    transform: scale(0.98);
}
.task-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}
.task-cell {
    background: #09090b;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 16px;
    padding: 12px 10px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
}
.task-cell:active {
    transform: scale(0.95);
}
.task-cell .task-name {
    font-size: 12px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
}
.task-cell .task-points {
    font-size: 10px;
    color: #D4AF37;
}
.task-cell .task-bar {
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    overflow: hidden;
    margin-top: 8px;
    display: flex;
    gap: 2px;
}
.task-cell .task-bar-segment {
    flex: 1;
    background: rgba(255,255,255,0.1);
    border-radius: 1px;
    transition: all 0.4s;
}
.task-cell .task-bar-segment.done {
    background: #D4AF37;
}
.task-cell .task-count {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
}
.task-cell .task-action {
    font-size: 10px;
    color: #D4AF37;
    margin-top: 6px;
    font-weight: 700;
}
.task-cell.completed {
    border-color: #D4AF37;
    background: rgba(212,175,55,0.1);
    cursor: default;
}
.task-cell.completed .task-action {
    color: #00FF00;
}

@keyframes taskProgressGlow {
    0%, 100% { box-shadow: 0 0 5px rgba(0,255,0,0.3); }
    50% { box-shadow: 0 0 20px rgba(0,255,0,0.7), 0 0 40px rgba(0,255,0,0.3); }
}
.task-cell.progress-update {
    animation: taskProgressGlow 1s ease;
}

@keyframes taskCompleteGlow {
    0% { box-shadow: 0 0 0 rgba(212,175,55,0); transform: scale(1); }
    30% { box-shadow: 0 0 30px rgba(212,175,55,0.8), 0 0 60px rgba(212,175,55,0.4); transform: scale(1.05); }
    100% { box-shadow: 0 0 5px rgba(212,175,55,0.3); transform: scale(1); }
}
.task-cell.complete-animation {
    animation: taskCompleteGlow 1.5s ease;
}

@keyframes badgePop {
    0% { transform: scale(0) rotate(-20deg); opacity: 0; }
    60% { transform: scale(1.3) rotate(5deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
}
.task-cell .complete-badge {
    animation: badgePop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.task-item .task-icon {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    flex-shrink: 0;
}
.task-item .task-icon.core {
    background: rgba(212,175,55,0.15);
    border: 1px solid rgba(212,175,55,0.3);
}
.task-item .task-icon.daily {
    background: rgba(0,255,0,0.08);
    border: 1px solid rgba(0,255,0,0.2);
}
.task-item .task-progress-mini {
    height: 4px;
    border-radius: 2px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
}
.task-item .task-progress-mini .fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.4s ease;
}

/* ============================================================
   🌍 區域探索進度 CSS (地圖左上角)
   ============================================================ */
#region-progress-container {
    position: absolute;
    top: 2px;
    left: 2px;
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
    width: auto;
    background: transparent;
    padding: 0;
    text-shadow: 
        -1px -1px 0 #fff,
        1px -1px 0 #fff,
        -1px 1px 0 #fff,
        1px 1px 0 #fff,
        0 0 4px rgba(255,255,255,0.8);
}

/* ============================================================
   ⭐ 個人標記升級 CSS (地圖標記)
   ============================================================ */
@keyframes markerPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(212, 175, 55, 0.3); }
    50% { box-shadow: 0 0 24px rgba(212, 175, 55, 0.7), 0 0 48px rgba(212, 175, 55, 0.3); }
}
@keyframes markerFloat {
    0%, 100% { transform: rotate(-45deg) translateY(0); }
    50% { transform: rotate(-45deg) translateY(-4px); }
}
.marker-level-2 {
    animation: markerPulse 2s ease-in-out infinite;
}
.marker-level-3 {
    animation: markerFloat 3s ease-in-out infinite;
}
.marker-level-4 {
    animation: markerPulse 1.5s ease-in-out infinite;
}

    padding: 16px;
    flex-shrink: 0;

    align-items: center;

    color: #D4AF37;

    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

}

    border: 1px solid rgba(255,255,255,0.1);

    min-height: 44px;
    display: flex;

    align-items: center;
    justify-content: center;
    gap: 2px;

// 獲取今日任務進度
function getTaskProgress() {
    var today = todayKey();
    if (!STATE.taskProgress) STATE.taskProgress = {};
    if (!STATE.taskProgress[today]) {
        STATE.taskProgress[today] = {
            submit_store: 0,
            verify_store: 0,
            supplement: 0,
            checkin: 0,
            machine_checkin: 0,
            share: 0,
            total_points: 0,
            goal_reached: false,
            goal_rewarded: false
        };
    }
    return STATE.taskProgress[today];
}

// 計算今日總得分
function calculateDailyScore(progress) {
    if (!progress) progress = getTaskProgress();
    var total = 0;
    for (var key in TASK_TYPES) {
        var done = progress[key] || 0;
        total += done * TASK_TYPES[key].points;
    }
    return total;
}

// 檢查是否達標 (50分)
function isDailyGoalReached(progress) {
    if (!progress) progress = getTaskProgress();
    return calculateDailyScore(progress) >= 50;
}

// 記錄任務完成
async function recordTaskCompletion(taskKey) {
    var progress = getTaskProgress();
    var task = TASK_TYPES[taskKey];
    if (!task) return false;
    
    // 檢查是否已達上限
    var current = progress[taskKey] || 0;
    if (current >= task.limit) {
        toast('⚠️ 今日 ' + task.label + ' 已達上限 (' + task.limit + ' 次)', 'pink');
        return false;
    }
    
    // 更新進度
    progress[taskKey] = current + 1;
    progress.total_points = calculateDailyScore(progress);
    
    // 檢查是否達標
    var wasReached = progress.goal_reached || false;
    var isReached = progress.total_points >= 50;
    
    if (isReached && !wasReached) {
        progress.goal_reached = true;
        progress.goal_rewarded = true;
        // 額外獎勵 +20 分 (不計入進度)
        await addPoints(20, '🎯 每日任務達標獎勵！');
        toast('🎉 恭喜達成今日目標！獲得 +20 獎勵積分！', 'gold');
    }
    
    save();
    
    // 同步到雲端
    if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
        try {
            await syncTaskProgress(progress);
        } catch (e) {
            console.warn('⚠️ 任務進度雲端同步失敗:', e.message);
        }
    }
    
    return true;
}

// 同步任務進度到雲端
async function syncTaskProgress(progress) {
    if (!CLOUD_ON || !STATE.user.is_bound || !STATE.user.user_id) return;
    
    var today = todayKey();
    var userId = STATE.user.user_id;
    var deviceId = STATE.user.device;
    
    try {
        var body = {
            user_id: userId,
            device_id: deviceId,
            date: today,
            submit_store: progress.submit_store || 0,
            verify_store: progress.verify_store || 0,
            supplement: progress.supplement || 0,
            checkin: progress.checkin || 0,
            machine_checkin: progress.machine_checkin || 0,
            share: progress.share || 0,
            total_points: progress.total_points || 0,
            is_goal_reached: progress.goal_reached || false,
            updated_at: new Date().toISOString()
        };
        
        // 先檢查是否存在
        var checkResponse = await fetch(
            SUPABASE_URL + "/rest/v1/task_progress?user_id=eq." + userId + "&date=eq." + today,
            { headers: getSupabaseHeaders() }
        );
        var existing = await checkResponse.json();
        
        if (existing && existing.length > 0) {
            // 更新
            await fetch(
                SUPABASE_URL + "/rest/v1/task_progress?user_id=eq." + userId + "&date=eq." + today,
                {
                    method: 'PATCH',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify(body)
                }
            );
        } else {
            // 插入
            await fetch(
                SUPABASE_URL + "/rest/v1/task_progress",
                {
                    method: 'POST',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify([Object.assign({ created_at: new Date().toISOString() }, body)])
                }
            );
        }
        console.log('✅ 任務進度已同步到雲端');
    } catch (e) {
        console.warn('⚠️ 同步任務進度失敗:', e.message);
    }
}
// 從雲端加載任務進度
async function loadTaskProgressFromCloud() {
    if (!CLOUD_ON || !STATE.user.is_bound || !STATE.user.user_id) return;
    
    var today = todayKey();
    try {
        var response = await fetch(
            SUPABASE_URL + "/rest/v1/task_progress?user_id=eq." + STATE.user.user_id + "&date=eq." + today,
            { headers: getSupabaseHeaders() }
        );
        if (!response.ok) throw new Error('HTTP ' + response.status);
        var data = await response.json();
        
        if (data && data.length > 0) {
            var cloudProgress = data[0];
            var localProgress = getTaskProgress();
            
            // 合併 (雲端優先，但保留本地較大的值)
            for (var key in TASK_TYPES) {
                if (cloudProgress[key] !== undefined) {
                    localProgress[key] = Math.max(localProgress[key] || 0, cloudProgress[key] || 0);
                }
            }
            localProgress.total_points = calculateDailyScore(localProgress);
            localProgress.goal_reached = cloudProgress.is_goal_reached || false;
            
            save();
            console.log('✅ 任務進度已從雲端同步');
        }
    } catch (e) {
        console.warn('⚠️ 加載任務進度失敗:', e.message);
    }
}

// 計算區域探索進度
function calculateRegionProgress(regionKey) {
    var region = REGION_KEYS[regionKey];
    if (!region) return { total: 0, verified: 0, percentage: 0, isComplete: false };
    
    var districts = region.districts;
    var totalStores = STORES.filter(function(s) {
        return districts.indexOf(s.region) !== -1;
    });
    var verifiedStores = totalStores.filter(function(s) {
        return s.status === 'verified' || s.verified === 'verified';
    });
    
    return {
        total: totalStores.length,
        verified: verifiedStores.length,
        percentage: totalStores.length > 0 ? Math.round((verifiedStores.length / totalStores.length) * 100) : 0,
        isComplete: totalStores.length > 0 && verifiedStores.length >= totalStores.length
    };
}

// 渲染區域探索進度 HTML
function renderRegionProgress() {
    // 計算三區稱號
    var regionTitles = {};
    for (var key in REGION_KEYS) {
        var region = REGION_KEYS[key];
        var contributions = [];
        // 從 user_region_contributions 取得該區貢獻
        if (window._allRegionContributions) {
            contributions = window._allRegionContributions.filter(function(c) { return c.region_group === key; });
        }
        var title = calculateRegionTitle(key, contributions);
        regionTitles[key] = title.title;
    }
    
    // 計算全港稱號
    var allContributions = window._allRegionContributions || [];
    var globalTitle = calculateGlobalTitle(allContributions);
    var hasGlobalTitle = globalTitle.level >= 2;
    
    // 探索中地區
    var exploreRegion = '';
    var exploreCount = '';
    if (userLocation) {
        var nearestRegion = getNearestStoreRegion(userLocation.lat, userLocation.lng);
        if (nearestRegion) {
            exploreRegion = nearestRegion;
            var regionStores = STORES.filter(function(s) { return s.region === nearestRegion; });
            var userContributions = allContributions.filter(function(c) { return c.region_name === nearestRegion; });
            var contributedStores = {};
            userContributions.forEach(function(c) {
                if (c.store_id) contributedStores[c.store_id] = true;
            });
            exploreCount = Object.keys(contributedStores).length + '/' + regionStores.length;
        }
    }
    
    var html = '<div id="region-progress-container">';
    
    // 全港稱號（如有）
    if (hasGlobalTitle) {
        html += '<div style="font-size:13px;font-weight:900;color:#D4AF37;margin-bottom:4px;">👑 ' + globalTitle.title + '</div>';
    }
    
   // 三區稱號
html += '<div style="font-size:10px;color:#1a1a1a;font-weight:600;margin-bottom:6px;">' +
    '🏝️ ' + (regionTitles['hk'] || '旅人') + ' 🏙️ ' + (regionTitles['kl'] || '旅人') + ' 🌳 ' + (regionTitles['nt'] || '旅人') +
'</div>';

// 探索中
html += '<div style="font-size:10px;color:#1a1a1a;font-weight:600;">📍 探索中：</div>';

    var device = STATE.user.device;
    var count = 0;

    if (store.submitted_by === device) count += 1;
    
    // 認證店鋪 +1
    if (store._userVerified) count += 1;
    
    // 補充資料 +1
    if (store._userSupplemented) count += 1;
    
    // 機台共享 +1
    if (store.machines && store.machines.some(function(m) { return m.submitted_by === device; })) {
        count += 1;
    }
    
    return count;
}

}

// 計算用戶對某店鋪的貢獻
function getUserContributionForStore(store) {
    var device = STATE.user.device;
    var score = 0;
    var effects = [];
    
    // 提交店鋪（權重 +5）
    if (store.submitted_by_device === device) {
        score += 5;
        effects.push('submit');
    }
    
    // 認證店鋪（權重 +3）
    if (store._userVerified) {
        score += 3;
        effects.push('verify');
    }
    
    // 補充地址（權重 +2）
    if (store._userSupplemented || store.supplemented_by === device) {
        score += 2;
        effects.push('supplement');
    }
    
    // 打卡（權重 +1）
    if (hasCheckedInToday(store.id)) {
        score += 1;
        effects.push('checkin');
    }
    
    // 發布戰績（權重 +1）
    if (STATE.livePosts && STATE.livePosts.some(function(p) { 
        return p.store_id === String(store.id) && p.author_device === device; 
    })) {
        score += 1;
        effects.push('post');
    }
    
    return { score: score, effects: effects };
}

var STATE = load();

function load() {
  try {
    var raw = JSON.parse(localStorage.getItem("claw_state"));
    if (raw) {
      var merged = Object.assign({}, structuredClone(DEFAULT_STATE), raw);
      if (merged.achievements && merged.achievements.stats) {
        Object.keys(DEFAULT_STATE.achievements.stats).forEach(function(key) {
          if (merged.achievements.stats[key] === undefined) {
            merged.achievements.stats[key] = 0;
          }
        });
      }
      return merged;
    }
    return structuredClone(DEFAULT_STATE);
  } catch (_a) {
    return structuredClone(DEFAULT_STATE);
  }
}

function save() {
  try {
    // 清理過期資料
    cleanupExpiredData();
    
    var json = JSON.stringify(STATE);
    localStorage.setItem("claw_state", json);
  } catch(e) {
    if (e.name === 'QuotaExceededError') {
      console.warn('⚠️ localStorage 超出配額，嘗試緊急清理...');
      emergencyCleanup();
      try {
        var json2 = JSON.stringify(STATE);
        localStorage.setItem("claw_state", json2);
        console.log('✅ 清理後儲存成功');
      } catch(e2) {
        console.error('❌ 清理後仍無法儲存:', e2.message);
        // 最終手段：只保留最基本的資料
        try {
          var minimalState = {
            user: STATE.user,

            total_xp: STATE.total_xp || 0,
            favStores: STATE.favStores || [],
            favMachines: STATE.favMachines || [],
            achievements: STATE.achievements || { unlocked: [], stats: {} },
            weeklyCheckin: STATE.weeklyCheckin || {},
            taskProgress: STATE.taskProgress || {},
            daily: STATE.daily || {}
          };
          localStorage.setItem("claw_state", JSON.stringify(minimalState));
          STATE = minimalState;
          console.log('✅ 極端清理後儲存成功');
        } catch(e3) {
          console.error('❌ 完全無法儲存:', e3.message);
        }
      }
    } else {

// 清理過期資料
function cleanupExpiredData() {
  var now = Date.now();
  
  // 清理過期貼文（只保留 7 天內的和自己的）
  if (STATE.livePosts && Array.isArray(STATE.livePosts)) {
    STATE.livePosts = STATE.livePosts.filter(function(p) {
      return p.expire > now || (p.author_device === STATE.user.device);
    });
    // 最多保留 30 篇
    if (STATE.livePosts.length > 30) {
      STATE.livePosts = STATE.livePosts.slice(0, 30);
    }
    // 移除 base64 照片，只保留 URL
    STATE.livePosts.forEach(function(p) {
      if (p.photo && p.photo.startsWith('data:')) {
        p.photo = '';
      }
    });
  }
  
  // 清理待同步貼文（最多保留 5 篇，移除 base64 照片）
  if (STATE._pendingPosts && STATE._pendingPosts.length > 5) {
    STATE._pendingPosts = STATE._pendingPosts.slice(0, 5);
  }
  if (STATE._pendingPosts) {
    STATE._pendingPosts.forEach(function(p) {
      if (p.photo && p.photo.startsWith('data:')) {
        p.photo = '';
      }
    });
  }
  
  // 清理離線檢舉（最多保留 10 筆）
  if (STATE._offlineReports && STATE._offlineReports.length > 10) {
    STATE._offlineReports = STATE._offlineReports.slice(0, 10);
  }
  
  // 清理舊通知（最多保留 20 條）
  if (STATE.notifications && STATE.notifications.length > 20) {
    STATE.notifications = STATE.notifications.slice(0, 20);
  }
  
  // 清理舊的簽到記錄（只保留最近 4 週）
  if (STATE.weeklyCheckin) {
    var keys = Object.keys(STATE.weeklyCheckin);
    if (keys.length > 4) {
      keys.sort();
      for (var i = 0; i < keys.length - 4; i++) {
        delete STATE.weeklyCheckin[keys[i]];
      }
    }
  }
  
  // 清理舊的任務進度（只保留最近 14 天）
  if (STATE.taskProgress) {
    var taskKeys = Object.keys(STATE.taskProgress);
    if (taskKeys.length > 14) {
      taskKeys.sort();
      for (var i = 0; i < taskKeys.length - 14; i++) {
        delete STATE.taskProgress[taskKeys[i]];
      }
    }
  }
  
  // 清理舊的每日記錄（只保留最近 7 天）
  if (STATE.daily) {
    var dailyKeys = Object.keys(STATE.daily);
    if (dailyKeys.length > 7) {
      dailyKeys.sort();
      for (var i = 0; i < dailyKeys.length - 7; i++) {
        delete STATE.daily[dailyKeys[i]];
      }
    }
  }
}

// 緊急清理
function emergencyCleanup() {

  STATE.livePosts = [];
  STATE.myPosts = [];

// Supabase 輔助函數
// ============================================================
function isSupabaseReady() {
  if (!supabaseClientInstance) { return false; }
  if (typeof supabaseClientInstance.auth === 'undefined') { return false; }
  if (typeof supabaseClientInstance.auth.signInWithOAuth !== 'function') { return false; }
  return true;
}

function getSupabaseHeaders(extra) {
  return Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': 'Bearer ' + SUPABASE_KEY,
    'Content-Type': 'application/json'
  }, extra || {});
}

async function sbFetch(path, opts) {
  if (opts === void 0) opts = {};
  if (!CLOUD_ON) return null;
  var res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({}, opts, {
    headers: Object.assign({
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      "Content-Type": "application/json",
      Prefer: "return=minimal"
    }, opts.headers || {})
  }));
  if (!res.ok) throw new Error("Supabase " + res.status);
  if (res.status === 204 || res.status === 201) return null;
  return res.json();
}

async function cloudInsert(table, row) {
  if (!CLOUD_ON) return;
  try {
    let processedRow = { ...row };
    
    // claw_stores 的 id 是 bigint IDENTITY，不應該手動傳入
    if (table === 'claw_stores') {
      delete processedRow.id;
      delete processedRow._userVerified;
      delete processedRow._userSupplemented;
      delete processedRow._dist;
    }
    
    // 處理 UUID 欄位：如果 user_id 不是有效 UUID，改存到 device_id
    if (processedRow.user_id !== undefined && processedRow.user_id !== null && processedRow.user_id !== '') {
      if (!isValidUUID(processedRow.user_id)) {
        if (processedRow.device_id === undefined || processedRow.device_id === null) {
          processedRow.device_id = processedRow.user_id;
        }
        processedRow.user_id = null;
      }
    }
    
    // 處理 submitted_by 欄位（uuid 類型）
    if (processedRow.submitted_by !== undefined && processedRow.submitted_by !== null && processedRow.submitted_by !== '') {
      if (!isValidUUID(processedRow.submitted_by)) {
        if (processedRow.submitted_by_device === undefined || processedRow.submitted_by_device === null) {
          processedRow.submitted_by_device = processedRow.submitted_by;
        }
        processedRow.submitted_by = null;
      }
    }
    
    // 處理 author_user_id 欄位（uuid 類型）
    if (processedRow.author_user_id !== undefined && processedRow.author_user_id !== null && processedRow.author_user_id !== '') {
      if (!isValidUUID(processedRow.author_user_id)) {
        processedRow.author_user_id = null;
        // 保留 author_device 作為標識
      }
    }
    
    await sbFetch(table, {
      method: "POST",
      headers: { Prefer: "return=minimal" },
      body: JSON.stringify([processedRow])
    });
  } catch (e) { 
    console.log("[v0] cloudInsert 失敗:", e.message); 
  }
}

function isValidUUID(str) {
  var uuidRegex = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  return uuidRegex.test(str);
}

async function uploadImage(file, folder) {
  if (folder === void 0) folder = 'stores';
  if (!CLOUD_ON) {
    return new Promise(function(resolve) {
      var reader = new FileReader();
      reader.onload = function(e) { return resolve(e.target.result); };
      reader.readAsDataURL(file);
    });
  }
  var BUCKET = 'claw-stores-images';
  var fileName = folder + "/" + Date.now() + "_" + uid() + ".jpg";
  var path = "storage/v1/object/" + BUCKET + "/" + fileName;
  var uploadRes = await fetch(SUPABASE_URL + "/" + path, {
    method: 'POST',
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: "Bearer " + SUPABASE_KEY,
      'Content-Type': file.type || 'image/jpeg'
    },
    body: file
  });
  if (!uploadRes.ok) {
    var errText = await uploadRes.text();
    console.error('上傳失敗:', errText);
    throw new Error("上傳失敗: " + errText);
  }
  return SUPABASE_URL + "/storage/v1/object/public/" + BUCKET + "/" + fileName;
}

// ----- 積分同步 (P1) -----
async function addPoints(n, why) {
  STATE.points = Math.max(0, STATE.points + n);
  save();
  renderPoints();
  
  var xpAmount = 0;
  if (why && why.includes('提交店鋪')) {
    xpAmount = 15;
    setTimeout(function() { return updateAchievementStat('submit_store'); }, 100);
    setTimeout(function() { return updateStreak(); }, 200);
  } else if (why && why.includes('認證')) {
    xpAmount = 15;
    setTimeout(function() { return updateAchievementStat('verify_store'); }, 100);
  } else if (why && (why.includes('認證通過') || why.includes('追加'))) {
    xpAmount = 35;
  } else if (why && why.includes('補充')) {
    xpAmount = 5;
    setTimeout(function() { return updateAchievementStat('supplement'); }, 100);
  } else if (why && why.includes('打卡')) {
    xpAmount = 5;
    setTimeout(function() { return updateCheckinStreak(); }, 100);
  } else if (why && why.includes('解鎖成就')) {
    xpAmount = 0;
  } else if (why && why.includes('每日任務達標獎勵')) {
    xpAmount = 10;
  } else {
    xpAmount = 2;
  }
  
  if (xpAmount > 0) {
    addXP(xpAmount, why);
  }
  
  // 雲端同步積分
  if (CLOUD_ON && STATE.user.is_bound && STATE.user.user_id) {
    try {
      await fetch(`${SUPABASE_URL}/rest/v1/user_profiles?id=eq.${STATE.user.user_id}`, {
        method: 'PATCH',
        headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify({
          total_points: STATE.points,
          total_xp: STATE.total_xp || 0,
          last_active_at: new Date().toISOString()
        })
      });
      console.log('✅ 積分已同步到雲端');
    } catch (e) {
      console.warn('⚠️ 積分雲端同步失敗:', e.message);
    }
  }
    // 特效觸發（防重複）
  if (n > 0) {
    if (why && (why.includes('成就') || why.includes('解鎖'))) {
        fireAchievementConfettiOnce();
    } else if (why && (why.includes('提交') || why.includes('補充') || why.includes('認證') || why.includes('實證'))) {
        fireConfettiOnce();
    }
  }
  toast((n >= 0 ? "+" : "") + n + " 積分 · " + why, n >= 0 ? "green" : "pink");
}

async function loadLivePosts() {
  if (!CLOUD_ON) {
    return STATE.livePosts || [];
  }
  
  try {
    var now = Date.now();
    var result = await supabaseClientInstance
      .from('live_posts')
      .select('*')
      .gt('expire', now)
      .order('ts', { ascending: false })
      .limit(100);
    
    if (result.error) throw result.error;
    
    var posts = result.data || [];
    
    STATE.livePosts = posts.map(function(p) {
      if (p.photo && p.photo.startsWith('data:')) {
        p.photo = '';
      }
      return p;
    });
    save();
    return posts;
  } catch (e) {
    console.warn('⚠️ 載入雲端貼文失敗，使用本地快取:', e.message);
    return STATE.livePosts || [];
  }
}
async function syncLivePost(post) {
  if (!CLOUD_ON) return false;
  
  try {
    // ✅ 改用 SDK
    var result = await supabaseClientInstance
      .from('live_posts')
      .insert({
        id: post.id,
        track: post.track,
        store_id: post.store_id,
        store_name: post.store_name || '',
        store_region: post.store_region || '',
        content: post.content || '',
        tags: post.tags || [],
        photo: post.photo || '',

        author_device: STATE.user.device,
        author_user_id: STATE.user.user_id || null,
        ts: post.ts,
        expire: post.expire,
        likes: post.likes || [],
        likeCount: post.likeCount || 0,
        is_linked: post.is_linked || false,
        link_days: post.link_days || 0,
        gps_lat: post.gps_lat || null,
        gps_lng: post.gps_lng || null
      });
    
    if (result.error) throw result.error;

      store_region: post.store_region || '',

async function processPendingPosts() {
  if (!CLOUD_ON || !STATE._pendingPosts || STATE._pendingPosts.length === 0) return;
  
  const pending = STATE._pendingPosts.slice();
  let syncedCount = 0;
  
  for (const post of pending) {
    const success = await syncLivePost(post);
    if (success) {
      syncedCount++;
      STATE._pendingPosts = STATE._pendingPosts.filter(p => p.id !== post.id);
    }
  }
  
  if (syncedCount > 0) {
    save();
    console.log(`✅ 已同步 ${syncedCount} 篇待同步貼文`);
  }
}

function getAchievementProgress(key) {
  var state = getAchievementState();
  var def = ACHIEVEMENT_DEFS[key];
  if (!def) return { current: 0, required: 0, percentage: 0, isUnlocked: false };
  var stats = state.stats;
  var unlocked = state.unlocked || [];
  var current = 0, required = def.condition.count;
  
  switch (def.condition.type) {
    case 'submit_store': current = stats.submit_store || 0; break;
    case 'verify_store': current = stats.verify_store || 0; break;
    case 'store_complete': current = stats.store_complete || 0; break;
    case 'region_hk_island': current = stats.region_hk_island || 0; break;
    case 'region_kowloon': current = stats.region_kowloon || 0; break;
    case 'region_nt': current = stats.region_nt || 0; break;
    case 'region_all': current = unlocked.includes('hk_island') && unlocked.includes('kowloon') && unlocked.includes('nt') ? 1 : 0; break;
    case 'supplement': current = stats.supplement || 0; break;
    case 'perfect_file': current = stats.perfect_file || 0; break;
    case 'streak': current = stats.streak_days || 0; break;
    case 'weekly_perfect': current = stats.weekly_perfect || 0; break;
    case 'monthly_perfect': current = stats.monthly_perfect || 0; break;
    case 'cold_region_verify': current = stats.cold_region_verify || 0; break;
        case 'report_submitted': current = stats.report_submitted || 0; break;
    case 'report_confirmed': current = stats.report_confirmed || 0; break;
    default: break;
  }
  
  var isUnlocked = unlocked.includes(key);
  var percentage = Math.min(100, Math.round((current / required) * 100));
  return { current: current, required: required, percentage: percentage, isUnlocked: isUnlocked };
}

function checkAchievements() {
  var state = getAchievementState();
  var unlocked = state.unlocked || [];
  var newUnlocks = [];
  
  Object.keys(ACHIEVEMENT_DEFS).forEach(function(key) {
    if (unlocked.includes(key)) return;
    var def = ACHIEVEMENT_DEFS[key];
    var stats = state.stats;
    var isUnlocked = false;
    
    switch (def.condition.type) {
      case 'submit_store': if (stats.submit_store >= def.condition.count) isUnlocked = true; break;
      case 'verify_store': if (stats.verify_store >= def.condition.count) isUnlocked = true; break;
      case 'store_complete': if (stats.store_complete >= def.condition.count) isUnlocked = true; break;
      case 'region_hk_island': if (stats.region_hk_island >= def.condition.count) isUnlocked = true; break;
      case 'region_kowloon': if (stats.region_kowloon >= def.condition.count) isUnlocked = true; break;
      case 'region_nt': if (stats.region_nt >= def.condition.count) isUnlocked = true; break;
      case 'region_all': if (unlocked.includes('hk_island') && unlocked.includes('kowloon') && unlocked.includes('nt')) isUnlocked = true; break;
      case 'supplement': if (stats.supplement >= def.condition.count) isUnlocked = true; break;
      case 'perfect_file': if (stats.perfect_file >= def.condition.count) isUnlocked = true; break;
      case 'streak': if (stats.streak_days >= def.condition.count) isUnlocked = true; break;
      case 'weekly_perfect': if (stats.weekly_perfect >= def.condition.count) isUnlocked = true; break;
      case 'monthly_perfect': if (stats.monthly_perfect >= def.condition.count) isUnlocked = true; break;
      case 'cold_region_verify': if (stats.cold_region_verify >= def.condition.count) isUnlocked = true; break;
            case 'report_submitted': if (stats.report_submitted >= def.condition.count) isUnlocked = true; break;
      case 'report_confirmed': if (stats.report_confirmed >= def.condition.count) isUnlocked = true; break;
      default: break;
    }
    
    if (isUnlocked) {
      unlocked.push(key);
      newUnlocks.push(key);
      if (def.reward.points > 0) {
        addPoints(def.reward.points, '解鎖成就：' + def.name);
      }
      if (def.reward.title) {
        if (!STATE.titles) STATE.titles = [];
        if (!STATE.titles.includes(def.reward.title)) STATE.titles.push(def.reward.title);
      }
      showAchievementUnlock(def);
      
      if (CLOUD_ON) {
        var userId = STATE.user.user_id || STATE.user.device;
        fetch(SUPABASE_URL + "/rest/v1/user_achievements", {
    method: 'POST',
    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
    body: JSON.stringify([{
        user_id: userId,
        achievement_key: key,
        achievement_name: def.name,
        unlocked_at: new Date().toISOString()
    }])
}).catch(function(e) {
    console.warn('⚠️ user_achievements 寫入失敗:', e.message);
});
      }
    }
  });
  
  STATE.achievements.unlocked = unlocked;
  save();
}

function updateStreak() {
  var state = getAchievementState();
  var today = todayKey();
  var yesterday = new Date();
  yesterday.setDate(yesterday.getDate() - 1);
  var yesterdayKey = yesterday.toISOString().slice(0, 10);
  
  if (state.stats.last_active_date === today) return;
  if (state.stats.last_active_date === yesterdayKey) state.stats.streak_days += 1;
  else if (state.stats.last_active_date !== today) state.stats.streak_days = 1;
  state.stats.last_active_date = today;
  
  var dayOfWeek = new Date().getDay();
  var weekDay = dayOfWeek === 0 ? 7 : dayOfWeek;
  if (!state.stats.weekly_days.includes(weekDay)) {
    state.stats.weekly_days.push(weekDay);
    if (state.stats.weekly_days.length === 7) {
      updateAchievementStat('weekly_perfect', 1);
      state.stats.weekly_days = [];
    }
  }
  
  var dayOfMonth = new Date().getDate();
  if (!state.stats.monthly_days.includes(dayOfMonth)) {
    state.stats.monthly_days.push(dayOfMonth);
    if (state.stats.monthly_days.length === 30 || state.stats.monthly_days.length === 31) {
      updateAchievementStat('monthly_perfect', 1);
      state.stats.monthly_days = [];
    }
  }
  
  save();
  checkAchievements();
}

function updateCheckinStreak() {

  if (!STATE.achievements.stats) STATE.achievements.stats = {};

function getUserLevel() {

    { level: 1, title: '新手爪友', xp: 0 },
    { level: 2, title: '見習爪客', xp: 50 },
    { level: 3, title: '探索爪客', xp: 150 },
    { level: 4, title: '情報爪客', xp: 300 },
    { level: 5, title: '資深爪客', xp: 500 },
    { level: 6, title: '偵查爪客', xp: 800 },
    { level: 7, title: '獵人爪客', xp: 1200 },
    { level: 8, title: '金牌爪客', xp: 1800 },
    { level: 9, title: '傳說爪客', xp: 2500 },
    { level: 10, title: '爪皇', xp: 3500 }
  ];
  var currentLevel = levels[0], nextLevel = levels[1];
  for (var i = levels.length - 1; i >= 0; i--) {
    if (xp >= levels[i].xp) {
      currentLevel = levels[i];
      nextLevel = levels[i + 1] || null;
      break;
    }
  }
  return {
    level: currentLevel.level,
    title: currentLevel.title,
    xp: xp,
    xpForCurrent: currentLevel.xp,
    xpForNext: nextLevel ? nextLevel.xp : xp,
    nextTitle: nextLevel ? nextLevel.title : null,
    percentage: nextLevel ? Math.min(100, Math.round(((xp - currentLevel.xp) / (nextLevel.xp - currentLevel.xp)) * 100)) : 100
  };
}

const CheckinManager = {
  getTodayKey() {
    return new Date().toISOString().slice(0, 10);
  },
  getReminderKey() {
    return 'claw_reminder_' + this.getTodayKey();
  },
  hasShownToday() {
    return localStorage.getItem(this.getReminderKey()) === 'true';
  },
  markShownToday() {
    localStorage.setItem(this.getReminderKey(), 'true');
  },
  
  async isCheckedInToday() {
    const today = this.getTodayKey();
    const deviceId = STATE.user.device;
    
    if (!CLOUD_ON) {
      const progress = getWeeklyCheckinProgress();
      return progress.isTodaySigned;
    }
    
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/user_checkins?select=id&device_id=eq.${deviceId}&checkin_date=eq.${today}&limit=1`,
        { headers: getSupabaseHeaders() }
      );

      return data.length > 0;
    } catch (e) {
      console.warn('⚠️ 檢查簽到失敗，使用本地:', e.message);
      const progress = getWeeklyCheckinProgress();
      return progress.isTodaySigned;
    }
  },
  
  async doCheckin() {
    const today = this.getTodayKey();
    const deviceId = STATE.user.device;
    const userId = STATE.user.user_id || null;
    
    const alreadyChecked = await this.isCheckedInToday();
    if (alreadyChecked) {
      toast('今日已簽到，明天再來吧！', 'gold');
      return false;
    }
    
    const progress = getWeeklyCheckinProgress();
    const daysSigned = progress.count + 1;
    let bonus = 5;
    let bonusMsg = '基礎簽到 +5 分';
    if (daysSigned === 3) {
      bonus += 5;
      bonusMsg = '連續 3 天！額外 +5 分 🎉';
    } else if (daysSigned === 5) {
      bonus += 5;
      bonusMsg = '連續 5 天！額外 +5 分 🎉🎉';
    } else if (daysSigned === 7) {
      bonus += 15;
      bonusMsg = '🎊 本週全勤！額外 +15 分 🎊';
    }
    
    if (CLOUD_ON) {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/user_checkins`, {
          method: 'POST',
          headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
          body: JSON.stringify([{
            device_id: deviceId,
            user_id: userId,
            checkin_date: today,
            created_at: new Date().toISOString()
          }])
        });
        if (!response.ok) {
          if (response.status === 409) {
            toast('今日已簽到', 'gold');
            return false;
          }
          throw new Error(`HTTP ${response.status}`);
        }
        console.log('✅ 簽到已同步到雲端');
      } catch (e) {
        console.warn('⚠️ 雲端同步失敗，儲存到本地:', e.message);
        this._saveLocal(today);
      }
    } else {
      this._saveLocal(today);
    }
    
    this._updateLocalState(today);
    await addPoints(bonus, `簽到 (第 ${daysSigned} 天)`);
    updateAchievementStat('checkin', 1);
    updateStreak();
    this.markShownToday();
    
    // 記錄任務進度 (打卡)
    await recordTaskCompletion('checkin');
    
    toast(`✅ 簽到成功！獲得 ${bonus} 分（${bonusMsg}）`, 'green');
        // ✅ 檢查是否連續簽到 7 天
    var weeklyProgress = getWeeklyCheckinProgress();

    return true;

  _saveLocal(today) {
    const weekStart = getWeekStartDate(new Date());
    const weekKey = weekStart.toISOString().slice(0, 10);
    if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
    if (!STATE.weeklyCheckin[weekKey]) {
      STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
    }
    const dayOfWeek = new Date().getDay();
    const todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
    if (!STATE.weeklyCheckin[weekKey].days.includes(todayNum)) {
      STATE.weeklyCheckin[weekKey].days.push(todayNum);
    }
    save();
  },
  
  _updateLocalState(today) {

    const weekKey = weekStart.toISOString().slice(0, 10);
    const dayOfWeek = new Date().getDay();
    const todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
    if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
    if (!STATE.weeklyCheckin[weekKey]) {
      STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
    }
    if (!STATE.weeklyCheckin[weekKey].days.includes(todayNum)) {
      STATE.weeklyCheckin[weekKey].days.push(todayNum);
    }
    save();
  },
  
  async checkAndShowReminder() {

    console.log('📅 今日尚未簽到，顯示提醒');
    setTimeout(() => {
      showCheckinReminder();
      this.markShownToday();
    }, 2000);
  },
  
  async syncFromCloud() {
    const deviceId = STATE.user.device;
    const today = new Date();
    const weekStart = getWeekStartDate(today);
    const weekStartStr = weekStart.toISOString().slice(0, 10);
    const todayStr = today.toISOString().slice(0, 10);
    
    if (!CLOUD_ON) return;
    
    try {
      const response = await fetch(
        `${SUPABASE_URL}/rest/v1/user_checkins?select=checkin_date&device_id=eq.${deviceId}&checkin_date=gte.${weekStartStr}&checkin_date=lte.${todayStr}`,
        { headers: getSupabaseHeaders() }
      );
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const data = await response.json();
      const days = data.map(item => {
        const date = new Date(item.checkin_date);
        const day = date.getDay();
        return day === 0 ? 7 : day;
      });
      
      const weekKey = weekStartStr;
      if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
      STATE.weeklyCheckin[weekKey] = {
        days: days,
        claimed: days.length >= 7
      };
      
      const todayNum = today.getDay() === 0 ? 7 : today.getDay();
      if (days.includes(todayNum)) {
        this.markShownToday();
      }
      
      save();
      console.log('📅 簽到狀態已同步，本週簽到:', days.length, '天');
    } catch (e) {
      console.warn('⚠️ 同步簽到失敗:', e.message);
    }
  }
};

function getWeekStartDate(date) {
  var d = new Date(date);
  var day = d.getDay();
  var diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function getWeeklyCheckinProgress() {
  var today = new Date();
  var weekStart = getWeekStartDate(today);
  var weekKey = weekStart.toISOString().slice(0, 10);
  if (!STATE.weeklyCheckin) STATE.weeklyCheckin = {};
  if (!STATE.weeklyCheckin[weekKey]) {
    STATE.weeklyCheckin[weekKey] = { days: [], claimed: false };
  }
  var weekData = STATE.weeklyCheckin[weekKey];
  var dayOfWeek = today.getDay();
  var todayNum = dayOfWeek === 0 ? 7 : dayOfWeek;
  var isTodaySigned = weekData.days.includes(todayNum);
  return {
    days: weekData.days,
    count: weekData.days.length,
    isTodaySigned: isTodaySigned,
    weekKey: weekKey,
    isComplete: weekData.days.length >= 7
  };
}

async function submitReport(targetType, targetId) {

            target_id: targetId,

            reporter_user_id: STATE.user.user_id || null,
            category: category,
            reason: reason,
            status: 'pending',
            created_at: new Date().toISOString()
        };
        
        if (CLOUD_ON) {
            try {
                var response = await fetch(SUPABASE_URL + "/rest/v1/reports", {
                    method: 'POST',
                    headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
                    body: JSON.stringify([reportData])
                });
                
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status);
                }
                
                STATE._reportCount = (STATE._reportCount || 0) + 1;
                save();
                
                toast('✅ 檢舉已提交，感謝你的回報！', 'green');
                closeModal();
            } catch (e) {
                console.error('❌ 檢舉提交失敗:', e);
                // 離線儲存
                if (!STATE._offlineReports) STATE._offlineReports = [];
                STATE._offlineReports.push(reportData);
                STATE._reportCount = (STATE._reportCount || 0) + 1;
                save();
                toast('⚠️ 檢舉已記錄（離線），連網後將自動提交', 'green');
                closeModal();
            }
        } else {
            if (!STATE._offlineReports) STATE._offlineReports = [];
            STATE._offlineReports.push(reportData);
            STATE._reportCount = (STATE._reportCount || 0) + 1;
            save();
            toast('✅ 檢舉已記錄（離線），連網後將自動提交', 'green');
            closeModal();
            await recordRegionContribution('report', store.region, targetId);
        }

// 處理離線檢舉自動上傳 (P3)
async function processOfflineReports() {
  if (!CLOUD_ON || !STATE._offlineReports || STATE._offlineReports.length === 0) return;
  
  const pending = STATE._offlineReports.slice();
  let syncedCount = 0;
  
  for (const report of pending) {
    try {
      const response = await fetch(SUPABASE_URL + "/rest/v1/reports", {
        method: 'POST',
        headers: getSupabaseHeaders({ 'Prefer': 'return=minimal' }),
        body: JSON.stringify([report])
      });
      
      if (response.ok) {
        syncedCount++;
        STATE._offlineReports = STATE._offlineReports.filter(r => r !== report);
      }
    } catch (e) {
      console.warn('⚠️ 離線檢舉上傳失敗:', e.message);
    }
  }
  
  if (syncedCount > 0) {
    save();
    console.log(`✅ 已上傳 ${syncedCount} 筆離線檢舉`);
  }
}

async function bindGoogleAccount() {

async function checkOAuthCallback() {
  var params = new URLSearchParams(window.location.hash.substring(1));
  var accessToken = params.get('access_token');
  var refreshToken = params.get('refresh_token');
  
  if (accessToken) {
    console.log('🔐 檢測到 OAuth/Magic Link 回調，正在處理...');
    try {
      var result = await supabaseClientInstance.auth.setSession({
        access_token: accessToken,
        refresh_token: refreshToken || ''
      });
      if (result.error) throw result.error;
      var userResult = await supabaseClientInstance.auth.getUser();
      if (userResult.error) throw userResult.error;
      await syncUserDataAfterBind(userResult.data.user);
      window.history.replaceState({}, '', window.location.pathname);
    } catch (error) {
      console.error('OAuth/Magic Link 回調處理錯誤:', error);
      toast('❌ 登入失敗：' + error.message, 'pink');
    }
  }
}

// ============================================================
async function mergeLocalAndCloudData(cloudProfile, cloudFavorites, cloudRegionContributions, cloudAchievements, cloudTaskProgress, cloudCheckins) {
    
    var mergeResult = {
        points: STATE.points || 0,
        total_xp: STATE.total_xp || 0,
        favStores: STATE.favStores || [],
        favMachines: STATE.favMachines || [],
        achievements: STATE.achievements || { unlocked: [], stats: {} },
        taskProgress: STATE.taskProgress || {},
        weeklyCheckin: STATE.weeklyCheckin || {},
        titles: STATE.titles || []
    };
    
    // ========== 1. 積分合併（取較大值） ==========
    if (cloudProfile && cloudProfile.total_points !== undefined) {
        mergeResult.points = Math.max(STATE.points || 0, cloudProfile.total_points || 0);
    }
    
    // ========== 2. XP 合併（取較大值） ==========
    if (cloudProfile && cloudProfile.total_xp !== undefined) {
        mergeResult.total_xp = Math.max(STATE.total_xp || 0, cloudProfile.total_xp || 0);
    }
    
    // ========== 3. 稱號合併（聯集） ==========
    var localTitles = STATE.titles || [];
    var cloudTitles = [];
    if (cloudProfile && cloudProfile.titles && Array.isArray(cloudProfile.titles)) {
        cloudTitles = cloudProfile.titles;
    }
    var mergedTitles = localTitles.slice();
    for (var ti = 0; ti < cloudTitles.length; ti++) {
        if (mergedTitles.indexOf(cloudTitles[ti]) === -1) {
            mergedTitles.push(cloudTitles[ti]);
        }
    }
    mergeResult.titles = mergedTitles;
    
    // ========== 4. 收藏合併（聯集） ==========
    var localFavStores = STATE.favStores || [];
    var cloudFavStores = [];
    if (cloudFavorites && cloudFavorites.stores) {
        cloudFavStores = cloudFavorites.stores.map(function(f) { return String(f.store_id); });
    }
    var mergedFavStores = localFavStores.slice();
    for (var fsi = 0; fsi < cloudFavStores.length; fsi++) {
        if (mergedFavStores.indexOf(cloudFavStores[fsi]) === -1) {
            mergedFavStores.push(cloudFavStores[fsi]);
        }
    }
    mergeResult.favStores = mergedFavStores;
    
    var localFavMachines = STATE.favMachines || [];
    var cloudFavMachines = [];
    if (cloudFavorites && cloudFavorites.machines) {
        cloudFavMachines = cloudFavorites.machines.map(function(f) { return String(f.machine_id); });
    }
    var mergedFavMachines = localFavMachines.slice();
    for (var fmi = 0; fmi < cloudFavMachines.length; fmi++) {
        if (mergedFavMachines.indexOf(cloudFavMachines[fmi]) === -1) {
            mergedFavMachines.push(cloudFavMachines[fmi]);
        }
    }
    mergeResult.favMachines = mergedFavMachines;
    
    // ========== 5. 成就解鎖合併（聯集） ==========
    var localUnlocked = (STATE.achievements && STATE.achievements.unlocked) || [];
    var cloudUnlocked = (cloudAchievements && cloudAchievements.unlocked) || [];
    var mergedUnlocked = localUnlocked.slice();
    for (var ui = 0; ui < cloudUnlocked.length; ui++) {
        if (mergedUnlocked.indexOf(cloudUnlocked[ui]) === -1) {
            mergedUnlocked.push(cloudUnlocked[ui]);
        }
    }
    mergeResult.achievements.unlocked = mergedUnlocked;
    
    // ========== 6. 成就統計合併（各項取較大值） ==========
    if (!mergeResult.achievements.stats) mergeResult.achievements.stats = {};
    var statKeys = [
        'submit_store', 'verify_store', 'supplement', 'store_complete',
        'region_hk_island', 'region_kowloon', 'region_nt',
        'perfect_file', 'streak_days', 'weekly_perfect', 'monthly_perfect',
        'cold_region_verify', 'report_submitted', 'report_confirmed',
        'checkin_streak'
    ];
    for (var si = 0; si < statKeys.length; si++) {
        var key = statKeys[si];
        var localVal = (STATE.achievements && STATE.achievements.stats && STATE.achievements.stats[key]) || 0;
        var cloudVal = (cloudAchievements && cloudAchievements.stats && cloudAchievements.stats[key]) || 0;
        mergeResult.achievements.stats[key] = Math.max(localVal, cloudVal);
    }
    
    // ========== 7. 地區貢獻合併（各區取較大值） ==========
    var cloudRegionStats = {
        region_hk_island: 0,
        region_kowloon: 0,
        region_nt: 0
    };
    if (cloudRegionContributions && Array.isArray(cloudRegionContributions)) {
        cloudRegionContributions.forEach(function(c) {
            var regionKey = '';
            if (c.region_group === 'hk') regionKey = 'region_hk_island';
            else if (c.region_group === 'kl') regionKey = 'region_kowloon';
            else if (c.region_group === 'nt') regionKey = 'region_nt';
            if (regionKey) {
                cloudRegionStats[regionKey] += (c.contribution_value || 0);
            }
        });
    }
    for (var rk in cloudRegionStats) {
        mergeResult.achievements.stats[rk] = Math.max(
            mergeResult.achievements.stats[rk] || 0,
            cloudRegionStats[rk] || 0
        );
    }
    
    // ========== 8. 每日任務進度合併（各項取較大值） ==========
    var today = todayKey();
    var localTask = (STATE.taskProgress && STATE.taskProgress[today]) || {};
    var cloudTask = (cloudTaskProgress && cloudTaskProgress[today]) || {};
    
    if (!mergeResult.taskProgress[today]) mergeResult.taskProgress[today] = {};
    var taskKeys = ['submit_store', 'verify_store', 'supplement', 'checkin', 'machine_checkin', 'share'];
    for (var tki = 0; tki < taskKeys.length; tki++) {
        var taskKey = taskKeys[tki];
        mergeResult.taskProgress[today][taskKey] = Math.max(
            (localTask[taskKey] || 0),
            (cloudTask[taskKey] || 0)
        );
    }
    mergeResult.taskProgress[today].total_points = Math.max(
        (localTask.total_points || 0),
        (cloudTask.total_points || 0)
    );
    mergeResult.taskProgress[today].goal_reached = (localTask.goal_reached || false) || (cloudTask.goal_reached || false);
    
    // ========== 9. 簽到記錄合併（聯集） ==========
    var weekStart = getWeekStartDate(new Date());
    var weekKey = weekStart.toISOString().slice(0, 10);
    if (!mergeResult.weeklyCheckin[weekKey]) {
        mergeResult.weeklyCheckin[weekKey] = { days: [], claimed: false };
    }
    if (STATE.weeklyCheckin && STATE.weeklyCheckin[weekKey] && STATE.weeklyCheckin[weekKey].days) {
        STATE.weeklyCheckin[weekKey].days.forEach(function(day) {
            if (mergeResult.weeklyCheckin[weekKey].days.indexOf(day) === -1) {
                mergeResult.weeklyCheckin[weekKey].days.push(day);
            }
        });
    }
    if (cloudCheckins && Array.isArray(cloudCheckins)) {
        cloudCheckins.forEach(function(checkin) {
            var date = new Date(checkin.checkin_date);
            var day = date.getDay();
            var dayNum = day === 0 ? 7 : day;
            if (mergeResult.weeklyCheckin[weekKey].days.indexOf(dayNum) === -1) {
                mergeResult.weeklyCheckin[weekKey].days.push(dayNum);
            }
        });
    }
    
    return mergeResult;
}

// ============================================================
// 登入後同步用戶數據（完整合併版）
// ============================================================
async function syncUserDataAfterBind(user) {
  try {
    var deviceId = STATE.user.device;
    var email = user.email || '';
    var displayName = user.user_metadata?.full_name || user.email?.split('@')[0] || '夾客';
    var avatarUrl = user.user_metadata?.avatar_url || '';
    var googleId = user.id;
    
    // 查詢是否已有此 Google 帳戶的記錄
    var existingResult = await supabaseClientInstance
      .from('user_profiles')
      .select('*')
      .eq('google_id', googleId)
      .maybeSingle();
    
    if (existingResult.error) throw existingResult.error;
    
    var existingUser = existingResult.data;
    if (existingUser && existingUser.extended_post_lifespan) {
        STATE.extendedPostLifespan = true;
        save();
    }
    var isNewUser = !existingUser;
    var userId = null;
    
    // ========== 讀取雲端資料（準備合併） ==========
    var cloudFavoritesStores = [];
    var cloudFavoritesMachines = [];
    var cloudRegionContributions = [];
    var cloudAchievements = { unlocked: [], stats: {} };
    var cloudTaskProgress = {};
    var cloudCheckins = [];
    
    if (existingUser) {
        userId = existingUser.id;
        
        try {
            // 讀取雲端收藏
            var favResult = await supabaseClientInstance
                .from('user_favorites')
                .select('store_id, machine_id')
                .eq('user_id', userId);
            if (!favResult.error && favResult.data) {
                favResult.data.forEach(function(f) {
                    if (f.store_id) cloudFavoritesStores.push(f);
                    if (f.machine_id) cloudFavoritesMachines.push(f);
                });
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端收藏失敗:', e.message);
        }
        
        try {
            // 讀取雲端地區貢獻
            var regionResult = await supabaseClientInstance
                .from('user_region_contributions')
                .select('*')
                .eq('user_id', userId);
            if (!regionResult.error && regionResult.data) {
                cloudRegionContributions = regionResult.data;
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端地區貢獻失敗:', e.message);
        }
        
        try {
            // 讀取雲端成就解鎖
            var achResult = await supabaseClientInstance
                .from('user_achievements')
                .select('achievement_key')
                .eq('user_id', userId);
            if (!achResult.error && achResult.data) {
                cloudAchievements.unlocked = achResult.data.map(function(a) { return a.achievement_key; });
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端成就失敗:', e.message);
        }
        
        try {
            // 讀取雲端成就統計
            var statsResult = await supabaseClientInstance
                .from('user_stats')
                .select('*')
                .eq('user_id', userId)
                .maybeSingle();
            if (!statsResult.error && statsResult.data) {
                cloudAchievements.stats = statsResult.data;
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端成就統計失敗:', e.message);
        }
        
        try {
            // 讀取雲端任務進度
            var today = todayKey();
            var taskResult = await supabaseClientInstance
                .from('task_progress')
                .select('*')
                .eq('user_id', userId)
                .eq('date', today)
                .maybeSingle();
            if (!taskResult.error && taskResult.data) {
                cloudTaskProgress[today] = taskResult.data;
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端任務進度失敗:', e.message);
        }
        
        try {
            // 讀取雲端簽到
            var weekStart = getWeekStartDate(new Date());
            var weekStartStr = weekStart.toISOString().slice(0, 10);
            var todayStr = todayKey();
            var checkinResult = await supabaseClientInstance
                .from('user_checkins')
                .select('checkin_date')
                .eq('device_id', deviceId)
                .gte('checkin_date', weekStartStr)
                .lte('checkin_date', todayStr);
            if (!checkinResult.error && checkinResult.data) {
                cloudCheckins = checkinResult.data;
            }
        } catch (e) {
            console.warn('⚠️ 讀取雲端簽到失敗:', e.message);
        }
    }
    
    // ========== 執行完整合併 ==========
    var mergedData = await mergeLocalAndCloudData(
        existingUser,
        { stores: cloudFavoritesStores, machines: cloudFavoritesMachines },
        cloudRegionContributions,
        cloudAchievements,
        cloudTaskProgress,
        cloudCheckins
    );
    
    // ========== 寫入合併結果到 STATE ==========
    STATE.points = mergedData.points;
    STATE.total_xp = mergedData.total_xp;
    STATE.favStores = mergedData.favStores;
    STATE.favMachines = mergedData.favMachines;
    STATE.achievements = mergedData.achievements;
    STATE.taskProgress = mergedData.taskProgress;
    STATE.weeklyCheckin = mergedData.weeklyCheckin;
    STATE.titles = mergedData.titles;
    
    // ========== 更新或建立雲端 user_profiles ==========
    if (existingUser) {
      var updates = {
        display_name: displayName,
        avatar_url: avatarUrl,
        total_points: mergedData.points,
        total_xp: mergedData.total_xp,
        last_active_at: new Date().toISOString(),
        is_anonymous: false
      };
      var updateResult = await supabaseClientInstance
        .from('user_profiles')
        .update(updates)
        .eq('id', userId);
      if (updateResult.error) throw updateResult.error;
    } else {
      var newUserData = {
        device_id: deviceId,
        google_id: googleId,
        email: email,
        display_name: displayName,
        avatar_url: avatarUrl,
        total_points: mergedData.points,
        total_xp: mergedData.total_xp,
        level: STATE.level || 1,
        is_anonymous: false,
        bound_at: new Date().toISOString(),
        created_at: new Date().toISOString(),
        last_active_at: new Date().toISOString()
      };
      var insertResult = await supabaseClientInstance
        .from('user_profiles')
        .insert(newUserData)
        .select()
        .single();
      if (insertResult.error) throw insertResult.error;
      userId = insertResult.data.id;
    }
    
    // ========== 更新 STATE.user ==========
    STATE.user.is_bound = true;
    STATE.user.email = email;
    STATE.user.google_id = googleId;
    STATE.user.user_id = userId;
    STATE.user.display_name = displayName;
    STATE.user.avatar_url = avatarUrl;
    
    save();
    
    // ========== 同步合併後的收藏到雲端 ==========
    if (mergedData.favStores.length > 0 || mergedData.favMachines.length > 0) {
      await syncFavorites(userId);
    }
    
    // ========== 同步合併後的成就到雲端 ==========
    if (mergedData.achievements.unlocked.length > 0) {
      await syncAchievements(userId);
    }
    
    // ========== 同步最近搜索 ==========
    if (STATE.recentRegions.length > 0) {
      await syncRecentRegions();
    }
    
    // ========== 同步任務進度 ==========
    await loadTaskProgressFromCloud();
    
    if (isNewUser) {
      addPoints(20, 'Google 帳號綁定獎勵');
      toast('✅ 帳號綁定成功！數據已雲端備份 (+20 分)', 'green');
    } else {
      toast('✅ 帳號登入成功！數據已合併同步', 'green');
    }
    
    if (CURRENT === 'map') {
      setTimeout(function() {
        if (map && mapInitialized) {
          map.invalidateSize(true);
          updateMapMarkers();
          updateMapList();
        }
      }, 500);
    }
    showView('me');
  } catch (error) {
    console.error('同步數據錯誤:', error);
    toast('⚠️ 綁定成功但數據同步失敗: ' + error.message, 'pink');
    STATE.user.is_bound = true;
    save();
  }
}

async function syncFavorites(userId) {
  try {
    for (var i = 0; i < STATE.favStores.length; i++) {
      await supabaseClientInstance.from('user_favorites').upsert(
        { user_id: userId, store_id: STATE.favStores[i], created_at: new Date().toISOString() },
        { onConflict: 'user_id, store_id' }
      );
    }
    for (var j = 0; j < STATE.favMachines.length; j++) {
      await supabaseClientInstance.from('user_favorites').upsert(
        { user_id: userId, machine_id: STATE.favMachines[j], created_at: new Date().toISOString() },
        { onConflict: 'user_id, machine_id' }
      );
    }
    console.log('✅ 收藏已同步');
  } catch (e) { console.warn('收藏同步失敗:', e); }
}

async function syncAchievements(userId) {
  if (isSyncingAchievements) return;
  if (!userId) return;
  try {
    isSyncingAchievements = true;
    var unlocked = STATE.achievements?.unlocked || [];
    if (unlocked.length === 0) return;
    for (var i = 0; i < unlocked.length; i++) {
      var key = unlocked[i];
      var def = ACHIEVEMENT_DEFS[key];
      if (!def) continue;
      var checkResult = await supabaseClientInstance.from('user_achievements').select('id').eq('user_id', userId).eq('achievement_key', key).maybeSingle();
      if (checkResult.error) continue;
      if (checkResult.data) continue;
      await supabaseClientInstance.from('user_achievements').insert({
        user_id: userId,
        achievement_key: key,
        achievement_name: def.name,
        unlocked_at: new Date().toISOString()
      });
    }
  } catch (e) {
    console.warn('成就同步失敗:', e);
  } finally {
    isSyncingAchievements = false;
  }
}

async function logoutGoogle() {
  if (!confirm('確定要登出嗎？本地數據仍會保留。')) return;
  try {
    var result = await supabaseClientInstance.auth.signOut();
    if (result.error) throw result.error;
    STATE.user.is_bound = false;
    STATE.user.google_id = null;
    STATE.user.email = null;
    STATE.user.user_id = null;
    STATE.user.display_name = null;
    STATE.user.avatar_url = null;
    save();
    toast('✅ 已登出', 'green');
    showView('me');
  } catch (e) { toast('登出失敗: ' + e.message, 'pink'); }
}

// ============================================================
// 檢查用戶是否被封鎖
// ============================================================
async function checkUserBanStatus() {
    if (!CLOUD_ON) return;
    
    var deviceId = STATE.user.device;
    
    try {
        var response = await fetch(
            SUPABASE_URL + "/rest/v1/user_profiles?select=banned_at,banned_by,ban_reason&device_id=eq." + encodeURIComponent(deviceId) + "&limit=1",
            { headers: getSupabaseHeaders() }
        );
        
        if (!response.ok) return;
        
        var data = await response.json();
        
        if (data && data.length > 0 && data[0].banned_at) {
            // 用戶被封鎖
            localStorage.setItem('claw_banned', JSON.stringify({
                banned: true,
                banned_at: data[0].banned_at,
                banned_by: data[0].banned_by || '',

function seedMachines(sid, seed) {
  var cnt = [3, 4, 2, 3, 5][seed % 5];
  var arr = [];
  for (var i = 0; i < cnt; i++) {
    var ageH = [2, 10, 60, 400, 26][(seed + i) % 5];
    arr.push({
      id: sid + "_m" + i,
      no: "A" + (i + 1),
      feats: [FEATURE_TAGS[(seed + i) % FEATURE_TAGS.length], FEATURE_TAGS[(seed + i + 4) % FEATURE_TAGS.length]],
      plays: [PLAY_TAGS[(seed + i) % PLAY_TAGS.length]],
      prize: ["chiikawa 公仔", "Sanrio 大布偶", "jellycat 茄子", "一番賞 A賞", "山系毛公仔"][(seed + i) % 5],
      updated: now() - ageH * HOUR,
      photo: ""
    });
  }
  return arr;
}

async function loadMalls() {
  if (!CLOUD_ON) return { hk: [], kl: [], nt: [] };
  if (MALLS_CACHE) return MALLS_CACHE;
  try {
    var response = await fetch(SUPABASE_URL + "/rest/v1/malls?select=*&order=name", {
      headers: getSupabaseHeaders()
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    var malls = await response.json();
    var grouped = { hk: [], kl: [], nt: [] };
    malls.forEach(function(m) {
      if (m.region === '港島區') grouped.hk.push(m);
      else if (m.region === '九龍區') grouped.kl.push(m);
      else if (m.region === '新界區') grouped.nt.push(m);
    });
    MALLS_CACHE = grouped;
    return grouped;
  } catch (e) {
    console.error('載入商場失敗:', e);
    return { hk: [], kl: [], nt: [] };
  }
}

// 2. 添加轉換函數
function convertGeoJSONToRegions(geojson) {
    const regions = {};
    
    geojson.features.forEach(feature => {
        const props = feature.properties;
        const coords = feature.geometry.coordinates[0].map(coord => [
            coord[1], // lat
            coord[0]  // lng
        ]);
        
        // 使用地區號碼作為 key
        regions[props['地區號碼'].toLowerCase()] = {
            label: props['地區'],
            districtCode: props['地區號碼'],
            color: getColorByDistrict(props['地區']),
            borderColor: getBorderColorByDistrict(props['地區']),
            coords: coords
        };
    });
    
    return regions;
}

            smoothFactor: 1,
            className: 'region-polygon'
        }).addTo(map);
        
        // 儲存引用
        window._regionPolygons.push(polygon);
    }
    
    // 根據當前 zoom 添加對應的標籤
    updateRegionLabels();
}

// 計算多邊形中心點
// 計算多邊形的質心（考慮面積的加權平均）
function getPolygonCenter(coords) {
    var lat = 0, lng = 0, area = 0;
    
    for (var i = 0; i < coords.length - 1; i++) {
        var lat1 = coords[i][0];
        var lng1 = coords[i][1];
        var lat2 = coords[i + 1][0];
        var lng2 = coords[i + 1][1];
        
        var cross = (lng1 * lat2) - (lng2 * lat1);
        area += cross;
        lat += (lat1 + lat2) * cross;
        lng += (lng1 + lng2) * cross;
    }
    
    area *= 0.5;
    if (Math.abs(area) < 0.00001) {
        // 如果面積太小，退回算術平均
        return getArithmeticCenter(coords);
    }
    
    return {
        lat: lat / (6 * area),
        lng: lng / (6 * area)
    };
}

    for (var i = 0; i < coords.length; i++) {

        lngSum += coords[i][1];
    }
    return {
        lat: latSum / coords.length,
        lng: lngSum / coords.length
    };
}

function handleMapPopupClick(e) {

function addUserMarker(lat, lng) {
  if (!map) return;
  if (userMarker) { 
    map.removeLayer(userMarker);
    userMarker = null; 
  }
  userMarker = L.marker([lat, lng], {
    icon: L.divIcon({ className: 'custom-marker-user', iconSize: [18, 18], iconAnchor: [9, 9] }),
    zIndexOffset: 1000,
    interactive: false
  }).addTo(map);
  
  // ✅ 如果沒有在追蹤，開始追蹤
  if (gpsWatchId === null && navigator.geolocation) {
    startGpsWatch();
  }
}

// 開始 GPS 自動追蹤
function startGpsWatch() {
    // 如果已經在追蹤，先停止
    stopGpsWatch();
    
    if (!navigator.geolocation) {
        console.warn('⚠️ 此裝置不支援 GPS 定位');
        return;
    }
    
    console.log('📍 開始 GPS 自動追蹤');
    
    gpsWatchId = navigator.geolocation.watchPosition(
        function(pos) {
            var newLat = pos.coords.latitude;
            var newLng = pos.coords.longitude;
            
            // 更新全域變數
            userLocation = { lat: newLat, lng: newLng };
            gpsLat = newLat;
            gpsLng = newLng;
            isGpsReady = true;
            
            // 更新地圖上的用戶標記
            if (map && mapInitialized) {
                addUserMarker(newLat, newLng);
                updateMapList();
                updateRegionProgress();
            }
            
            console.log('📍 GPS 更新:', newLat.toFixed(6), newLng.toFixed(6));
        },
        function(err) {
            console.warn('⚠️ GPS 追蹤失敗:', err.message);
        },
        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 5000  // 允許使用 5 秒內的快取
        }
    );
}

// 停止 GPS 自動追蹤
function stopGpsWatch() {
    if (gpsWatchId !== null) {
        navigator.geolocation.clearWatch(gpsWatchId);
        gpsWatchId = null;
        console.log('📍 已停止 GPS 自動追蹤');
    }
}

function getStoresInBounds() {
  if (!map) return STORES.filter(function(s) { return s.lat && s.lng; });
  var bounds = map.getBounds();
  if (!bounds) return STORES.filter(function(s) { return s.lat && s.lng; });
  var sw = bounds.getSouthWest();
  var ne = bounds.getNorthEast();
  return STORES.filter(function(s) {
    if (!s.lat || !s.lng) return false;
    return s.lat >= sw.lat && s.lat <= ne.lat && s.lng >= sw.lng && s.lng <= ne.lng;
  });
}

function ensureStoresVisible() {
  if (CURRENT !== 'map') return;
  if (!map) return;
  if (ensureStoresTimeout) {
    clearTimeout(ensureStoresTimeout);
    ensureStoresTimeout = null;
  }
  if (ensureStoresRetryCount > MAX_ENSURE_RETRIES) {
    ensureStoresRetryCount = 0;
    return;
  }
  var allStores = STORES.filter(function(s) { return s.lat && s.lng; });
  if (allStores.length === 0) return;
  if (!map.getContainer()) {
    ensureStoresTimeout = setTimeout(ensureStoresVisible, 500);
    return;
  }
  try {
    var bounds = map.getBounds();
    if (!bounds) return;
    var sw = bounds.getSouthWest();
    var ne = bounds.getNorthEast();
    var latRange = ne.lat - sw.lat;
    var lngRange = ne.lng - sw.lng;
    if (latRange < 0.0001 || lngRange < 0.0001) {
      ensureStoresRetryCount++;
      if (allStores.length > 0 && CURRENT === 'map') {
        var avgLat = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lat); }, 0) / allStores.length;
        var avgLng = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lng); }, 0) / allStores.length;
        map.setView([avgLat, avgLng], 12);
      }
      ensureStoresTimeout = setTimeout(ensureStoresVisible, 500);
      return;
    }
    ensureStoresRetryCount = 0;
    var visibleStores = allStores.filter(function(s) {
      return s.lat >= sw.lat && s.lat <= ne.lat && s.lng >= sw.lng && s.lng <= ne.lng;
    });
    var currentZoom = Math.round(map.getZoom());
    if (visibleStores.length === 0 && currentZoom <= 11 && CURRENT === 'map') {
      var avgLat_1 = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lat); }, 0) / allStores.length;
      var avgLng_1 = allStores.reduce(function(sum, s) { return sum + parseFloat(s.lng); }, 0) / allStores.length;
      map.setView([avgLat_1, avgLng_1], 12);
      setTimeout(function() {
        if (CURRENT === 'map') {
          updateMapMarkers();
          updateMapList();
          updateRegionProgress();
        }
      }, 300);
    }
    if (visibleStores.length > 0 && CURRENT === 'map') {
      updateMapMarkers();
      updateMapList();
      updateRegionProgress();
    }
  } catch (e) {
    ensureStoresRetryCount++;
    if (ensureStoresRetryCount <= MAX_ENSURE_RETRIES) {
      ensureStoresTimeout = setTimeout(ensureStoresVisible, 1000);
    }
  }
}

function calculateDistance(lat1, lon1, lat2, lon2) {
  var R = 6371;
  var dLat = (lat2 - lat1) * Math.PI / 180;
  var dLon = (lon2 - lon1) * Math.PI / 180;
  var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
  var c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return R * c;
}

// ========== 機台快照 HTML ==========
function buildMachineSnapshot(s) {
    if (!s.machines || s.machines.length === 0) {
        return '<div class="mt-4">' +
            '<div class="flex items-center justify-between">' +
                '<h3 class="text-sm font-black text-neongreen neon-green">🎰 現場機台快照</h3>' +
                '<span class="text-[10px] text-white/30">點擊照片放大</span>' +
            '</div>' +
            '<p class="py-6 text-center text-xs text-white/40">尚無機台</p>' +
        '</div>';
    }
    
    var machineCards = [];
    for (var mi = 0; mi < s.machines.length; mi++) {
        var m = s.machines[mi];
        var isFresh = (now() - m.updated < 24 * HOUR);
        var isMedium = (now() - m.updated < 3 * DAY);
        var isOld = (now() - m.updated < 7 * DAY);
        var isVeryOld = (now() - m.updated < 14 * DAY);
        
        var borderColor = '#00FF00';
        var borderWidth = '2px';
        var glow = 'glow-green';
        var freshLabel = '';
        
        if (isFresh) {
            borderColor = '#00FF00';
            glow = 'glow-green';
            freshLabel = '<span class="text-[9px] text-neongreen">🟢 ' + timeAgo(m.updated) + '</span>';
        } else if (isMedium) {
            borderColor = '#00CC66';
            glow = '';
            freshLabel = '<span class="text-[9px] text-neongreen">🟢 ' + timeAgo(m.updated) + '</span>';
        } else if (isOld) {
            borderColor = '#FFB800';
            glow = '';
            freshLabel = '<span class="text-[9px] text-yellow-400">🟡 ' + timeAgo(m.updated) + '</span>';
        } else if (isVeryOld) {
            borderColor = '#FF8C00';
            glow = '';
            freshLabel = '<span class="text-[9px] text-orange-400">🟠 ' + timeAgo(m.updated) + '</span>';
        } else {
            borderColor = '#FF4444';
            glow = '';
            freshLabel = '<span class="text-[9px] text-red-400">🔴 ' + timeAgo(m.updated) + '</span>';
        }
        
        var photoHtml = m.photo ? 
            '<img src="' + m.photo + '" class="h-40 w-full rounded-lg object-cover cursor-pointer" onclick="openImageLightbox(\'' + m.photo + '\')" alt="機台 ' + m.no + '" />' : 
            '<div class="flex h-40 w-full items-center justify-center rounded-lg bg-black/50 text-5xl cursor-pointer" onclick="toast(\'此機台尚無照片\', \'gold\')">🎰</div>';
        
        var featsHtml = '';
        if (m.feats && m.feats.length > 0) {
            featsHtml = m.feats.slice(0, 3).map(function(f) {
                return '<span class="rounded bg-neonpink/15 px-1.5 py-0.5 text-[9px] text-neonpink">' + f + '</span>';
            }).join('');
        }
        
        var prizeText = m.prize || '待更新';
        var isFavMachine = STATE.favMachines.indexOf(m.id) !== -1;
        
        machineCards.push(
            '<div class="rounded-xl border p-2 text-left ' + glow + '" style="border-color:' + borderColor + ';border-width:' + borderWidth + ';background:#09090b;">' +
                '<div class="flex items-center justify-between mb-1">' +
                    '<b class="text-xs text-gold">台號 ' + m.no + '</b>' +
                    freshLabel +
                '</div>' +
                photoHtml +
                '<div class="mt-1.5 flex flex-wrap gap-1">' + featsHtml + '</div>' +
                '<p class="mt-1 truncate text-[10px] text-white/50">🎁 <span class="text-gold">' + prizeText + '</span></p>' +
                '<div class="mt-2 flex gap-1.5">' +
                    '<button onclick="openMachineForm(\'' + s.id + '\')" class="flex-1 rounded-lg bg-white/10 border border-gold/30 py-1.5 text-[10px] font-bold text-gold">📸 更新</button>' +
                    '<button onclick="toggleFavMachine(\'' + m.id + '\')" class="flex-1 rounded-lg bg-white/10 border border-neonpink/30 py-1.5 text-[10px] font-bold ' + (isFavMachine ? 'text-neonpink' : 'text-white/40') + '">' + (isFavMachine ? '❤️' : '🤍') + '</button>' +
                    '<button onclick="reportMachine(\'' + m.id + '\', \'' + m.no + '\')" class="flex-1 rounded-lg bg-white/10 border border-white/20 py-1.5 text-[10px] font-bold text-white/40">🚨</button>' +
                '</div>' +
            '</div>'
        );
    }
    
    return '<div class="mt-4">' +
        '<div class="flex items-center justify-between">' +
            '<h3 class="text-sm font-black text-neongreen neon-green">🎰 現場機台快照</h3>' +
            '<span class="text-[10px] text-white/30">點擊照片放大</span>' +
        '</div>' +
        '<div class="mt-3 grid grid-cols-2 gap-3">' +
            machineCards.join('') +
        '</div>' +
    '</div>';
}

// ========== 投票結果 HTML ==========
function buildFieldVoteDisplay(s) {
    var allVotes = window._allFieldVotes || [];
    var storeVotes = allVotes.filter(function(v) { return String(v.store_id) === String(s.id); });
    
    var fieldVoteHtml = '';
    VOTABLE_FIELDS.forEach(function(field) {
        var votes = storeVotes.filter(function(v) { return v.field_name === field.key; });
        if (votes.length === 0) return;
        
        var answerCounts = {};
        votes.forEach(function(v) {
            if (!answerCounts[v.answer]) answerCounts[v.answer] = 0;
            answerCounts[v.answer]++;
        });
        
        var sorted = Object.keys(answerCounts).sort(function(a, b) { return answerCounts[b] - answerCounts[a]; });
        var mainAnswer = sorted[0];
        var mainCount = answerCounts[mainAnswer];
        
        var icon = field.key === 'size' ? '📏' : field.key === 'has_staff' ? '👤' : field.key === 'has_e_coin' ? '🪙' : field.key === 'hour24' ? '🕐' : '🎟️';
        var answerDisplay = '';
        
        if (field.key === 'size') {
            answerDisplay = mainAnswer === 'small' ? '小型' : mainAnswer === 'large' ? '大型' : '中型';
        } else if (field.key === 'has_staff') {
            answerDisplay = mainAnswer === 'true' ? '有場務' : '無場務';
        } else if (field.key === 'has_e_coin') {
            answerDisplay = mainAnswer === 'true' ? '有電子兌幣' : '無電子兌幣';
        } else if (field.key === 'hour24') {
            answerDisplay = mainAnswer === 'true' ? '24小時' : '非24小時';
        } else if (field.key === 'token') {
            answerDisplay = mainAnswer === '5dollar' ? '用5元' : '用代幣';
        }
        
        fieldVoteHtml += '<span class="rounded bg-white/10 px-2 py-0.5 text-white/60 text-[11px]">' + icon + ' ' + mainCount + '人 ' + answerDisplay + '</span>';
    });
    
    return '<div class="mt-3 flex flex-wrap gap-2 text-[11px]">' + fieldVoteHtml + '</div>';
}

// ========== 收藏機台 ==========
function toggleFavMachine(machineId) {
    if (!requireLogin('收藏機台')) return;
    
    var arr = STATE.favMachines;
    var i = arr.indexOf(machineId);
    
    if (i >= 0) {
        arr.splice(i, 1);
        toast('已取消收藏', 'pink');
    } else {
        arr.push(machineId);
        toast('❤️ 已收藏機台', 'green');
    }
    
    save();
    
    // 刷新店鋪頁面
    var currentStoreId = STATE._currentViewingStore;
    if (currentStoreId) {
        updateStoreContent(currentStoreId);
    }
}

// ========== 回報機台 ==========
function reportMachine(machineId, machineNo) {
    if (!confirm('⚠️ 回報機台\n\n確定要回報台號 ' + machineNo + ' 的資訊不實或虛假內容嗎？')) return;
    
    if (!requireLogin('回報')) return;
    
    var reportData = {
        target_type: 'machine',
        target_id: machineId,
        reporter_device: STATE.user.device,
        reporter_user_id: STATE.user.user_id || null,
        category: 'machine_not_exist',
        reason: '機台資訊不實或虛假',
        status: 'pending',
        created_at: new Date().toISOString()
    };
    
    if (CLOUD_ON) {
        supabaseClientInstance
            .from('reports')
            .insert(reportData)
            .then(function() {
                toast('✅ 已回報，感謝你的貢獻', 'green');
            })
            .catch(function(e) {
                toast('回報失敗: ' + e.message, 'pink');
            });
    } else {
        toast('✅ 已回報（離線）', 'green');
    }
}
