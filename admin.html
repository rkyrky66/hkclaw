<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ 爪爪情報站 · 後台管理</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #D4AF37;
            --primary-dark: #B8941F;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-input: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --success: #00FF00;
            --warning: #FFB800;
            --danger: #FF007F;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 12px;
            --sidebar-width: 260px;
            --topbar-height: 64px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 0%, rgba(212,175,55,0.08), transparent 40%),
                        radial-gradient(circle at 80% 100%, rgba(255,0,127,0.05), transparent 40%),
                        var(--bg-dark);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon { font-size: 48px; margin-bottom: 8px; }
        .login-box h1 { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
        .login-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .login-error {
            background: rgba(255,0,127,0.12);
            border: 1px solid rgba(255,0,127,0.3);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.show { display: block; }
        
        .btn-google {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-google:hover { background: #f0f0f0; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
        .btn-google:active { transform: translateY(0); }
        
        .login-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        
        .login-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 12px; }
        .login-loading { display: none; text-align: center; color: var(--text-secondary); font-size: 14px; margin-top: 12px; }
        .login-loading.show { display: block; }
        .login-loading i { margin-right: 8px; }
        
        .admin-app { display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar-close {
            display: none;
            position: absolute;
            right: 12px;
            top: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .sidebar-close:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .brand-icon { font-size: 28px; }
        .brand-text { font-size: 18px; font-weight: 700; color: var(--primary); }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            position: relative;
        }
        .sidebar-nav .nav-item:hover { background: rgba(212,175,55,0.06); color: var(--text-primary); }
        .sidebar-nav .nav-item.active { color: var(--primary); border-left-color: var(--primary); background: rgba(212,175,55,0.08); }
        .sidebar-nav .nav-item i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar-nav .nav-item .badge {
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--border-color);
            color: var(--text-secondary);
        }
        .sidebar-nav .nav-item .badge.badge-warning { background: rgba(255,184,0,0.2); color: var(--warning); }
        .sidebar-nav .nav-item .badge.badge-danger { background: rgba(255,0,127,0.2); color: var(--danger); }
        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding: 16px 20px;
        }
        .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .admin-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(212,175,55,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .admin-details { flex: 1; min-width: 0; }
        .admin-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .admin-email { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(255,0,127,0.1);
            border: 1px solid rgba(255,0,127,0.2);
            border-radius: 8px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-logout:hover { background: rgba(255,0,127,0.2); }
        
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: var(--topbar-height);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .btn-toggle-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }
        .btn-toggle-sidebar:hover { color: var(--text-primary); }
        #page-title { font-size: 18px; font-weight: 700; }
        .top-bar-right { display: flex; align-items: center; gap: 20px; }
        .top-bar-stats { display: flex; gap: 16px; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 700; color: var(--text-primary); }
        .btn-refresh {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-refresh:hover { border-color: var(--primary); color: var(--primary); }
        
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 200px;
            color: var(--text-muted);
        }
        .loading-spinner i { font-size: 32px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 700; }
        .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .stat-card .number.gold { color: var(--primary); }
        .stat-card .number.green { color: var(--success); }
        .stat-card .number.red { color: var(--danger); }
        .stat-card .number.yellow { color: var(--warning); }
        
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-container td {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .table-container tr:last-child td { border-bottom: none; }
        .table-container tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-badge {
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
        .status-badge.confirmed { background: rgba(0,255,0,0.15); color: var(--success); }
        .status-badge.suspicious { background: rgba(255,184,0,0.15); color: var(--warning); }
        .status-badge.rejected { background: rgba(255,0,127,0.15); color: var(--danger); }
        .status-badge.field-suspicious { background: rgba(255,184,0,0.25); color: var(--warning); border: 1px solid var(--warning); }
        .status-badge.field-confirmed { background: rgba(0,255,0,0.15); color: var(--success); border: 1px solid var(--success); }
        .status-badge.missing { background: rgba(255,0,127,0.15); color: var(--danger); border: 1px dashed var(--danger); }
        .status-badge.hidden { background: rgba(0,0,0,0.3); color: var(--text-muted); border: 1px solid var(--text-muted); }
        
        .btn-sm {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm.primary { background: var(--primary); color: #000; border-color: var(--primary); }
        .btn-sm.primary:hover { background: var(--primary-dark); }
        .btn-sm.danger { border-color: var(--danger); color: var(--danger); }
        .btn-sm.danger:hover { background: rgba(255,0,127,0.1); }
        .btn-sm.warning { border-color: var(--warning); color: var(--warning); }
        .btn-sm.warning:hover { background: rgba(255,184,0,0.1); }
        .btn-sm.success { border-color: var(--success); color: var(--success); }
        .btn-sm.success:hover { background: rgba(0,255,0,0.1); }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 900px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 { font-size: 18px; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .btn-modal-cancel {
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .btn-modal-confirm {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-modal-confirm.danger { background: var(--danger); color: #fff; }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            animation: slideIn 0.3s ease;
            max-width: 360px;
        }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .field-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 4px;
            background: rgba(255,255,255,0.02);
        }
        .field-item .field-name { font-weight: 600; font-size: 13px; min-width: 80px; }
        .field-item .field-value { font-size: 13px; color: var(--text-secondary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .field-item .field-actions { display: flex; gap: 6px; flex-shrink: 0; align-items: center; flex-wrap: wrap; }
        .field-item .field-status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .field-item .field-status.status-pending { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .field-item .field-status.status-confirmed { background: rgba(0,255,0,0.15); color: var(--success); }
        .field-item .field-status.status-suspicious { background: rgba(255,184,0,0.2); color: var(--warning); }
        .field-item .field-status.status-missing { background: rgba(255,0,127,0.15); color: var(--danger); }
        .field-item .field-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--warning); }
        .field-item.border-suspicious { border-color: var(--warning); background: rgba(255,184,0,0.05); }
        .field-item.border-confirmed { border-color: var(--success); background: rgba(0,255,0,0.03); }
        .field-item.border-missing { border-color: var(--danger); background: rgba(255,0,127,0.03); border-style: dashed; }
        
        .section-header {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary);
            margin: 16px 0 8px 0;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border-color);
        }
        .section-header.danger {
            color: var(--danger);
            border-color: var(--danger);
        }
        
        .verification-compare {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin: 12px 0;
        }
        .verification-compare .compare-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
        }
        .verification-compare .compare-card .label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        .verification-compare .compare-card .photo {
            width: 100%;
            max-height: 150px;
            object-fit: cover;
            border-radius: 8px;
            margin: 4px 0;
        }
        .verification-compare .compare-card .gps {
            font-size: 11px;
            color: var(--text-secondary);
        }
        .verification-compare .compare-card .flag-checkbox {
            margin-top: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text-muted);
            flex-wrap: wrap;
        }
        .verification-compare .compare-card .flag-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--danger);
        }
        .verification-compare .compare-card.border-suspicious {
            border-color: var(--danger);
            background: rgba(255,0,127,0.05);
        }
        
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.show { display: block; }
        
        .admin-actions-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            padding: 12px;
            background: rgba(255,0,127,0.05);
            border-radius: var(--radius);
            border: 1px solid rgba(255,0,127,0.2);
            margin-top: 12px;
        }
        .admin-actions-bar .action-label {
            font-size: 12px;
            color: var(--danger);
            font-weight: 600;
            margin-right: 8px;
            display: flex;
            align-items: center;
        }
        
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .sidebar-close { display: block; }
            .main-content { margin-left: 0; }
            .btn-toggle-sidebar { display: block; }
            .top-bar-stats { display: none; }
            .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
            .login-box { padding: 32px 20px; margin: 16px; }
            .field-item { flex-wrap: wrap; gap: 4px; }
            .field-item .field-value { max-width: 100px; }
            .verification-compare { grid-template-columns: 1fr; }
            .modal-box { max-width: 98%; padding: 16px; }
        }
        @media (max-width: 480px) {
            .field-item .field-value { max-width: 60px; }
            .field-item .field-actions { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

<!-- ===== 登入頁面 ===== -->
<div id="login-page" class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="login-icon">🛡️</div>
            <h1>爪爪情報站</h1>
            <p class="login-subtitle">管理後台</p>
        </div>
        
        <div id="login-error" class="login-error"></div>
        
        <button onclick="handleGoogleLogin()" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>

<script>

// ============================================================
// 狀態
// ============================================================
var currentUser = null;
var currentTab = 'dashboard';
var modalCallback = null;
var isLoggingIn = false;
var currentViewStoreId = null;
// ============================================================
// Local 狀態管理（記憶體快取）
// ============================================================
var localStoreCache = {
    stores: [],           // { id, name, region, admin_overall_status, is_hidden, is_suspicious, ... }
    fieldStatuses: [],    // { id, table_name, record_id, field_name, status, ... }
    loadedAt: null,       // 載入時間
    isLoaded: false       // 是否已載入
};

// 從 local 快取取得待審核店鋪
function getLocalPendingStores() {
    return localStoreCache.stores.filter(function(s) {
        return !s.admin_overall_status || s.admin_overall_status === 'pending';
    });
}

// 從 local 快取取得待審核店鋪數量
function getLocalPendingCount() {
    return getLocalPendingStores().length;
}

// 從 local 快取取得存疑欄位數量
function getLocalFlaggedCount() {
    return localStoreCache.fieldStatuses.filter(function(fs) {
        return fs.status === 'suspicious' && (!fs.resolved || fs.resolved === false);
    }).length;
}

// 從 local 快取取得已確認店鋪數量
function getLocalConfirmedCount() {
    return localStoreCache.stores.filter(function(s) {
        return s.admin_overall_status === 'confirmed';
    }).length;
}

// 從 local 快取移除店鋪
function removeStoreFromLocalCache(storeId) {
    var numericId = parseInt(storeId);
    localStoreCache.stores = localStoreCache.stores.filter(function(s) {
        return s.id !== numericId;
    });
}

// 從 local 快取更新店鋪狀態
function updateStoreStatusInLocalCache(storeId, newStatus) {
    var numericId = parseInt(storeId);
    for (var i = 0; i < localStoreCache.stores.length; i++) {
        if (localStoreCache.stores[i].id === numericId) {
            localStoreCache.stores[i].admin_overall_status = newStatus;
            break;
        }
    }
}

// 從 local 快取更新欄位狀態
function updateFieldStatusInLocalCache(fieldStatusId, newStatus) {
    for (var i = 0; i < localStoreCache.fieldStatuses.length; i++) {
        if (localStoreCache.fieldStatuses[i].id === fieldStatusId) {
            localStoreCache.fieldStatuses[i].status = newStatus;
            localStoreCache.fieldStatuses[i].resolved = (newStatus === 'confirmed');
            break;
        }
    }
}

// 更新頂部計數（使用 local 快取）
function updateTopBarFromLocalCache() {
    document.getElementById('stat-pending').textContent = getLocalPendingCount();
    document.getElementById('stat-flagged').textContent = getLocalFlaggedCount();
    document.getElementById('stat-confirmed').textContent = getLocalConfirmedCount();
    document.getElementById('badge-stores').textContent = getLocalPendingCount();
    document.getElementById('badge-flagged').textContent = getLocalFlaggedCount();
}

// 從 Supabase 載入核心資料到 local 快取
async function loadCoreDataToLocalCache() {
    try {
        var results = await Promise.all([
            // 查詢所有店鋪（不限狀態）
            sb.from('claw_stores')
    .select('*')
    .order('created_at', { ascending: false }),
            // 查詢所有 field_status
            sb.from('field_status')
                .select('*')
                .eq('table_name', 'claw_stores')
        ]);
        
        if (results[0].error) throw results[0].error;
        if (results[1].error) throw results[1].error;
        
        localStoreCache.stores = results[0].data || [];
        localStoreCache.fieldStatuses = results[1].data || [];
        localStoreCache.loadedAt = new Date();
        localStoreCache.isLoaded = true;
        
        console.log('✅ Local 快取已載入:', localStoreCache.stores.length, '間店鋪,', localStoreCache.fieldStatuses.length, '個欄位狀態');
        return true;
    } catch (e) {
        console.error('❌ Local 快取載入失敗:', e.message);
        return false;
    }
}

// 更新頂部統計（含 Supabase 其他待處理計數）
async function updateTopBarStats() {
    // 使用 local 快取更新店鋪相關計數
    updateTopBarFromLocalCache();
    
    // 認證審核和檢舉計數仍從 Supabase 查詢（資料量小）
    try {
        var results = await Promise.all([
            sb.from('verification_reviews').select('*', { count: 'exact', head: true }).eq('admin_status', 'pending'),
            sb.from('reports').select('*', { count: 'exact', head: true }).eq('admin_status', 'pending')
        ]);
        document.getElementById('badge-verifications').textContent = results[0].count || 0;
        document.getElementById('badge-reports').textContent = results[1].count || 0;
    } catch (e) {
        console.warn('⚠️ 更新認證/檢舉計數失敗:', e.message);
    }
}

// ============================================================
// 工具函數
// ============================================================
function toast(message, type) {
    if (type === undefined) type = 'success';
    var container = document.getElementById('toast-container');
    var el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function() { el.remove(); }, 3000);
}

function openModal(title, body, confirmText, confirmClass) {
    if (confirmText === undefined) confirmText = '確認';
    if (confirmClass === undefined) confirmClass = '';
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-body').innerHTML = body;
    var btn = document.getElementById('modal-confirm-btn');
    btn.textContent = confirmText;
    btn.className = 'btn-modal-confirm ' + confirmClass;
    document.getElementById('modal-overlay').classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal-overlay').classList.add('hidden');
    modalCallback = null;
}

function modalConfirm() {
    if (modalCallback) modalCallback();
    closeModal();
}

function toggleSidebar() {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
}

function closeSidebar() {
    var sidebar = document.getElementById('sidebar');
    var overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
}

document.addEventListener('click', function(e) {
    var sidebar = document.getElementById('sidebar');
    var toggleBtn = document.querySelector('.btn-toggle-sidebar');
    if (window.innerWidth <= 768) {
        if (sidebar.classList.contains('open')) {
            if (!sidebar.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {
                closeSidebar();
            }
        }
    }
});

function showLoading(show) {
    var el = document.getElementById('login-loading');
    if (show) { el.classList.add('show'); } else { el.classList.remove('show'); }
}

function showLoginError(message) {
    var el = document.getElementById('login-error');
    el.textContent = message;
    el.classList.add('show');
}

function hideLoginError() {
    document.getElementById('login-error').classList.remove('show');
}

// ============================================================
// 認證
// ============================================================
function handleGoogleLogin() {
    if (isLoggingIn) return;
    if (!sb) { showLoginError('Supabase 服務尚未初始化'); return; }
    isLoggingIn = true;
    hideLoginError();
    showLoading(true);
    
    sb.auth.signInWithOAuth({
        provider: 'google',
        options: {
            redirectTo: window.location.href,
            queryParams: { access_type: 'offline', prompt: 'consent' }
        }
    }).then(function(result) {
        if (result.error) throw result.error;
    }).catch(function(error) {
        showLoginError('登入失敗: ' + (error.message || '請稍後再試'));
        showLoading(false);
        isLoggingIn = false;
    });
}

function handlePasswordLogin(e) {
    e.preventDefault();
    hideLoginError();
    var email = document.getElementById('login-email').value.trim();
    var password = document.getElementById('login-password').value.trim();
    if (!email || !password) { showLoginError('請輸入電子郵件和密碼'); return; }
    showLoading(true);
    sb.auth.signInWithPassword({ email: email, password: password })
        .then(function(result) {
            if (result.error) throw result.error;
            return handleSuccessfulLogin(result.data.user);
        })
        .catch(function(error) {
            showLoginError('登入失敗: ' + (error.message || '請檢查帳號密碼'));
            showLoading(false);
        });
}

function handleSuccessfulLogin(user) {
    return sb
        .from('user_profiles')
        .select('id, display_name, email, role')
        .eq('id', user.id)
        .single()
        .then(function(result) {
            if (result.error) {
                return sb
                    .from('user_profiles')
                    .insert({
                        id: user.id,
                        display_name: user.user_metadata?.full_name || user.email?.split('@')[0] || '管理員',
                        email: user.email,
                        role: 'admin',
                        is_anonymous: false
                    })
                    .select()
                    .single()
                    .then(function(insertResult) {
                        if (insertResult.error) throw insertResult.error;
                        return insertResult.data;
                    });
            }
            if (result.data.role !== 'admin') {
                return sb.auth.signOut().then(function() {
                    throw new Error('您沒有管理員權限');
                });
            }
            return result.data;
        })
        .then(function(profile) {
            currentUser = profile;
            showAdminApp(profile);
            toast('登入成功！');
        })
        .catch(function(error) {
            return sb.auth.signOut().then(function() {
                showLoginError('權限驗證失敗: ' + error.message);
                showLoading(false);
            });
        });
}

function showAdminApp(user) {
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    document.getElementById('admin-name').textContent = user.display_name || '管理員';
    document.getElementById('admin-email-display').textContent = user.email || '';
    document.getElementById('admin-avatar').textContent = user.display_name ? user.display_name.charAt(0) : '👤';
    showLoading(false);
    isLoggingIn = false;
    
    // ✅ 載入核心資料到 local 快取
    loadCoreDataToLocalCache().then(function(success) {
        if (success) {
            updateTopBarStats();
        }
        loadDashboard();
    });
}

function handleLogout() {
    sb.auth.signOut()
        .then(function() {
            currentUser = null;
            document.getElementById('admin-app').classList.add('hidden');
            document.getElementById('login-page').classList.remove('hidden');
            toast('已登出');
        })
        .catch(function(error) {
            toast('登出失敗: ' + error.message, 'error');
        });
}

function handleOAuthCallback() {
    var hash = window.location.hash;
    if (hash && hash.indexOf('access_token') !== -1) {
        showLoading(true);
        sb.auth.getSession()
            .then(function(result) {
                if (result.error) throw result.error;
                if (result.data.session) {
                    return handleSuccessfulLogin(result.data.session.user)
                        .then(function() {
                            window.history.replaceState({}, document.title, window.location.pathname);
                        });
                }
            })
            .catch(function(error) {
                showLoginError('登入處理失敗: ' + error.message);
                showLoading(false);
            });
    }
}

function checkExistingSession() {
    return sb.auth.getSession()
        .then(function(result) {
            if (result.error) throw result.error;
            if (result.data.session) {
                return sb
                    .from('user_profiles')
                    .select('id, display_name, email, role')
                    .eq('id', result.data.session.user.id)
                    .single()
                    .then(function(profileResult) {
                        if (profileResult.error) throw profileResult.error;
                        if (profileResult.data && profileResult.data.role === 'admin') {
                            currentUser = profileResult.data;
                            showAdminApp(profileResult.data);
                            return true;
                        } else {
                            return sb.auth.signOut().then(function() { return false; });
                        }
                    });
            }
            return false;
        })
        .catch(function(error) {
            console.warn('⚠️ 檢查 session 失敗:', error);
            return false;
        });
}

            el.classList.remove('active');

        dashboard: '儀表板',

        'admin-actions': '操作記錄',
        'bounty-reviews': '🏆 懸賞審核',
        'reports': '🚨 檢舉清單'

function loadDashboard() {
    var container = document.getElementById('tab-content');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span>載入中...</span></div>';
    
    // 使用 local 快取
    var pendingCount = getLocalPendingCount();
    var flaggedCount = getLocalFlaggedCount();
    var confirmedCount = getLocalConfirmedCount();
    
    // 更新頂部
    updateTopBarFromLocalCache();
    
    // 查詢認證和檢舉計數（資料量小）
    Promise.all([
        sb.from('verification_reviews').select('*', { count: 'exact', head: true }).eq('admin_status', 'pending'),
        sb.from('reports').select('*', { count: 'exact', head: true }).eq('admin_status', 'pending')
    ])
    .then(function(results) {
        var verificationsCount = results[0].count || 0;
        var reportsCount = results[1].count || 0;
        
        document.getElementById('badge-verifications').textContent = verificationsCount;
        document.getElementById('badge-reports').textContent = reportsCount;
        
        container.innerHTML = 
            '<div class="dashboard-grid">' +
                '<div class="stat-card"><div class="number gold">' + pendingCount + '</div><div class="label">🏪 待審核店鋪</div></div>' +
                '<div class="stat-card"><div class="number yellow">' + verificationsCount + '</div><div class="label">🔍 待審核認證</div></div>' +
                '<div class="stat-card"><div class="number red">' + flaggedCount + '</div><div class="label">⚠️ 存疑項目</div></div>' +
                '<div class="stat-card"><div class="number green">' + confirmedCount + '</div><div class="label">✅ 已確認</div></div>' +
            '</div>' +
            '<div class="table-container">' +
                '<table><thead><tr><th>店鋪名稱</th><th>地區</th><th>狀態</th><th>操作</th></tr></thead>' +
                '<tbody id="dashboard-table-body"></tbody></table>' +
            '</div>';
        
        // 顯示最近 10 間店鋪（從 local 快取）
        var recentStores = localStoreCache.stores.slice(0, 10);
        var tbody = document.getElementById('dashboard-table-body');
        if (recentStores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="4" class="empty-state">暫無店鋪資料</td></tr>';
        } else {
            var html = '';
            for (var i = 0; i < recentStores.length; i++) {
                var s = recentStores[i];
                var displayStatus = s.admin_overall_status || 'pending';
                html += '<tr>' +
                    '<td>' + s.name + '</td>' +
                    '<td>' + (s.region || '未設定') + '</td>' +
                    '<td><span class="status-badge ' + displayStatus + '">' + displayStatus + '</span></td>' +
                    '<td><button class="btn-sm" onclick="viewStoreDetail(\'' + s.id + '\')">查看</button></td>' +
                '</tr>';
            }
            tbody.innerHTML = html;
        }
    })
    .catch(function(error) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>載入失敗: ' + error.message + '</p></div>';
    });
}

// ============================================================
// 新店審核清單 (直接操作版 - 勾選+已查閱)
// ============================================================
function loadStores() {
    var container = document.getElementById('tab-content');
    
    // 使用 local 快取
    var pendingStores = getLocalPendingStores();
    
    if (pendingStores.length === 0) {
        container.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i><p>🎉 沒有待審核的店鋪</p></div>';
        return;
    }
    
    // 為每間店鋪附加 field_status 資訊
    var html = 
        '<div style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">' +
            '<span style="font-size:13px;color:var(--text-muted);">📋 共 ' + pendingStores.length + ' 間待審核店鋪</span>' +
            '<button class="btn-sm" onclick="refreshCoreData()" style="margin-left:auto;">🔄 重新整理</button>' +
        '</div>' +
        '<div class="table-container" style="overflow-x:auto;">' +
            '<table style="min-width:1200px;">' +
                '<thead><tr>' +
                    '<th style="min-width:100px;">店名</th>' +
                    '<th style="min-width:60px;">地區</th>' +
                    '<th style="min-width:60px;">照片</th>' +
                    '<th style="min-width:150px;">地址</th>' +
                    '<th style="min-width:50px;">規模</th>' +
                    '<th style="min-width:50px;">場務</th>' +
                    '<th style="min-width:50px;">兌幣</th>' +
                    '<th style="min-width:50px;">認證</th>' +
                    '<th style="min-width:150px;">提交</th>' +
                    '<th style="min-width:70px;">操作</th>' +
                '</tr></thead>' +
                '<tbody>';
    
    for (var i = 0; i < pendingStores.length; i++) {
        var s = pendingStores[i];
        
        // 找出此店鋪的 field_status
        var storeFieldStatuses = localStoreCache.fieldStatuses.filter(function(fs) {
            return String(fs.record_id) === String(s.id);
        });
        
        var fieldStatusMap = {};
        for (var j = 0; j < storeFieldStatuses.length; j++) {
            fieldStatusMap[storeFieldStatuses[j].field_name] = storeFieldStatuses[j].status;
        }
        
        // 判斷是否有補充
        var hasSupplement = false;
        var supplementerDevice = null;
        var supplementDate = '';
        
        if (s.supplemented_by && s.supplemented_by !== '' && s.supplemented_by !== '無' && s.supplemented_by !== null) {
            hasSupplement = true;
            supplementerDevice = s.supplemented_by;
        }
        
        for (var j = 0; j < storeFieldStatuses.length; j++) {
            if (storeFieldStatuses[j].submitted_type === 'supplement') {
                hasSupplement = true;
                supplementerDevice = storeFieldStatuses[j].submitted_by;
                supplementDate = storeFieldStatuses[j].updated_at || '';
                break;
            }
        }
        
        // 認證總數
        var totalVerifications = (s.verification_count || 0) + (s.verification_count_2 || 0);
        
        // 欄位顯示
        var photoHtml = s.photo 
            ? '<a href="' + s.photo + '" target="_blank"><img src="' + s.photo + '" style="width:40px;height:40px;border-radius:8px;object-fit:cover;cursor:pointer;" /></a>' 
            : '<span style="font-size:20px;">🏪</span>';
        
        var sizeDisplay = s.size === 'small' ? 'S' : s.size === 'large' ? 'L' : (s.size === 'medium' ? 'M' : '?');
        var staffDisplay = s.has_staff === true ? 'V' : s.has_staff === false ? 'X' : '?';
        var coinDisplay = s.has_e_coin === true ? 'V' : s.has_e_coin === false ? 'X' : '?';
        
        // 提交資訊
        var submitInfo = '';
        var submitDate = s.created_at ? new Date(s.created_at).toLocaleDateString('zh-HK') : '';
        submitInfo += '<div style="font-size:11px;">首發：' + (s.submitted_by_device || '未知') + '</div>';
        submitInfo += '<div style="font-size:10px;color:var(--text-muted);">' + submitDate + '</div>';
        
        if (hasSupplement) {
            submitInfo += '<div style="font-size:11px;margin-top:4px;">補充：' + (supplementerDevice || '未知') + '</div>';
            if (supplementDate) {
                submitInfo += '<div style="font-size:10px;color:var(--text-muted);">' + new Date(supplementDate).toLocaleDateString('zh-HK') + '</div>';
            }
        }
        
        // 欄位勾選格
        function buildFieldCell(fieldName, displayValue, extraClass) {
            var status = fieldStatusMap[fieldName] || '';
            var isChecked = status === 'suspicious' ? 'checked' : '';
            var borderClass = status === 'suspicious' ? 'border-suspicious' : 
                             (status === 'confirmed' ? 'border-confirmed' : 
                             (status === 'missing' ? 'border-missing' : ''));
            return '<td style="position:relative;' + extraClass + '">' +
                '<div style="display:flex;align-items:center;gap:6px;">' +
                    '<div style="flex:1;min-width:0;">' + displayValue + '</div>' +
                    '<input type="checkbox" class="store-field-checkbox" data-store-id="' + s.id + '" data-field-name="' + fieldName + '" ' + isChecked + ' style="width:16px;height:16px;cursor:pointer;flex-shrink:0;accent-color:var(--warning);" />' +
                '</div>' +
            '</td>';
        }
        
        html += '<tr>' +
            buildFieldCell('name', '<strong>' + s.name + '</strong>') +
            buildFieldCell('region', s.region || '未設定') +
            buildFieldCell('photo', photoHtml) +
            buildFieldCell('addr', s.addr || '未填') +
            buildFieldCell('size', sizeDisplay) +
            buildFieldCell('has_staff', staffDisplay) +
            buildFieldCell('has_e_coin', coinDisplay) +
            '<td><span class="status-badge ' + (totalVerifications >= 2 ? 'confirmed' : 'pending') + '">' + totalVerifications + '/2</span></td>' +
            '<td>' + submitInfo + '</td>' +
            '<td><button class="btn-sm primary" onclick="confirmReviewedFromList(\'' + s.id + '\')">✅ 已查閱</button></td>' +
        '</tr>';
    }
    
    html += '</tbody></table></div>';
    html += '<div style="margin-top:8px;font-size:11px;color:var(--text-muted);">💡 勾選欄位 = 標記存疑；未勾選的待查閱欄位在點擊「已查閱」後自動確認</div>';
    container.innerHTML = html;
}

// ============================================================
// 從列表直接已查閱
// ============================================================
function confirmReviewedFromList(storeId) {
    var numericStoreId = parseInt(storeId);
    var stringStoreId = String(storeId);
    
    var checkboxes = document.querySelectorAll('.store-field-checkbox[data-store-id="' + storeId + '"]');
    
    if (checkboxes.length === 0) {
        toast('找不到該店鋪的欄位', 'error');
        return;
    }
    
    if (!confirm('確定要完成查閱嗎？\n勾選的欄位將標記為存疑，未勾選的待查閱欄位將自動確認。\n\n此店鋪將從新店審核中移除。')) return;
    
    var flaggedFields = [];
    var allFieldNames = [];
    
    for (var i = 0; i < checkboxes.length; i++) {
        allFieldNames.push(checkboxes[i].dataset.fieldName);
        if (checkboxes[i].checked) {
            flaggedFields.push(checkboxes[i].dataset.fieldName);
        }
    }
    
    // 取得該店鋪現有的 field_status
    var existingFields = localStoreCache.fieldStatuses.filter(function(fs) {
        return fs.record_id === stringStoreId;
    });
    var existingMap = {};
    for (var i = 0; i < existingFields.length; i++) {
        existingMap[existingFields[i].field_name] = existingFields[i];
    }
    
    var writePromises = [];
    var suspiciousCount = 0;
    var confirmedCount = 0;
    
    for (var i = 0; i < allFieldNames.length; i++) {
        var fieldName = allFieldNames[i];
        var isFlagged = flaggedFields.indexOf(fieldName) !== -1;
        var existing = existingMap[fieldName];
        var newStatus = null;
        
        if (isFlagged) {
            newStatus = 'suspicious';
            suspiciousCount++;
        } else if (existing && existing.status === 'pending') {
            newStatus = 'confirmed';
            confirmedCount++;
        } else if (existing && existing.status === 'suspicious') {
            newStatus = 'suspicious';
            suspiciousCount++;
        } else if (existing && existing.status === 'confirmed') {
            newStatus = 'confirmed';
        } else if (existing && existing.status === 'missing') {
            newStatus = 'missing';
        } else {
            continue;
        }
        
        writePromises.push(
            sb.from('field_status').upsert({
                table_name: 'claw_stores',
                record_id: stringStoreId,
                field_name: fieldName,
                status: newStatus,
                flagged_by: (newStatus === 'suspicious') ? (currentUser ? currentUser.display_name : 'admin') : null,
                flagged_at: (newStatus === 'suspicious') ? new Date().toISOString() : null,
                resolved: (newStatus === 'confirmed'),
                resolved_at: (newStatus === 'confirmed') ? new Date().toISOString() : null,
                note: (newStatus === 'suspicious') ? '管理員標記存疑' : null,
                updated_at: new Date().toISOString()
            }, { onConflict: 'table_name,record_id,field_name' })
        );
    }
    
    var overallStatus = 'reviewed';
    writePromises.push(
        sb.from('claw_stores')
            .update({ admin_overall_status: overallStatus })
            .eq('id', numericStoreId)
    );
    
    Promise.all(writePromises)
        .then(function() {
            // 更新 local 快取
            removeStoreFromLocalCache(storeId);
            updateTopBarFromLocalCache();
            
            var summary = [];
            if (confirmedCount > 0) summary.push(confirmedCount + ' 個已確認');
            if (suspiciousCount > 0) summary.push(suspiciousCount + ' 個存疑');
            toast('✅ 已查閱完成：' + (summary.length > 0 ? summary.join('、') : '無變更'));
            
            loadStores();
            loadDashboard();
        })
        .catch(function(error) {
            toast('操作失敗: ' + error.message, 'error');
        });
}
// ============================================================
// 重新整理核心資料（重新查詢 Supabase）
// ============================================================
async function refreshCoreData() {
    toast('🔄 重新整理中...');
    var success = await loadCoreDataToLocalCache();
    if (success) {
        await updateTopBarStats();
        loadStores();
        toast('✅ 已更新至最新資料');
    } else {
        toast('❌ 重新整理失敗', 'error');
    }
}

// ============================================================
// 詳細檢視 (新店審核) - 使用 Local 快取版
// ============================================================
function viewStoreDetail(storeId) {
    currentViewStoreId = storeId;
    
    // 從 local 快取取得店鋪資料
    var store = null;
    var numericStoreId = parseInt(storeId);
    for (var i = 0; i < localStoreCache.stores.length; i++) {
        if (localStoreCache.stores[i].id === numericStoreId) {
            store = localStoreCache.stores[i];
            break;
        }
    }
    
    if (!store) {
        // Local 快取中沒有，從 Supabase 查詢
        sb.from('claw_stores')
            .select('*')
            .eq('id', numericStoreId)
            .single()
            .then(function(result) {
                if (result.error) throw result.error;
                store = result.data;
                renderStoreDetail(store);
            })
            .catch(function(error) {
                toast('載入失敗: ' + error.message, 'error');
            });
        return;
    }
    
    // 從 local 快取取得 field_status
    var storeFieldStatuses = localStoreCache.fieldStatuses.filter(function(fs) {
        return String(fs.record_id) === String(storeId);
    });
    
    renderStoreDetail(store, storeFieldStatuses);
}

function renderStoreDetail(store, fieldStatuses) {
    if (fieldStatuses === undefined) fieldStatuses = [];
    
    var fieldStatusMap = {};
    for (var i = 0; i < fieldStatuses.length; i++) {
        fieldStatusMap[fieldStatuses[i].field_name] = fieldStatuses[i].status;
    }
    
    var hasSupplement = false;
    var supplementerDevice = null;
    
    if (store.supplemented_by && store.supplemented_by !== '' && store.supplemented_by !== '無' && store.supplemented_by !== null) {
        hasSupplement = true;
        supplementerDevice = store.supplemented_by;
    }
    
    if (!hasSupplement) {
        for (var i = 0; i < fieldStatuses.length; i++) {
            if (fieldStatuses[i].submitted_type === 'supplement') {
                hasSupplement = true;
                supplementerDevice = fieldStatuses[i].submitted_by;
                break;
            }
        }
    }
    
    var firstSubmitFields = [
        { key: 'name', label: '店名', value: store.name || '未填' },
        { key: 'region', label: '地區', value: store.region || '未填' },
        { key: 'photo', label: '照片', value: store.photo || '無照片' }
    ];
    
    var supplementFields = [
        { key: 'addr', label: '地址', value: store.addr || '未填' },
        { key: 'size', label: '規模', value: store.size || '未填' },
        { key: 'has_staff', label: '有場務', value: store.has_staff !== undefined && store.has_staff !== null ? (store.has_staff ? '有' : '無') : '未填' },
        { key: 'has_e_coin', label: '電子兌幣', value: store.has_e_coin !== undefined && store.has_e_coin !== null ? (store.has_e_coin ? '有' : '無') : '未填' }
    ];
    
    function getFieldStatus(fieldKey, fieldValue, isFirstSubmit) {
        if (fieldStatusMap[fieldKey] !== undefined && fieldStatusMap[fieldKey] !== null && fieldStatusMap[fieldKey] !== '') {
            return fieldStatusMap[fieldKey];
        }
        if (isFirstSubmit) {
            if (fieldValue && fieldValue !== '未填' && fieldValue !== '無照片' && fieldValue !== '未知' && fieldValue !== '') {
                return 'pending';
            }
            return 'missing';
        }
        if (hasSupplement) {
            if (fieldValue && fieldValue !== '未填' && fieldValue !== '無' && fieldValue !== '未知' && fieldValue !== '' && fieldValue !== 'medium') {
                return 'pending';
            }
            return 'missing';
        } else {
            return 'missing';
        }
    }
    
    function renderFields(fields, label, isFirstSubmit) {
        var html = '<div class="section-header">' + label + '</div>';
        for (var i = 0; i < fields.length; i++) {
            var f = fields[i];
            var status = getFieldStatus(f.key, f.value, isFirstSubmit);
            
            var statusLabels = {
                'pending': '<span class="field-status status-pending">⏳ 待查閱</span>',
                'confirmed': '<span class="field-status status-confirmed">✅ 已確認</span>',
                'suspicious': '<span class="field-status status-suspicious">⚠️ 存疑</span>',
                'missing': '<span class="field-status status-missing">❓ 待填</span>'
            };
            
            var borderClass = status === 'suspicious' ? 'border-suspicious' : 
                             (status === 'confirmed' ? 'border-confirmed' : 
                             (status === 'missing' ? 'border-missing' : ''));
            var isPhoto = f.key === 'photo';
            var displayValue = isPhoto && f.value !== '無照片' && f.value !== '未填' && f.value !== '未知' ? 
                '<img src="' + f.value + '" style="max-height:60px;border-radius:4px;object-fit:cover;" />' : 
                f.value;
            var isChecked = status === 'suspicious' ? 'checked' : '';
            
            html += 
                '<div class="field-item ' + borderClass + '" data-field="' + f.key + '">' +
                    '<div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">' +
                        '<input type="checkbox" class="field-checkbox" id="field-' + f.key + '" data-field="' + f.key + '" ' + isChecked + '>' +
                        '<span class="field-name">' + f.label + '</span>' +
                        '<span class="field-value">' + displayValue + '</span>' +
                    '</div>' +
                    '<div class="field-actions">' +
                        (statusLabels[status] || statusLabels.pending) +
                    '</div>' +
                '</div>';
        }
        return html;
    }
    
    var allFields = firstSubmitFields.concat(supplementFields);
    var hasSuspicious = false, hasPending = false, hasMissing = false, hasConfirmed = false;
    for (var i = 0; i < allFields.length; i++) {
        var f = allFields[i];
        var isFirst = i < firstSubmitFields.length;
        var status = getFieldStatus(f.key, f.value, isFirst);
        if (status === 'suspicious') hasSuspicious = true;
        if (status === 'pending') hasPending = true;
        if (status === 'missing') hasMissing = true;
        if (status === 'confirmed') hasConfirmed = true;
    }
    
    var hasAnyStatus = hasSuspicious || hasPending || hasMissing || hasConfirmed;
    
    var statusText = '⏳ 待查閱';
    var statusClass = 'pending';
    if (!hasAnyStatus) {
        statusText = '⏳ 待查閱';
        statusClass = 'pending';
    } else if (hasSuspicious) {
        statusText = '⚠️ 部分存疑';
        statusClass = 'suspicious';
    } else if (hasPending) {
        statusText = '⏳ 待查閱';
        statusClass = 'pending';
    } else if (hasMissing) {
        statusText = '❓ 待補充';
        statusClass = 'missing';
    } else {
        statusText = '✅ 已完整確認';
        statusClass = 'confirmed';
    }
    var totalVerifications = (store.verification_count || 0) + (store.verification_count_2 || 0);
    var modalHtml = 
        '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">' +
            '<div>' +
                '<h3 style="font-size:18px;">📋 ' + store.name + '</h3>' +
                '<div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">' +
                    '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                    '<span style="font-size:12px;color:var(--text-muted);">📍 ' + (store.region || '未知地區') + '</span>' +
                    '<span style="font-size:12px;color:var(--text-muted);">🔑 ' + (store.status || 'pending') + ' (' + totalVerifications + '/2)</span>' +
                '</div>' +
            '</div>' +
        '</div>' +
        '<div style="display:flex;gap:16px;margin-top:8px;font-size:12px;color:var(--text-muted);flex-wrap:wrap;">' +
            '<span>📌 提交時間: ' + new Date(store.created_at).toLocaleString() + '</span>' +
            (supplementerDevice ? '<span>📌 補充者: ' + supplementerDevice + '</span>' : '') +
        '</div>' +
        '<div style="margin-top:12px;">' +
            '<div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">💡 勾選欄位後點擊「已查閱」→ 勾選的欄位標記為存疑，未勾選的待查閱欄位自動確認</div>' +
            renderFields(firstSubmitFields, '📌 首發者提交', true) +
            renderFields(supplementFields, '📌 補充者提交', false) +
        '</div>' +
        '<div class="admin-actions-bar">' +
            '<span class="action-label">⚠️ 管理員操作</span>' +
            '<button class="btn-sm primary" onclick="confirmReviewed(\'' + store.id + '\')">✅ 已查閱</button>' +
            (hasSupplement ? '<button class="btn-sm danger" onclick="revokeSupplement(\'' + store.id + '\', \'' + supplementerDevice + '\', \'補充者\')">🗑️ 撤銷補充</button>' : '') +
            '<button class="btn-sm danger" onclick="if(confirm(\'確定要隱藏此店鋪嗎？\')) hideStore(\'' + store.id + '\')">🚫 隱藏店鋪</button>' +
        '</div>' +
        '<div style="margin-top:12px;padding:12px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid var(--border-color);">' +
            (store.photo ? '<a href="' + store.photo + '" target="_blank" style="font-size:12px;color:var(--primary);">🔍 查看原圖</a>' : '') +
        '</div>';
    
    openModal('📋 店鋪詳情', modalHtml, '關閉');
}

// ============================================================
// 已查閱 (寫入成功後 Local 更新版)
// ============================================================
function confirmReviewed(storeId) {
    if (!confirm('確定要將所有「待查閱」欄位標記為「已確認」嗎？\n(被勾選存疑的欄位將保持存疑，待填欄位保持待填)\n\n查閱後此店鋪將從「新店審核」中移除。')) return;
    
    var numericStoreId = parseInt(storeId);
    var stringStoreId = String(storeId);
    
    var checkboxes = document.querySelectorAll('.field-checkbox');
    var flaggedFields = [];
    var allFieldKeys = [];
    for (var i = 0; i < checkboxes.length; i++) {
        allFieldKeys.push(checkboxes[i].dataset.field);
        if (checkboxes[i].checked) {
            flaggedFields.push(checkboxes[i].dataset.field);
        }
    }
    
    // 從 local 快取取得現有 field_status
    var existingFields = localStoreCache.fieldStatuses.filter(function(fs) {
        return fs.record_id === stringStoreId;
    });
    var existingMap = {};
    for (var i = 0; i < existingFields.length; i++) {
        existingMap[existingFields[i].field_name] = existingFields[i];
    }
    
    var writePromises = [];
    var suspiciousCount = 0;
    var confirmedCount = 0;
    var missingCount = 0;
    
    for (var i = 0; i < allFieldKeys.length; i++) {
        var fieldKey = allFieldKeys[i];
        var isFlagged = (flaggedFields.indexOf(fieldKey) !== -1);
        var existing = existingMap[fieldKey];
        var newStatus = null;
        
        if (isFlagged) {
            newStatus = 'suspicious';
            suspiciousCount++;
        } else if (existing && existing.status === 'pending') {
            newStatus = 'confirmed';
            confirmedCount++;
        } else if (existing && existing.status === 'suspicious') {
            newStatus = 'suspicious';
            suspiciousCount++;
        } else if (existing && existing.status === 'confirmed') {
            newStatus = 'confirmed';
        } else if (existing && existing.status === 'missing') {
            newStatus = 'missing';
            missingCount++;
        } else {
            continue;
        }
        
        writePromises.push(
            sb.from('field_status').upsert({
                table_name: 'claw_stores',
                record_id: stringStoreId,
                field_name: fieldKey,
                status: newStatus,
                flagged_by: (newStatus === 'suspicious') ? (currentUser ? currentUser.display_name : 'admin') : null,
                flagged_at: (newStatus === 'suspicious') ? new Date().toISOString() : null,
                resolved: (newStatus === 'confirmed'),
                resolved_at: (newStatus === 'confirmed') ? new Date().toISOString() : null,
                note: (newStatus === 'suspicious') ? '管理員標記存疑' : null,
                updated_at: new Date().toISOString()
            }, { onConflict: 'table_name,record_id,field_name' })
        );
    }
    
    writePromises.push(
        sb.from('claw_stores')
            .update({ admin_overall_status: 'reviewed' })
            .eq('id', numericStoreId)
    );
    
    // 等待所有寫入完成
    Promise.all(writePromises)
        .then(function() {
            // ✅ 寫入成功 → 更新 Local 快取
            removeStoreFromLocalCache(storeId);
            
            // 更新 local 中的 field_status
            for (var i = 0; i < allFieldKeys.length; i++) {
                var fieldKey = allFieldKeys[i];
                var isFlagged = (flaggedFields.indexOf(fieldKey) !== -1);
                var newStatus = isFlagged ? 'suspicious' : 'confirmed';
                
                var found = false;
                for (var j = 0; j < localStoreCache.fieldStatuses.length; j++) {
                    if (localStoreCache.fieldStatuses[j].record_id === stringStoreId && 
                        localStoreCache.fieldStatuses[j].field_name === fieldKey) {
                        localStoreCache.fieldStatuses[j].status = newStatus;
                        localStoreCache.fieldStatuses[j].resolved = (newStatus === 'confirmed');
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    localStoreCache.fieldStatuses.push({
                        table_name: 'claw_stores',
                        record_id: stringStoreId,
                        field_name: fieldKey,
                        status: newStatus,
                        resolved: (newStatus === 'confirmed')
                    });
                }
            }
            
            // 更新頂部計數
            updateTopBarFromLocalCache();
            
            var summary = [];
            if (confirmedCount > 0) summary.push(confirmedCount + ' 個已確認');
            if (suspiciousCount > 0) summary.push(suspiciousCount + ' 個存疑');
            if (missingCount > 0) summary.push(missingCount + ' 個待填');
            toast('✅ 已查閱完成：' + (summary.length > 0 ? summary.join('、') : '無變更'));
            
            closeModal();
            loadStores();
        })
        .catch(function(error) {
            // ❌ 寫入失敗 → Local 不變
            toast('操作失敗: ' + error.message, 'error');
        });
}

// ============================================================
// ⭐ 撤銷認證 (使用 fetch 強制字串)
// ============================================================
async function revokeVerification(storeId, verifierDevice, verifierName) {
    if (!confirm('確定要撤銷 ' + (verifierName || verifierDevice) + ' 的認證嗎？\n\n此操作將：\n1. 認證數減少 1\n2. 如果少於 2 人認證，店鋪回到「未審核」狀態\n3. 該認證記錄被標記為「已撤銷」')) {
        return;
    }
    
    var reason = prompt('請輸入撤銷原因 (可選)：');
    
    try {
        var { data: store } = await sb
            .from('claw_stores')
            .select('verification_count, status, is_verified')
            .eq('id', parseInt(storeId))
            .single();
        
        if (!store) { toast('找不到該店鋪', 'error'); return; }
        
        var newCount = Math.max(0, (store.verification_count || 0) - 1);
        var newStatus = newCount >= 2 ? 'verified' : 'pending';
        var newIsVerified = newCount >= 2 ? true : false;
        
        // 使用 fetch 更新 store_verifications（強制字串）
        var updateUrl = SUPABASE_URL + "/rest/v1/store_verifications?store_id=eq.%22" + encodeURIComponent(storeId) + "%22&verifier_device=eq.%22" + encodeURIComponent(verifierDevice) + "%22&status=eq.pending";
        
        var updateResponse = await fetch(updateUrl, {
            method: 'PATCH',
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=minimal'
            },
            body: JSON.stringify({
                status: 'revoked',
                revoked_by: currentUser.display_name,
                revoked_at: new Date().toISOString(),
                revoke_reason: reason || '管理員撤銷'
            })
        });
        
        if (!updateResponse.ok && updateResponse.status !== 204) {
            console.warn('store_verifications 更新返回:', updateResponse.status);
        }
        
        await sb
            .from('claw_stores')
            .update({
                verification_count: newCount,
                status: newStatus,
                is_verified: newIsVerified
            })
            .eq('id', parseInt(storeId));
        
        var { data: review } = await sb
            .from('verification_reviews')
            .select('*')
            .eq('store_id', String(storeId))
            .eq('admin_status', 'pending')
            .maybeSingle();
        
        if (review) {
            var updates = {};
            if (review.verifier_1_device === verifierDevice) {
                updates.flag_verifier_1 = true;
                updates.verifier_1_status = 'revoked';
            } else if (review.verifier_2_device === verifierDevice) {
                updates.flag_verifier_2 = true;
                updates.verifier_2_status = 'revoked';
            }
            
            if ((review.flag_verifier_1 || updates.flag_verifier_1) && 
                (review.flag_verifier_2 || updates.flag_verifier_2)) {
                updates.admin_status = 'rejected';
            }
            
            await sb
                .from('verification_reviews')
                .update(updates)
                .eq('id', review.id);
        }
        
        await sb
            .from('admin_actions')
            .insert({
                store_id: parseInt(storeId),
                action_type: 'revoke_verification',
                target_type: 'verification',
                target_id: verifierDevice,
                reason: reason || '管理員撤銷認證',
                performed_by: currentUser.display_name,
                metadata: {
                    new_count: newCount,
                    old_count: store.verification_count
                }
            });
        
        toast('✅ 已撤銷 ' + (verifierDevice || '未知裝置') + ' 的認證 (目前 ' + newCount + '/2 人認證)');
        
        if (currentTab === 'verifications') {
            loadVerifications();
        } else if (currentTab === 'stores') {
            loadStores();
        }
        loadDashboard();
        
    } catch (error) {
        toast('操作失敗: ' + error.message, 'error');
    }
}

// 撤銷補充 (修正版 - size 恢復為 null)
// ============================================================
async function revokeSupplement(storeId, supplementerDevice, supplementerName) {
    if (!confirm('確定要撤銷 ' + (supplementerName || supplementerDevice) + ' 的補充資料嗎？\n\n此操作將：\n1. 抹去該用戶補充的所有欄位資料\n2. 相關欄位回到「待填」狀態')) {
        return;
    }
    
    var reason = prompt('請輸入撤銷原因 (可選)：');
    
    try {
        var { data: fields } = await sb
            .from('field_status')
            .select('field_name')
            .eq('table_name', 'claw_stores')
            .eq('record_id', String(storeId))
            .eq('submitted_by', supplementerDevice)
            .eq('submitted_type', 'supplement');
        
        if (!fields || fields.length === 0) {
            toast('該用戶沒有補充記錄', 'warning');
            return;
        }
        
        var { data: store } = await sb
            .from('claw_stores')
            .select('*')
            .eq('id', parseInt(storeId))
            .single();
        
        var updates = {};
        var oldValues = {};
        for (var i = 0; i < fields.length; i++) {
            var field = fields[i].field_name;
            oldValues[field] = store[field];
            
            switch(field) {
                case 'addr': updates[field] = ''; break;
                case 'size': updates[field] = null; break;  // ✅ 改為 null
                case 'has_staff': case 'has_e_coin': updates[field] = null; break;
                case 'addr': updates[field] = ''; break;
                default: updates[field] = '';
            }
        }
        
        await sb
            .from('claw_stores')
            .update(updates)
            .eq('id', parseInt(storeId));
        
        for (var i = 0; i < fields.length; i++) {
            await sb
                .from('field_status')
                .upsert({
                    table_name: 'claw_stores',
                    record_id: String(storeId),
                    field_name: fields[i].field_name,
                    status: 'missing',
                    submitted_by: null,
                    submitted_type: null,
                    updated_at: new Date().toISOString()
                }, { onConflict: 'table_name, record_id, field_name' });
        }
        
        await sb
            .from('admin_actions')
            .insert({
                store_id: parseInt(storeId),
                action_type: 'revoke_supplement',
                target_type: 'supplement',
                target_id: supplementerDevice,
                reason: reason || '管理員撤銷補充資料',
                performed_by: currentUser.display_name,
                metadata: {
                    revoked_fields: fields.map(function(f) { return f.field_name; }),
                    old_values: oldValues
                }
            });
        
        toast('✅ 已撤銷 ' + (supplementerName || supplementerDevice) + ' 的補充資料 (' + fields.length + ' 個欄位)');
        
        if (currentTab === 'stores') {
            loadStores();
        }
        loadDashboard();
        
    } catch (error) {
        toast('操作失敗: ' + error.message, 'error');
    }
}

// ============================================================
// 確認認證審核 (修正版 - 精確更新 store_verifications)
// ============================================================
function confirmVerification(reviewId) {
    var flagFirst = document.getElementById('flag-first-' + reviewId);
    var flagV1 = document.getElementById('flag-v1-' + reviewId);
    var flagV2 = document.getElementById('flag-v2-' + reviewId);
    
    var hasFlag = (flagFirst && flagFirst.checked) || (flagV1 && flagV1.checked) || (flagV2 && flagV2.checked);
    
    if (hasFlag) {
        if (!confirm('有認證者被標記存疑，確定要提交審核結果嗎？\n被標記存疑的認證將被視為無效。')) return;
    } else {
        if (!confirm('確定此店鋪的所有認證資料正確無誤？')) return;
    }
    
    var updates = {
        admin_status: 'reviewed',
        admin_reviewed_at: new Date().toISOString(),
        flag_first_submitter: flagFirst ? flagFirst.checked : false,
        flag_verifier_1: flagV1 ? flagV1.checked : false,
        flag_verifier_2: flagV2 ? flagV2.checked : false
    };
    
    // 先獲取 review 資料，取得 verifier_device
    sb.from('verification_reviews')
        .select('store_id, verifier_1_device, verifier_2_device')
        .eq('id', reviewId)
        .single()
        .then(function(reviewResult) {
            if (reviewResult.error) throw reviewResult.error;
            var review = reviewResult.data;
            
            return sb.from('verification_reviews')
                .update(updates)
                .eq('id', reviewId)
                .then(function(updateResult) {
                    if (updateResult.error) throw updateResult.error;
                    return review;
                });
        })
        .then(function(review) {
            var pendingUpdates = [];
            
            // ✅ 修正：使用 verifier_device 精確更新
            if (flagV1 && flagV1.checked && review.verifier_1_device) {
                var url1 = SUPABASE_URL + "/rest/v1/store_verifications?store_id=eq.%22" + encodeURIComponent(review.store_id) + "%22&verifier_device=eq.%22" + encodeURIComponent(review.verifier_1_device) + "%22&status=eq.pending";
                pendingUpdates.push(
                    fetch(url1, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({ status: 'suspicious' })
                    })
                );
            }
            
            if (flagV2 && flagV2.checked && review.verifier_2_device) {
                var url2 = SUPABASE_URL + "/rest/v1/store_verifications?store_id=eq.%22" + encodeURIComponent(review.store_id) + "%22&verifier_device=eq.%22" + encodeURIComponent(review.verifier_2_device) + "%22&status=eq.pending";
                pendingUpdates.push(
                    fetch(url2, {
                        method: 'PATCH',
                        headers: {
                            'apikey': SUPABASE_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_KEY,
                            'Content-Type': 'application/json',
                            'Prefer': 'return=minimal'
                        },
                        body: JSON.stringify({ status: 'suspicious' })
                    })
                );
            }
            
            return Promise.all(pendingUpdates);
        })
        .then(function() {
            toast('✅ 認證審核完成');
            loadVerifications();
            loadDashboard();
        })
        .catch(function(error) {
            toast('操作失敗: ' + error.message, 'error');
        });
}

// ============================================================

            .select('*')
            .eq('status', 'suspicious')
            .or('resolved.eq.false,resolved.is.null')

        sb.from('bounty_tasks')
            .select('field_status_id, status, admin_decision')
            .in('status', ['open', 'in_progress', 'completed'])

        var data = results[0].data || [];
        var bountyTasks = results[1].data || [];
        
        var bountyMap = {};
        for (var i = 0; i < bountyTasks.length; i++) {
            var task = bountyTasks[i];
            if (!bountyMap[task.field_status_id] || task.status === 'open') {
                bountyMap[task.field_status_id] = task;

        var storeIds = [];

            }

            container.innerHTML = '<div class="empty-state"><i class="fas fa-check-circle"></i><p>🎉 沒有存疑項目</p></div>';

                        '<table>' +

                                '<th><input type="checkbox" id="select-all-flagged" onchange="toggleAllFlagged()"></th>' +
