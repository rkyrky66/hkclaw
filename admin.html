<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🛡️ 爪爪情報站 · 後台管理</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <style>
        /* ===== 所有樣式 (與之前相同，只增加側邊欄關閉按鈕) ===== */
        :root {
            --primary: #D4AF37;
            --primary-dark: #B8941F;
            --bg-dark: #0a0a0a;
            --bg-card: #141414;
            --bg-input: #1a1a1a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --border-color: #2a2a2a;
            --success: #00FF00;
            --warning: #FFB800;
            --danger: #FF007F;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 12px;
            --sidebar-width: 260px;
            --topbar-height: 64px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Noto Sans TC', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--primary); }
        
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at 20% 0%, rgba(212,175,55,0.08), transparent 40%),
                        radial-gradient(circle at 80% 100%, rgba(255,0,127,0.05), transparent 40%),
                        var(--bg-dark);
        }
        .login-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow);
        }
        .login-header { text-align: center; margin-bottom: 32px; }
        .login-icon { font-size: 48px; margin-bottom: 8px; }
        .login-box h1 { font-size: 24px; font-weight: 700; color: var(--primary); letter-spacing: 1px; }
        .login-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
        .login-error {
            background: rgba(255,0,127,0.12);
            border: 1px solid rgba(255,0,127,0.3);
            color: var(--danger);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
        }
        .login-error.show { display: block; }
        
        .btn-google {
            width: 100%;
            padding: 14px;
            background: #ffffff;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        .btn-google:hover { background: #f0f0f0; transform: translateY(-1px); box-shadow: 0 4px 20px rgba(255,255,255,0.15); }
        .btn-google:active { transform: translateY(0); }
        
        .login-divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 13px;
        }
        .login-divider::before,
        .login-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-color);
        }
        
        .login-footer { text-align: center; margin-top: 24px; color: var(--text-muted); font-size: 12px; }
        .login-loading { display: none; text-align: center; color: var(--text-secondary); font-size: 14px; margin-top: 12px; }
        .login-loading.show { display: block; }
        .login-loading i { margin-right: 8px; }
        
        .admin-app { display: flex; height: 100vh; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* ===== 側邊欄 ===== */
        .sidebar {
            width: var(--sidebar-width);
            min-width: var(--sidebar-width);
            background: var(--bg-card);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        /* ✅ 側邊欄關閉按鈕 */
        .sidebar-close {
            display: none;
            position: absolute;
            right: 12px;
            top: 12px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
        }
        .sidebar-close:hover { background: rgba(255,255,255,0.05); color: var(--text-primary); }
        
        .sidebar-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px 20px 16px;
            border-bottom: 1px solid var(--border-color);
        }
        .brand-icon { font-size: 28px; }
        .brand-text { font-size: 18px; font-weight: 700; color: var(--primary); }
        .sidebar-nav { flex: 1; overflow-y: auto; padding: 12px 0; }
        .sidebar-nav ul { list-style: none; }
        .sidebar-nav .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 20px;
            cursor: pointer;
            color: var(--text-secondary);
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 14px;
            position: relative;
        }
        .sidebar-nav .nav-item:hover { background: rgba(212,175,55,0.06); color: var(--text-primary); }
        .sidebar-nav .nav-item.active { color: var(--primary); border-left-color: var(--primary); background: rgba(212,175,55,0.08); }
        .sidebar-nav .nav-item i { width: 20px; text-align: center; font-size: 16px; }
        .sidebar-nav .nav-item .badge {
            margin-left: auto;
            padding: 2px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            background: var(--border-color);
            color: var(--text-secondary);
        }
        .sidebar-nav .nav-item .badge.badge-warning { background: rgba(255,184,0,0.2); color: var(--warning); }
        .sidebar-nav .nav-item .badge.badge-danger { background: rgba(255,0,127,0.2); color: var(--danger); }
        .sidebar-footer {
            border-top: 1px solid var(--border-color);
            padding: 16px 20px;
        }
        .admin-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .admin-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(212,175,55,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .admin-details { flex: 1; min-width: 0; }
        .admin-name { font-size: 14px; font-weight: 600; color: var(--text-primary); }
        .admin-email { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-logout {
            width: 100%;
            padding: 10px;
            background: rgba(255,0,127,0.1);
            border: 1px solid rgba(255,0,127,0.2);
            border-radius: 8px;
            color: var(--danger);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-logout:hover { background: rgba(255,0,127,0.2); }
        
        .main-content {
            flex: 1;
            margin-left: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: var(--topbar-height);
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-card);
            flex-shrink: 0;
        }
        .top-bar-left { display: flex; align-items: center; gap: 16px; }
        .btn-toggle-sidebar {
            display: none;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
        }
        .btn-toggle-sidebar:hover { color: var(--text-primary); }
        #page-title { font-size: 18px; font-weight: 700; }
        .top-bar-right { display: flex; align-items: center; gap: 20px; }
        .top-bar-stats { display: flex; gap: 16px; }
        .stat-item { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        .stat-label { color: var(--text-muted); }
        .stat-value { font-weight: 700; color: var(--text-primary); }
        .btn-refresh {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 8px 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-refresh:hover { border-color: var(--primary); color: var(--primary); }
        
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }
        .loading-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            height: 200px;
            color: var(--text-muted);
        }
        .loading-spinner i { font-size: 32px; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 20px;
            text-align: center;
        }
        .stat-card .number { font-size: 32px; font-weight: 700; }
        .stat-card .label { font-size: 13px; color: var(--text-secondary); margin-top: 4px; }
        .stat-card .number.gold { color: var(--primary); }
        .stat-card .number.green { color: var(--success); }
        .stat-card .number.red { color: var(--danger); }
        .stat-card .number.yellow { color: var(--warning); }
        
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            overflow: hidden;
        }
        .table-container table {
            width: 100%;
            border-collapse: collapse;
        }
        .table-container th {
            text-align: left;
            padding: 12px 16px;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .table-container td {
            padding: 12px 16px;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }
        .table-container tr:last-child td { border-bottom: none; }
        .table-container tr:hover { background: rgba(255,255,255,0.02); }
        
        .status-badge {
            padding: 3px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-badge.pending { background: rgba(255,255,255,0.1); color: var(--text-secondary); }
        .status-badge.confirmed { background: rgba(0,255,0,0.15); color: var(--success); }
        .status-badge.suspicious { background: rgba(255,184,0,0.15); color: var(--warning); }
        .status-badge.rejected { background: rgba(255,0,127,0.15); color: var(--danger); }
        .status-badge.field-suspicious { background: rgba(255,184,0,0.25); color: var(--warning); border: 1px solid var(--warning); }
        .status-badge.field-confirmed { background: rgba(0,255,0,0.15); color: var(--success); border: 1px solid var(--success); }
        
        .btn-sm {
            padding: 4px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-sm:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm.primary { background: var(--primary); color: #000; border-color: var(--primary); }
        .btn-sm.primary:hover { background: var(--primary-dark); }
        .btn-sm.danger { border-color: var(--danger); color: var(--danger); }
        .btn-sm.danger:hover { background: rgba(255,0,127,0.1); }
        .btn-sm.warning { border-color: var(--warning); color: var(--warning); }
        .btn-sm.warning:hover { background: rgba(255,184,0,0.1); }
        .btn-sm.success { border-color: var(--success); color: var(--success); }
        .btn-sm.success:hover { background: rgba(0,255,0,0.1); }
        
        .empty-state {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        .empty-state i { font-size: 48px; margin-bottom: 16px; }
        
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.hidden { display: none; }
        .modal-box {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            max-width: 700px;
            width: 95%;
            max-height: 85vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border-color);
        }
        .modal-header h3 { font-size: 18px; }
        .modal-close {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-footer {
            display: flex;
            gap: 12px;
            justify-content: flex-end;
            margin-top: 16px;
            padding-top: 12px;
            border-top: 1px solid var(--border-color);
        }
        .btn-modal-cancel {
            padding: 8px 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .btn-modal-confirm {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: #000;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-modal-confirm.danger { background: var(--danger); color: #fff; }
        
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .toast {
            padding: 12px 20px;
            border-radius: 8px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 14px;
            animation: slideIn 0.3s ease;
            max-width: 360px;
        }
        .toast.success { border-color: var(--success); color: var(--success); }
        .toast.error { border-color: var(--danger); color: var(--danger); }
        .toast.warning { border-color: var(--warning); color: var(--warning); }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* ===== 欄位級存疑樣式 ===== */
        .field-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 4px;
            background: rgba(255,255,255,0.02);
        }
        .field-item .field-name { font-weight: 600; font-size: 13px; }
        .field-item .field-value { font-size: 13px; color: var(--text-secondary); max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .field-item .field-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .field-item .field-status {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
        }
        .field-item .field-status.status-pending { background: rgba(255,255,255,0.05); color: var(--text-muted); }
        .field-item .field-status.status-confirmed { background: rgba(0,255,0,0.15); color: var(--success); }
        .field-item .field-status.status-suspicious { background: rgba(255,184,0,0.2); color: var(--warning); }
        .field-item .field-checkbox { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
        .field-item.border-suspicious { border-color: var(--warning); background: rgba(255,184,0,0.05); }
        .field-item.border-confirmed { border-color: var(--success); background: rgba(0,255,0,0.03); }
        
        .field-group-label {
            font-size: 12px;
            color: var(--text-muted);
            margin: 12px 0 6px 0;
            font-weight: 600;
        }
        
        /* ===== 響應式 ===== */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-close {
                display: block;
            }
            .main-content {
                margin-left: 0;
            }
            .btn-toggle-sidebar {
                display: block;
            }
            .top-bar-stats { display: none; }
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .login-box { padding: 32px 20px; margin: 16px; }
            .field-item { flex-wrap: wrap; gap: 4px; }
            .field-item .field-value { max-width: 100px; }
        }
        @media (max-width: 480px) {
            .field-item .field-value { max-width: 60px; }
            .field-item .field-actions { flex-wrap: wrap; }
        }
        
        /* 側邊欄遮罩 */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }
        .sidebar-overlay.show {
            display: block;
        }
    </style>
</head>
<body>

<!-- ===== 登入頁面 ===== -->
<div id="login-page" class="login-container">
    <div class="login-box">
        <div class="login-header">
            <div class="login-icon">🛡️</div>
            <h1>爪爪情報站</h1>
            <p class="login-subtitle">管理後台</p>
        </div>
        
        <div id="login-error" class="login-error"></div>
        
        <button onclick="handleGoogleLogin()" class="btn-google">
            <svg width="20" height="20" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
            </svg>
            使用 Google 帳號登入
        </button>
        
        <div class="login-divider">或</div>
        
        <form id="login-form" onsubmit="return handlePasswordLogin(event)">
            <div class="form-group">
                <label><i class="fas fa-envelope"></i> 電子郵件</label>
                <input type="email" id="login-email" placeholder="admin@example.com">
            </div>
            <div class="form-group">
                <label><i class="fas fa-lock"></i> 密碼</label>
                <input type="password" id="login-password" placeholder="請輸入密碼">
            </div>
            <button type="submit" class="btn-login"><i class="fas fa-sign-in-alt"></i> 密碼登入</button>
        </form>
        
        <div id="login-loading" class="login-loading">
            <i class="fas fa-spinner fa-spin"></i> 正在登入...
        </div>
        
        <div class="login-footer">🔒 僅限管理員訪問</div>
    </div>
</div>

<!-- ===== 側邊欄遮罩 ===== -->
<div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

<!-- ===== 後台主界面 ===== -->
<div id="admin-app" class="admin-app hidden">
    <aside class="sidebar" id="sidebar">
        <button class="sidebar-close" onclick="closeSidebar()" title="關閉側邊欄">✕</button>
        <div class="sidebar-brand">
            <span class="brand-icon">🛡️</span>
            <span class="brand-text">爪爪後台</span>
        </div>
        <nav class="sidebar-nav">
            <ul>
                <li class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')">
                    <i class="fas fa-chart-pie"></i><span>儀表板</span>
                </li>
                <li class="nav-item" data-tab="stores" onclick="switchTab('stores')">
                    <i class="fas fa-store"></i><span>新店審核</span>
                    <span class="badge badge-warning" id="badge-stores">0</span>
                </li>

// ============================================================
// Google OAuth 登入
// ============================================================
async function handleGoogleLogin() {
    if (isLoggingIn || !sb) return;
    isLoggingIn = true;
    hideLoginError();
    showLoading(true);
    
    try {
        const redirectTo = window.location.href;
        const { data, error } = await sb.auth.signInWithOAuth({
            provider: 'google',
            options: {
                redirectTo: redirectTo,
                queryParams: { access_type: 'offline', prompt: 'consent' }
            }
        });
        if (error) throw error;
    } catch (error) {
        showLoginError('登入失敗: ' + (error.message || '請稍後再試'));
        showLoading(false);
        isLoggingIn = false;
    }
}

// ============================================================
// 密碼登入 (備用)
// ============================================================
async function handlePasswordLogin(e) {
    e.preventDefault();
    hideLoginError();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value.trim();
    if (!email || !password) { showLoginError('請輸入電子郵件和密碼'); return; }
    showLoading(true);
    try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) throw error;
        await handleSuccessfulLogin(data.user);
    } catch (error) {
        showLoginError('登入失敗: ' + (error.message || '請檢查帳號密碼'));
        showLoading(false);
    }
}

// ============================================================
// 登入成功處理
// ============================================================
async function handleSuccessfulLogin(user) {
    try {
        const { data: profile, error: profileError } = await sb
            .from('user_profiles')
            .select('id, display_name, email, role')
            .eq('id', user.id)
            .single();
        
        if (profileError) {
            const { data: newProfile, error: insertError } = await sb
                .from('user_profiles')
                .insert({
                    id: user.id,
                    display_name: user.user_metadata?.full_name || user.email?.split('@')[0] || '管理員',
                    email: user.email,
                    role: 'admin',
                    is_anonymous: false
                })
                .select()
                .single();
            if (insertError) throw insertError;
            currentUser = newProfile;
        } else {
            if (profile.role !== 'admin') {
                await sb.auth.signOut();
                throw new Error('您沒有管理員權限');
            }
            currentUser = profile;
        }
        
        showAdminApp(currentUser);
        toast('登入成功！');
    } catch (error) {
        await sb.auth.signOut();
        showLoginError('權限驗證失敗: ' + error.message);
        showLoading(false);
    }
}

function showAdminApp(user) {
    document.getElementById('login-page').classList.add('hidden');
    document.getElementById('admin-app').classList.remove('hidden');
    document.getElementById('admin-name').textContent = user.display_name || '管理員';
    document.getElementById('admin-email-display').textContent = user.email || '';
    document.getElementById('admin-avatar').textContent = user.display_name?.charAt(0) || '👤';
    showLoading(false);
    isLoggingIn = false;
    loadDashboard();
}

async function handleLogout() {
    await sb.auth.signOut();
    currentUser = null;
    document.getElementById('admin-app').classList.add('hidden');
    document.getElementById('login-page').classList.remove('hidden');
    toast('已登出');
}

// ============================================================
// OAuth 回調處理
// ============================================================
async function handleOAuthCallback() {
    const hash = window.location.hash;
    if (hash && hash.includes('access_token')) {
        showLoading(true);
        try {
            const { data, error } = await sb.auth.getSession();
            if (error) throw error;
            if (data.session) {
                await handleSuccessfulLogin(data.session.user);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        } catch (error) {
            showLoginError('登入處理失敗: ' + error.message);
            showLoading(false);
        }
    }
}

async function checkExistingSession() {
    try {
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
            const { data: profile } = await sb
                .from('user_profiles')
                .select('id, display_name, email, role')
                .eq('id', session.user.id)
                .single();
            if (profile && profile.role === 'admin') {
                currentUser = profile;
                showAdminApp(profile);
                return true;
            } else {
                await sb.auth.signOut();
            }
        }
    } catch (error) { console.warn('⚠️ 檢查 session 失敗:', error); }
    return false;
}

// ============================================================
// ✅ 完整店鋪檢視 (含欄位級存疑)
// ============================================================
async function viewStoreDetail(storeId) {
    currentViewStoreId = storeId;
    currentFieldFlags = {};
    
    try {
        const { data: store, error } = await sb
            .from('claw_stores')
            .select('*')
            .eq('id', storeId)
            .single();
        if (error) throw error;
        
        // 取得該店鋪所有欄位的存疑狀態
        const { data: fieldStatuses } = await sb
            .from('field_status')
            .select('*')
            .eq('table_name', 'claw_stores')
            .eq('record_id', storeId);
        
        // 建立欄位狀態對照表
        const fieldStatusMap = {};
        if (fieldStatuses) {
            fieldStatuses.forEach(fs => {
                fieldStatusMap[fs.field_name] = fs.status;
            });
        }
        
        // 定義要顯示的欄位
        const fields = [
            { key: 'name', label: '店名', value: store.name || '未填' },
            { key: 'region', label: '地區', value: store.region || '未填' },
            { key: 'addr', label: '地址', value: store.addr || '未填' },
            { key: 'address_detail', label: '詳細地址', value: store.address_detail || '未填' },
            { key: 'size', label: '規模', value: store.size || '未填' },
            { key: 'has_staff', label: '有場務', value: store.has_staff !== undefined ? (store.has_staff ? '有' : '無') : '未填' },
            { key: 'has_e_coin', label: '電子兌幣', value: store.has_e_coin !== undefined ? (store.has_e_coin ? '有' : '無') : '未填' },
            { key: 'photo', label: '照片', value: store.photo || '無照片' },
            { key: 'submitted_by', label: '提交者', value: store.submitted_by || '未知' },
        ];
        
        // 計算整體狀態
        const hasSuspicious = Object.values(fieldStatusMap).some(s => s === 'suspicious');
        const allConfirmed = Object.values(fieldStatusMap).every(s => s === 'confirmed') && Object.keys(fieldStatusMap).length > 0;
        const overallStatus = hasSuspicious ? 'suspicious' : (allConfirmed ? 'confirmed' : 'pending');
        
        // 生成欄位 HTML
        let fieldsHtml = fields.map(f => {
            const status = fieldStatusMap[f.key] || 'pending';
            const statusLabels = {
                'pending': '<span class="field-status status-pending">⏳ 待查閱</span>',
                'confirmed': '<span class="field-status status-confirmed">✅ 已確認</span>',
                'suspicious': '<span class="field-status status-suspicious">⚠️ 存疑</span>'
            };
            const borderClass = status === 'suspicious' ? 'border-suspicious' : (status === 'confirmed' ? 'border-confirmed' : '');
            const isPhoto = f.key === 'photo';
            const displayValue = isPhoto && f.value !== '無照片' && f.value !== '未填' 
                ? `<img src="${f.value}" style="max-height:60px;border-radius:4px;object-fit:cover;" />` 
                : f.value;
            
            return `
                <div class="field-item ${borderClass}" data-field="${f.key}">
                    <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;">
                        <input type="checkbox" class="field-checkbox" id="field-${f.key}" data-field="${f.key}" ${status === 'suspicious' ? 'checked' : ''}>
                        <span class="field-name">${f.label}</span>
                        <span class="field-value">${displayValue}</span>
                    </div>
                    <div class="field-actions">
                        ${statusLabels[status] || statusLabels.pending}
                    </div>
                </div>
            `;
        }).join('');
        
        openModal(`
            <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">
                <div>
                    <h3 style="font-size:18px;">📋 ${store.name}</h3>
                    <div style="display:flex;gap:8px;margin-top:4px;flex-wrap:wrap;">
                        <span class="status-badge ${overallStatus}">${overallStatus === 'suspicious' ? '⚠️ 有存疑欄位' : (overallStatus === 'confirmed' ? '✅ 已完整確認' : '⏳ 待審核')}</span>
                        <span style="font-size:12px;color:var(--text-muted);">📍 ${store.region || '未知地區'}</span>
                    </div>
                </div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    <button class="btn-sm primary" onclick="confirmAllFields('${storeId}')">✅ 全部確認</button>
                    <button class="btn-sm warning" onclick="applyFieldFlags('${storeId}')">⚠️ 標記選中欄位為存疑</button>
                </div>
            </div>
            <div style="margin-top:12px;">
                <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px;">
                    💡 勾選欄位後點擊「標記選中欄位為存疑」 | 綠色=已確認 | 黃色=存疑 | 灰色=待查閱
                </div>
                ${fieldsHtml}
            </div>
            <div style="margin-top:12px;padding:12px;background:rgba(255,255,255,0.03);border-radius:8px;border:1px solid var(--border-color);">
                <div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;">
                    <span style="font-size:12px;color:var(--text-muted);">📌 提交時間: ${new Date(store.created_at).toLocaleString()}</span>
                    <span style="font-size:12px;color:var(--text-muted);">| 提交者: ${store.submitted_by || '未知'}</span>
                    ${store.photo ? `<a href="${store.photo}" target="_blank" style="font-size:12px;color:var(--primary);">🔍 查看原圖</a>` : ''}
                </div>
            </div>
        `, '', '關閉');
        
    } catch (error) {
        toast('載入失敗: ' + error.message, 'error');
    }
}

async function confirmAllFields(storeId) {
    if (!confirm('確定要確認此店鋪的所有欄位嗎？')) return;
    
    try {
        // 1. 更新店鋪整體狀態
        const { error } = await sb
            .from('claw_stores')
            .update({ admin_overall_status: 'confirmed' })
            .eq('id', storeId);
        if (error) throw error;
        
        // 2. 更新或建立所有欄位的 field_status 為 confirmed
        const fields = ['name', 'region', 'addr', 'address_detail', 'size', 'has_staff', 'has_e_coin', 'photo', 'submitted_by'];
        for (const field of fields) {
            await sb
                .from('field_status')
                .upsert({
                    table_name: 'claw_stores',
                    record_id: storeId,
                    field_name: field,
                    status: 'confirmed',
                    flagged_by: currentUser?.display_name || 'admin',
                    resolved: true,
                    resolved_at: new Date().toISOString()
                }, { onConflict: 'table_name, record_id, field_name' });
        }
        
        toast('✅ 已完整確認此店鋪所有欄位');
        closeModal();
        loadStores();
        loadDashboard();
    } catch (error) {
        toast('操作失敗: ' + error.message, 'error');
    }
}

// ============================================================
// ✅ 標記選中欄位為存疑
// ============================================================
async function applyFieldFlags(storeId) {
    // 收集所有被勾選的欄位
    const checkboxes = document.querySelectorAll('.field-checkbox:checked');
    if (checkboxes.length === 0) {
        toast('請至少勾選一個欄位', 'warning');
        return;
    }
    
    const selectedFields = Array.from(checkboxes).map(cb => cb.dataset.field);
    
    // 確認操作
    if (!confirm(`確定要將 ${selectedFields.length} 個欄位標記為「存疑」嗎？`)) return;
    
    try {
        // 1. 更新每個欄位的狀態為 suspicious
        for (const field of selectedFields) {
            await sb
                .from('field_status')
                .upsert({
                    table_name: 'claw_stores',
                    record_id: storeId,
                    field_name: field,
                    status: 'suspicious',
                    flagged_by: currentUser?.display_name || 'admin',
                    flagged_at: new Date().toISOString(),
                    note: '管理員標記存疑',
                    resolved: false
                }, { onConflict: 'table_name, record_id, field_name' });
        }
        
        // 2. 更新店鋪整體狀態為 suspicious
        await sb
            .from('claw_stores')
            .update({ admin_overall_status: 'suspicious' })
            .eq('id', storeId);
        
        toast(`⚠️ 已將 ${selectedFields.length} 個欄位標記為存疑`);
        closeModal();
        loadStores();
        loadDashboard();
    } catch (error) {
        toast('操作失敗: ' + error.message, 'error');
    }
}

// ============================================================
// 存疑清單 (顯示所有欄位級存疑)
// ============================================================
async function loadFlagged() {
    const container = document.getElementById('tab-content');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span>載入中...</span></div>';
    try {
        const { data, error } = await sb
            .from('field_status')
            .select('*')
            .eq('status', 'suspicious')
            .eq('resolved', false)
            .order('flagged_at', { ascending: false });
        if (error) throw error;
        
        // 獲取店鋪名稱
        const storeIds = [...new Set(data.map(f => f.record_id))];
        let storeNames = {};
        if (storeIds.length > 0) {
            const { data: stores } = await sb
                .from('claw_stores')
                .select('id, name')
                .in('id', storeIds);
            if (stores) {
                stores.forEach(s => { storeNames[s.id] = s.name; });
            }
        }
        
        container.innerHTML = `
            <div style="margin-bottom:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;">
                <span style="font-size:13px;color:var(--text-muted);">⚠️ 共 ${data.length} 個欄位被標記存疑</span>
                <button class="btn-sm" onclick="loadFlagged()" style="margin-left:auto;">🔄 重新整理</button>
            </div>
            <div class="table-container">
                <table>
                    <thead><tr><th>店鋪</th><th>欄位</th><th>標記者</th><th>原因</th><th>時間</th><th>操作</th></tr></thead>
                    <tbody>
                        ${data.length === 0 ? `<tr><td colspan="6" class="empty-state">🎉 沒有存疑項目</td></tr>` :
                        data.map(f => `
                            <tr>
                                <td><strong>${storeNames[f.record_id] || f.record_id}</strong></td>
                                <td><span class="status-badge field-suspicious">${f.field_name}</span></td>
                                <td>${f.flagged_by || '未知'}</td>
                                <td>${f.note || '無說明'}</td>
                                <td>${new Date(f.flagged_at).toLocaleDateString()}</td>
                                <td>
                                    <button class="btn-sm success" onclick="resolveFieldFlag('${f.id}')">✅ 解決</button>
                                    <button class="btn-sm" onclick="viewStoreDetail('${f.record_id}')">📋 查看</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    } catch (error) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>載入失敗: ${error.message}</p></div>`;
    }
}

// ============================================================
// 解決單一欄位存疑
// ============================================================
async function resolveFieldFlag(flagId) {
    if (!confirm('確定要解決此存疑項目嗎？')) return;
    try {
        const { error } = await sb
            .from('field_status')
            .update({ status: 'confirmed', resolved: true, resolved_at: new Date().toISOString() })
            .eq('id', flagId);
        if (error) throw error;
        toast('✅ 已解決此存疑項目');
        loadFlagged();
        loadDashboard();
    } catch (error) {
        toast('操作失敗: ' + error.message, 'error');
    }
}

// ============================================================
// 用戶管理
// ============================================================
async function loadUsers() {
    const container = document.getElementById('tab-content');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span>載入中...</span></div>';
    try {
        const { data, error } = await sb
            .from('user_profiles')
            .select('id, display_name, email, role, risk_level, created_at')
            .order('created_at', { ascending: false });
        if (error) throw error;
        container.innerHTML = `
            <div class="table-container">
                <table>
                    <thead><tr><th>用戶</th><th>Email</th><th>角色</th><th>風險等級</th><th>操作</th></tr></thead>
                    <tbody>
                        ${data.length === 0 ? `<tr><td colspan="5" class="empty-state">暫無用戶</td></tr>` :
                        data.map(u => `
                            <tr>
                                <td>${u.display_name || '未命名'}</td>
                                <td>${u.email || '無'}</td>
                                <td><span class="status-badge ${u.role === 'admin' ? 'confirmed' : 'pending'}">${u.role || 'user'}</span></td>
                                <td>${u.risk_level || 'normal'}</td>
                                <td><button class="btn-sm" onclick="viewUser('${u.id}')">查看</button></td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    } catch (error) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>載入失敗: ${error.message}</p></div>`;
    }
}

async function viewUser(userId) {
    try {
        const { data, error } = await sb
            .from('user_profiles')
            .select('*')
            .eq('id', userId)
            .single();
        if (error) throw error;
        openModal('👤 用戶詳情', `
            <div style="display:grid;gap:8px;">
                <p><strong>名稱：</strong>${data.display_name || '未命名'}</p>
                <p><strong>Email：</strong>${data.email || '無'}</p>
                <p><strong>角色：</strong>${data.role || 'user'}</p>
                <p><strong>風險等級：</strong>${data.risk_level || 'normal'}</p>
                <p><strong>積分：</strong>${data.total_points || 0}</p>
                <p><strong>加入時間：</strong>${new Date(data.created_at).toLocaleString()}</p>
            </div>
        `, '關閉');
    } catch (error) {
        toast('載入失敗: ' + error.message, 'error');
    }
}

// ============================================================
// 審計日誌
// ============================================================
async function loadAudit() {
    const container = document.getElementById('tab-content');
    container.innerHTML = '<div class="loading-spinner"><i class="fas fa-spinner fa-spin"></i><span>載入中...</span></div>';
    try {
        const { data, error } = await sb
            .from('field_status_history')
            .select('*')
            .order('changed_at', { ascending: false })
            .limit(50);
        if (error) throw error;
        container.innerHTML = `
            <div class="table-container">
                <table>
                    <thead><tr><th>欄位ID</th><th>舊狀態</th><th>新狀態</th><th>操作者</th><th>時間</th></tr></thead>
                    <tbody>
                        ${data.length === 0 ? `<tr><td colspan="5" class="empty-state">暫無審計記錄</td></tr>` :
                        data.map(h => `
                            <tr>
                                <td style="font-size:12px;color:var(--text-muted);">${h.field_status_id?.slice(0,8) || '未知'}</td>
                                <td><span class="status-badge ${h.old_status || 'pending'}">${h.old_status || '無'}</span></td>
                                <td><span class="status-badge ${h.new_status || 'pending'}">${h.new_status || '無'}</span></td>
                                <td>${h.changed_by || '系統'}</td>
                                <td>${new Date(h.changed_at).toLocaleString()}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
        `;
    } catch (error) {
        container.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-circle"></i><p>載入失敗: ${error.message}</p></div>`;
    }
}

// ============================================================
// 刷新
// ============================================================
function refreshAll() {
    toast('🔄 重新整理中...');
    const loaders = { dashboard: loadDashboard, stores: loadStores, flagged: loadFlagged, users: loadUsers, audit: loadAudit };
    if (loaders[currentTab]) loaders[currentTab]();
}

// ============================================================
// 初始化
// ============================================================
document.addEventListener('DOMContentLoaded', async function() {
    await handleOAuthCallback();
    const hasSession = await checkExistingSession();
    if (!hasSession) {
        document.getElementById('login-page').classList.remove('hidden');
        document.getElementById('admin-app').classList.add('hidden');
        showLoading(false);
    }
});
</script>
